<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Needle logo">
  <defs>
    <radialGradient id="nTile" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#232323"/>
      <stop offset="1" stop-color="#0B0B0B"/>
    </radialGradient>
    <linearGradient id="nPlay" x1="40" y1="28" x2="104" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A6E"/>
      <stop offset="0.55" stop-color="#E5484D"/>
      <stop offset="1" stop-color="#B8303A"/>
    </linearGradient>
    <linearGradient id="nSteel" x1="114" y1="36" x2="40" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E2E2E2"/>
      <stop offset="1" stop-color="#A3A3A3"/>
    </linearGradient>
    <filter id="nShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#nTile)"/>

  <!-- The play button behind, with a sewn edge. -->
  <path d="M45 30 L45 98 L101 64 Z" fill="url(#nPlay)" stroke="url(#nPlay)" stroke-width="13" stroke-linejoin="round"/>
  <path d="M53 43 L53 85 L88.5 64 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="2.6"
        stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5.2 4.6"/>

  <!-- The needle in front, lying across the button's right side, with its shadow. -->
  <path d="M40 118 L110.9 33.2 Q119 30.4 117.1 38.8 Z" transform="translate(3 4)" fill="#000" fill-opacity="0.45" filter="url(#nShadow)"/>
  <path d="M40 118 L110.9 33.2 Q119 30.4 117.1 38.8 Z" fill="url(#nSteel)"/>
  <path d="M49.6 104.4 L106.6 41.3" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
  <path d="M105.3 45.7 L111 39.3" stroke="#141414" stroke-width="3" stroke-linecap="round"/>

  <!-- The thread, through the eye and looping back over the top. -->
  <path d="M108.2 42.5 C104 22 86 12 77 20 C70 26 78 34.5 86 27.5" fill="none" stroke="#F4F4F4" stroke-width="3.4" stroke-linecap="round"/>
</svg>
