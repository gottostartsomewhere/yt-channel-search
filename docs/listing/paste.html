me liste med de samme filtrene for alle som har Needle\n- Tastatur: / for å søke, j og k for å flytte, x for å velge\n\nSTATISTIKK\n- Videolengdene og årene der en kanal gjør det best\n- Sammenlign to kanaler side om side\n- En overvåkingsliste som finner videoer som slår kanalens vanlige visninger\n\nIngen innlogging, ingen konto, ingenting sendes noe sted. Alt kjører i nettleseren din.\n\nGrensesnittet i utvidelsen er på engelsk.\n\nIkke tilknyttet YouTube eller Google."},{"code":"fi","lang":"Finnish","d":"Uutta: mykistä kanava suoraan YouTuben omasta ⋮-valikosta, niin se katoaa hausta, etusivulta, tilauksista ja Shortsista. YouTuben valinta jättää kanava suosittelematta ei koske koskaan hakua. Tämä koskee.\n\nYouTuben haku ei tiedä, mitä olet jo katsonut, ei osaa suodattaa pituuden tai katselukertojen mukaan, ja kanavan sisäinen haku katsoo vain otsikoita. Needle korjaa tämän suoraan YouTuben hakukentässä.\n\nMYKISTÄ KANAVA, KAIKKIALLA\n- ”Mute channel everywhere” jokaisen videon ⋮-valikossa\n- Poissa hausta, etusivulta, tilauksista ja katsomasi videon vierestä\n- Myös sen Shortsit katoavat, etusivulta ja hausta\n- Mykistä sanoja: jokainen video, jonka otsikossa on jokin niistä, katoaa\n- Kumoa heti, poista mykistys milloin vain ja tuo lista toisesta estotyökalusta\n\nHAKUKENTÄSSÄ\n- Katso myöhemmin, tykkäämäsi videot ja historiasi näkyvät jo kirjoittaessa\n- Kirjoita suodattimia: <20m, >100k, unwatched, date:week, @kanava\n- in:playlists hakee kaikista tallentamistasi soittolistoista\n- is:fresh piilottaa sen, mitä sinulle on jo näytetty\n- Seuraa hakua ja näe jokaisesta pikkukuvasta, mitä olet jo katsonut\n\nHAE KANAVALTA\nPaina neulapainiketta minkä tahansa kanavan Videot-välilehdellä. Needle lukee kanavan kaikki videot, ei vain jo ladattuja.\n- Suodata pituuden, katselukertojen, päivämäärän ja hakusanan mukaan\n- Piilota loppuun katsotut tai löydä kesken jääneet\n- Valitse, montako minuuttia sinulla on, ja näe vain se, mikä mahtuu\n\nHISTORIA JA KATSO MYÖHEMMIN\n- Kaikki, minkä aloitit etkä koskaan katsonut loppuun\n- Suodata kanavan, pituuden, katselukertojen tai katseluajan mukaan\n- Löydä se video, jonka tiedät katsoneesi, ilman loputonta vierittämistä\n\nMIKÄ TAHANSA SOITTOLISTA JA TILAUKSESI\n- Kuinka pitkä mikä tahansa soittolista on ja paljonko siitä on jäljellä\n- Hae ja suodata mitä tahansa soittolistaa, omaasi tai jonkun toisen, kokonaan\n- Tilauksesi, vain katsomattomat ja alle 20 minuutin videot\n- Himmennä tai piilota jo katsotut videot etusivulla ja Tilauksissa\n\nSIIVOA, TOISTA, JAA\n- Siivoa Katso myöhemmin ja omat soittolistasi, poista tykkäykset kerralla ja karsi poistetut videot, kumoamisen ja arkiston kanssa, josta kaiken saa takaisin\n- Toista suodattamasi järjestyksessä tai kopioi linkit NotebookLM:ää varten\n- Jaa suodatin linkkinä: se avaa saman listan samoilla suodattimilla kenelle tahansa, jolla on Needle\n- Näppäimistö: / hakuun, j ja k liikkumiseen, x valitsemiseen\n\nTILASTOT\n- Videopituudet ja vuodet, joina kanava menestyy parhaiten\n- Vertaa kahta kanavaa rinnakkain\n- Seurantalista, joka löytää videot, jotka ylittävät kanavansa tavalliset katselukerrat\n\nEi kirjautumista, ei tiliä, mitään ei lähetetä minnekään. Kaikki toimii selaimessasi.\n\nLaajennuksen käyttöliittymä on englanniksi.\n\nEi liity YouTubeen tai Googleen."},{"code":"pt_PT","lang":"European Portuguese","d":"Novo: silencie um canal a partir do próprio menu ⋮ do YouTube, e desaparece da pesquisa, do início, das subscrições e dos Shorts. A opção do YouTube de não recomendar um canal nunca afeta a pesquisa. Esta afeta.\n\nA pesquisa do YouTube não sabe o que já viu, não filtra por duração nem por visualizações, e a pesquisa num canal só procura nos títulos. O Needle resolve isso, diretamente na barra de pesquisa do YouTube.\n\nSILENCIE UM CANAL, EM TODO O LADO\n- \"Mute channel everywhere\" no menu ⋮ de cada vídeo\n- Desaparece da pesquisa, do início, das subscrições e dos vídeos ao lado do que está a ver\n- Os Shorts dele tam  acima das visualizações habituais do canal\n\nSem início de sessão, sem conta, nada é enviado para lado nenhum. Funciona no seu navegador.\n\nA interface da extensão está em inglês.\n\nNão é afiliada ao YouTube nem à Google."},{"code":"ca","lang":"Catalan","d":"Novetat: silencia un canal des del menú ⋮ del mateix YouTube i desapareix de la cerca, l'inici, les subscripcions i els Shorts. L'opció de YouTube de no recomanar un canal no toca mai la cerca. Aquesta sí.\n\nLa cerca de YouTube no sap què ja has vist, no filtra per durada ni per visualitzacions, i la cerca dins d'un canal només mira els títols. Needle ho arregla, directament a la barra de cerca de YouTube.\n\nSILENCIA UN CANAL, A TOT ARREU\n- «Mute channel everywhere» al menú ⋮ de cada vídeo\n- Desapareix de la cerca, l'inici, les subscripcions i els vídeos al costat del que estàs mirant\n- També se'n van els seus Shorts, a l'inici i a la cerca\n- Silencia paraules: qualsevol vídeo que en tingui una al títol desapareix\n- Desfés-ho a l'instant, deixa de silenciar quan vulguis i porta la teva llista d'un altre bloquejador\n\nA LA BARRA DE CERCA\n- Els teus vídeos de Mira més tard, els que t'agraden i l'historial apareixen mentre escrius\n- Escriu filtres: <20m, >100k, unwatched, date:week, @canal\n- in:playlists cerca a totes les llistes de reproducció que has desat\n- is:fresh amaga el que ja se t'ha mostrat\n- Segueix una cerca i mira què has vist a cada miniatura\n\nCERCAR EN UN CANAL\nPrem el botó de l'agulla a la pestanya Vídeos de qualsevol canal. Needle llegeix tots els vídeos del canal, no només els que ja s'han carregat.\n- Filtra per durada, visualitzacions, data i paraula clau\n- Amaga el que has acabat o troba el que vas deixar a mitges\n- Tria els minuts que tens i mira només el que hi cap\n\nEL TEU HISTORIAL I MIRA MÉS TARD\n- Tot el que vas començar i no vas acabar mai\n- Filtra per canal, durada, visualitzacions o per quan ho vas veure\n- Troba aquell vídeo que saps que vas veure, sense haver de desplaçar-te sense fi\n\nQUALSEVOL LLISTA I LES TEVES SUBSCRIPCIONS\n- Quant dura qualsevol llista de reproducció i quant te'n queda\n- Cerca i filtra qualsevol llista de reproducció, teva o d'una altra persona, sencera\n- Les teves subscripcions, només el que no has vist i de menys de 20 minuts\n- Atenua o amaga els vídeos que ja has vist a Inici i a Subscripcions\n\nNETEJAR, REPRODUIR, COMPARTIR\n- Neteja Mira més tard i les teves pròpies llistes, treu m'agrades en bloc i elimina els vídeos esborrats, amb desfer i un arxiu per recuperar el que vulguis\n- Reprodueix el que has filtrat, en ordre, o copia els enllaços per a NotebookLM\n- Comparteix un filtre com a enllaç: obre la mateixa llista amb els mateixos filtres per a qualsevol que tingui Needle\n- Teclat: / per cercar, j i k per moure't, x per seleccionar\n\nESTADÍSTIQUES\n- Les durades i els anys en què a un canal li va millor\n- Compara dos canals de costat\n- Una llista de seguiment que detecta vídeos que superen les visualitzacions habituals del seu canal\n\nSense iniciar sessió, sense compte, no s'envia res enlloc. Funciona al teu navegador.\n\nLa interfície de l'extensió és en anglès.\n\nNo està afiliada a YouTube ni a Google."},{"code":"sk","lang":"Slovak","d":"Novinka: stlmte kanál priamo z ponuky ⋮ na YouTube a zmizne z vyhľadávania, domovskej stránky, odberov aj Shorts. Možnosť YouTube neodporúčať kanál nikdy neovplyvní vyhľadávanie. Toto áno.\n\nVyhľadávanie na YouTube nevie, čo ste už videli, nevie filtrovať podľa dĺžky ani zhliadnutí a hľadanie v kanáli prechádza len názvy. Needle to opravuje priamo vo vyhľadávacom riadku YouTube.\n\nSTLMTE KANÁL, VŠADE\n- „Mute channel everywhere“ v ponuke ⋮ pri každom videu\n- Zmizne z vyhľadávania, domovskej stránky, odberov aj z videí vedľa toho, ktoré pozeráte\n- Zmiznú aj jeho Shorts, na domovskej stránke aj vo vyhľadávaní\n- Stlmenie slov: každé video, ktoré má také slovo v názve, zmizne\n- Okamžite vráťte späť, kedykoľvek zrušte stlmenie a preneste zoznam z iného blokovača\n\nVO VYHĽADÁVACOM RIADKU\n- Videá z Pozrieť neskôr, videá, ktoré sa vám páčia, a história sa zobrazujú už pri písaní\n- Píšte filtre: <20m, >100k, unwatched, date:week, @kanál\n- in:playlists prehľadá všetky playlisty, ktoré ste si uložili\n- is:fresh skryje to, čo vám už bolo ukázané\n- Sledujte vyhľadávanie a na každej miniatúre uvidíte, čo ste už videli\n\nHĽADANIE V KANÁLI\nKliknite na tlačidlo s ihlou na karte Videá ľubovoľného kanála. Needle prečíta všetky videá kanála, nielen tie už načítané.\n- Filtrujte podľa dĺžky, zhliadnutí, dátumu a kľúčového slova\n- Skryte, čo ste dopozerali, alebo nájdite, čo ste nechali v polovici\n- Zvoľte, koľko máte minút, a uvidíte len to, čo sa do nich zmestí\n\nHISTÓRIA A POZRIEŤ NESKÔR\n- Všetko, čo ste začali a nikdy nedokončili\n- Filtrujte podľa kanála, dĺžky, zhliadnutí alebo podľa toho, kedy ste to videli\n- Nájdite to video, ktoré ste určite videli, bez nekonečného posúvania\n\nĽUBOVOĽNÝ PLAYLIST A VAŠE ODBERY\n- Aký dlhý je akýkoľvek playlist a koľko vám z neho zostáva\n- Prehľadávajte a filtrujte ľubovoľný playlist, svoj aj cudzí, celý\n- Vaše odbery, len nepozreté videá kratšie ako 20 minút\n- Stlmte alebo skryte už pozreté videá na domovskej stránke a v Odberoch\n\nUPRATOVANIE, PREHRÁVANIE, ZDIEĽANIE\n- Upracte Pozrieť neskôr a vlastné playlisty, hromadne odoberte označenia Páči sa mi a vyhoďte odstránené videá, s možnosťou vrátiť späť a archívom, z ktorého všetko obnovíte\n- Prehrajte postupne, čo ste vyfiltrovali, alebo skopírujte odkazy pre NotebookLM\n- Zdieľajte filter ako odkaz: každému, kto má Needle, otvorí rovnaký zoznam s rovnakými filtrami\n- Klávesnica: / na hľadanie, j a k na pohyb, x na výber\n\nŠTATISTIKY\n- Dĺžky videí a roky, keď sa kanálu darí najlepšie\n- Porovnajte dva kanály vedľa seba\n- Zoznam sledovaných, ktorý nájde videá prekonávajúce bežné zhliadnutia svojho kanála\n\nBez prihlásenia, bez účtu, nič sa nikam neodosiela. Všetko beží vo vašom prehliadači.\n\nRozhranie rozšírenia je v angličtine.\n\nNie je pridružené k YouTube ani ku Googlu."},{"code":"hr","lang":"Croatian","d":"Novo: utišajte kanal iz samog YouTubeova izbornika ⋮ i nestaje iz pretraživanja, početne stranice, pretplata i Shorts videozapisa. YouTubeova opcija da ne preporučuje kanal nikad ne utječe na pretraživanje. Ova utječe.\n\nYouTube pretraživanje ne zna što ste već gledali, ne filtrira po trajanju ni pregledima, a pretraživanje unutar kanala gleda samo naslove. Needle to rješava izravno u traci za pretraživanje YouTubea.\n\nUTIŠAJTE KANAL, POSVUDA\n- „Mute channel everywhere” u izborniku ⋮ svakog videozapisa\n- Nestaje iz pretraživanja, s početne stranice, iz pretplata i iz videozapisa pored onog koji gledate\n- Nestaju i njegovi Shorts, na početnoj stranici i u pretraživanju\n- Utišajte riječi: svaki videozapis s jednom od njih u naslovu nestaje\n- Odmah poništite, ukinite utišavanje kad god želite i prenesite popis iz drugog blokatora\n\nU TRACI ZA PRETRAŽIVANJE\n- Gledaj kasnije, videozapisi koji vam se sviđaju i povijest pojavljuju se dok tipkate\n- Upišite filtre: <20m, >100k, unwatched, date:week, @kanal\n- in:playlists pretražuje sve popise za reprodukciju koje ste spremili\n- is:fresh skriva ono što vam je već prikazano\n- Pratite pretraživanje i na svakoj minijaturi vidite što ste već gledali\n\nPRETRAŽIVANJE KANALA\nKliknite gumb s iglom na kartici Videozapisi bilo kojeg kanala. Needle čita sve videozapise kanala, ne samo već učitane.\n- Filtrirajte po trajanju, pregledima, datumu i ključnoj riječi\n- Sakrijte odgledano do kraja ili pronađite napušteno na pola\n- Odaberite koliko minuta imate i vidite samo ono što stane\n\nPOVIJEST I GLEDAJ KASNIJE\n- Sve što ste započeli i nikad niste završili\n- Filtrirajte po kanalu, trajanju, pregledima ili vremenu gledanja\n- Pronađite onaj videozapis koji ste sigurno gledali, bez beskonačnog pomicanja\n\nBILO KOJI POPIS ZA REPRODUKCIJU I VAŠE PRETPLATE\n- Koliko traje bilo koji popis za reprodukciju i koliko vam je od njega ostalo\n- Pretražujte i filtrirajte bilo koji popis za reprodukciju, svoj ili tuđi, cijeli\n- Vaše pretplate, samo neodgledano i kraće od 20 minuta\n- Zatamnite ili sakrijte već odgledane videozapise na Početnoj i u Pretplatama\n\nPOSPREMITE, PUSTITE, PODIJELITE\n- Pospremite Gledaj kasnije i vlastite popise, uklonite oznake sviđanja odjednom i počistite izbrisane videozapise, uz poništavanje i arhivu iz koje sve vraćate\n- Pustite filtrirano redom ili kopirajte veze za NotebookLM\n- Podijelite filtar kao vezu: svakome tko ima Needle otvara isti popis s istim filtrima\n- Tipkovnica: / za pretraživanje, j i k za kretanje, x za odabir\n\nSTATISTIKA\n- Trajanja i godine u kojima kanal prolazi najbolje\n- Usporedite dva kanala jedan uz drugi\n- Popis praćenja koji pronalazi videozapise što nadmašuju uobičajene preglede svog kanala\n\nBez prijave, bez računa, ništa se nikamo ne šalje. Sve radi u vašem pregledniku.\n\nSučelje proširenja je na engleskom.\n\nNije povezano s YouTubeom ni Googleom."},{"code":"sl","lang":"Slovenian","d":"Novo: utišajte kanal kar iz YouTubovega menija ⋮ in izgine iz iskanja, domače strani, naročnin in Shorts. YouTubova možnost, da kanala ne priporoča, nikoli ne vpliva na iskanje. Ta vpliva.\n\nIskanje v YouTubu ne ve, kaj ste si že ogledali, ne filtrira po dolžini ali ogledih, iskanje znotraj kanala pa pregleda le naslove. Needle to popravi neposredno v iskalni vrstici YouTuba.\n\nUTIŠAJTE KANAL, POVSOD\n- »Mute channel everywhere« v meniju ⋮ vsakega videoposnetka\n- Izgine iz iskanja, z domače strani, iz naročnin in iz videoposnetkov ob tistem, ki ga gledate\n- Izginejo tudi njegovi Shorts, na domači strani in v iskanju\n- Utišajte besede: izgine vsak videoposnetek, ki ima v naslovu katero od njih\n- Takoj razveljavite, kadar koli prekličite utišanje in prenesite seznam iz drugega blokatorja\n\nV ISKALNI VRSTICI\n- Ogled pozneje, videoposnetki, ki so vam všeč, in zgodovina se prikažejo že med tipkanjem\n- Vpišite filtre: <20m, >100k, unwatched, date:week, @kanal\n- in:playlists išče po vseh seznamih predvajanja, ki ste jih shranili\n- is:fresh skrije, kar vam je bilo že prikazano\n- Spremljajte iskanje in na vsaki sličici vidite, kaj ste si že ogledali\n\nISKANJE PO KANALU\nKliknite gumb z iglo na zavihku Videoposnetki katerega koli kanala. Needle prebere vse videoposnetke kanala, ne le že naloženih.\n- Filtrirajte po dolžini, ogledih, datumu in ključni besedi\n- Skrijte, kar ste si ogledali do konca, ali poiščite, kar ste pustili na pol\n- Izberite, koliko minut imate, in vidite le tisto, kar gre vanje\n\nZGODOVINA IN OGLED POZNEJE\n- Vse, kar ste začeli in nikoli dokončali\n- Filtrirajte po kanalu, dolžini, ogledih ali času ogleda\n- Poiščite tisti videoposnetek, ki ste si ga zagotovo ogledali, brez neskončnega drsenja\n\nKATERI KOLI SEZNAM PREDVAJANJA IN VAŠE NAROČNINE\n- Kako dolg je kateri koli seznam predvajanja in koliko vam ga še ostane\n- Iščite in filtrirajte kateri koli seznam predvajanja, svoj ali tuj, v celoti\n- Vaše naročnine, samo neogledano in krajše od 20 minut\n- Zatemnite ali skrijte že ogledane videoposnetke na domači strani in v Naročninah\n\nPOSPRAVITE, PREDVAJAJTE, DELITE\n- Pospravite Ogled pozneje in lastne sezname predvajanja, odstranite všečke naenkrat in počistite izbrisane videoposnetke, z razveljavitvijo in arhivom, iz katerega vse vrnete\n- Predvajajte po vrsti, kar ste filtrirali, ali kopirajte povezave za NotebookLM\n- Delite filter kot povezavo: vsakomur, ki ima Needle, odpre isti seznam z istimi filtri\n- Tipkovnica: / za iskanje, j in k za premikanje, x za izbiro\n\nSTATISTIKA\n- Dolžine videoposnetkov in leta, ko je kanalu šlo najbolje\n- Primerjajte dva kanala drug ob drugem\n- Seznam spremljanja, ki najde videoposnetke, ki presegajo običajne oglede svojega kanala\n\nBrez prijave, brez računa, nič se nikamor ne pošilja. Vse teče v vašem brskalniku.\n\nVmesnik razširitve je v angleščini.\n\nNi povezano z YouTubom ali Googlom."},{"code":"bg","lang":"Bulgarian","d":"Ново: заглушете канал от собственото меню ⋮ на YouTube и той изчезва от търсенето, началната страница, абонаментите и Shorts. Опцията на YouTube да не препоръчва канал никога не засяга търсенето. Това го прави.\n\nТърсенето в YouTube не знае какво вече сте гледали, не филтрира по продължителност или гледания, а търсенето в канал проверява само заглавията. Needle поправя това директно в лентата за търсене на YouTube.\n\nЗАГЛУШЕТЕ КАНАЛ, НАВСЯКЪДЕ\n- „Mute channel everywhere“ в менюто ⋮ на всеки видеоклип\n- Изчезва от търсенето, началната страница, абонаментите и видеоклиповете до този, който гледате\n- Изчезват и неговите Shorts, на началната страница и в търсенето\n- Заглушаване на думи: всеки видеоклип с такава дума в заглавието изчезва\n- Отменете веднага, премахнете заглушаването по всяко време и пренесете списъка си от друг блокер\n\nВ ЛЕНТАТА ЗА ТЪРСЕНЕ\n- „Гледайте по-късно“, харесаните видеоклипове и историята се появяват, докато пишете\n- Въвеждайте филтри: <20m, >100k, unwatched, date:week, @канал\n- in:playlists търси във всички запазени плейлисти\n- is:fresh скрива това, което вече ви е било показано\n- Следете търсене и вижте какво сте гледали на всяка миниатюра\n\nТЪРСЕНЕ В КАНАЛ\nНатиснете бутона с иглата в раздела „Видеоклипове“ на всеки канал. Needle чете всички видеоклипове на канала, не само вече заредените.\n- Филтрирайте по продължителност, гледания, дата и ключова дума\n- Скрийте изгледаното докрай или намерете зарязаното по средата\n- Изберете колко минути имате и вижте само това, което се побира\n\nИСТОРИЯ И „ГЛЕДАЙТЕ ПО-КЪСНО“\n- Всичко, което сте започнали и никога не сте довършили\n- Филтрирайте по канал, продължителност, гледания или кога сте гледали\n- Намерете онзи видеоклип, който със сигурност сте гледали, без безкрайно превъртане\n\nВСЕКИ ПЛЕЙЛИСТ И ВАШИТЕ АБОНАМЕНТИ\n- Колко е дълъг всеки плейлист и колко ви остава от него\n- Търсете и филтрирайте всеки плейлист, ваш или чужд, целия\n- Абонаментите ви, само негледаното и под 20 минути\n- Затъмнете или скрийте вече гледаните видеоклипове в Начало и Абонаменти\n\nПОДРЕДЕТЕ, ПУСНЕТЕ, СПОДЕЛЕТЕ\n- Подредете „Гледайте по-късно“ и собствените си плейлисти, премахнете харесвания наведнъж и изчистете изтритите видеоклипове, с отмяна и архив, от който да върнете всичко\n- Пуснете филтрираното по ред или копирайте връзките за NotebookLM\n- Споделете филтър като връзка: той отваря същия списък със същите филтри за всеки, който има Needle\n- Клавиатура: / за търсене, j и k за движение, x за избор\n\nСТАТИСТИКА\n- Продължителностите и годините, в които каналът се представя най-добре\n- Сравнете два канала един до друг\n- Списък за наблюдение, който открива видеоклипове, надминаващи обичайните гледания на канала си\n\nБез вход, без акаунт, нищо не се изпраща никъде. Всичко работи във вашия браузър.\n\nИнтерфейсът на разширението е на английски.\n\nНе е свързано с YouTube или Google."},{"code":"sr","lang":"Serbian","d":"Ново: утишајте канал директно из YouTube менија ⋮ и нестаје из претраге, почетне стране, пријава и Shorts снимака. YouTube опција да не препоручује канал никад не утиче на претрагу. Ова утиче.\n\nYouTube претрага не зна шта сте већ гледали, не филтрира по трајању ни прегледима, а претрага унутар канала гледа само наслове. Needle то решава директно у траци за претрагу на YouTube-у.\n\nУТИШАЈТЕ КАНАЛ, СВУДА\n- „Mute channel everywhere“ у менију ⋮ сваког видеа\n- Нестаје из претраге, са почетне стране, из пријава и из видеа поред оног који гледате\n- Нестају и његови Shorts, на почетној страни и у претрази\n- Утишајте речи: сваки видео са неком од њих у наслову нестаје\n- Опозовите одмах, укините утишавање кад год желите и пренесите листу из другог блокатора\n\nУ ТРАЦИ ЗА ПРЕТРАГУ\n- „Погледај касније“, видео снимци који вам се допадају и историја појављују се док куцате\n- Укуцајте филтере: <20m, >100k, unwatched, date:week, @канал\n- in:playlists претражује све плејлисте које сте сачували\n- is:fresh сакрива оно што вам је већ приказано\n- Пратите претрагу и на свакој сличици видите шта сте већ гледали\n\nПРЕТРАГА КАНАЛА\nКликните на дугме са иглом на картици „Видео снимци“ било ког канала. Needle чита све видео снимке канала, не само оне већ учитане.\n- Филтрирајте по трајању, прегледима, датуму и кључној речи\n- Сакријте одгледано до краја или пронађите остављено на пола\n- Изаберите колико минута имате и видите само оно што стаје\n\nИСТОРИЈА И „ПОГЛЕДАЈ КАСНИЈЕ“\n- Све што сте почели и никад нисте завршили\n- Филтрирајте по каналу, трајању, прегледима или времену гледања\n- Пронађите онај снимак који сте сигурно гледали, без бесконачног скроловања\n\nБИЛО КОЈА ПЛЕЈЛИСТА И КАНАЛИ КОЈЕ ПРАТИТЕ\n- Колико траје било која плејлиста и колико вам је од ње остало\n- Претражујте и филтрирајте било коју плејлисту, своју или туђу, целу\n- Канали које пратите, само неодгледано и краће од 20 минута\n- Затамните или сакријте већ одгледане снимке на почетној страници и међу каналима које пратите\n\nСРЕДИТЕ, ПУСТИТЕ, ПОДЕЛИТЕ\n- Средите „Погледај касније“ и своје плејлисте, уклоните лајкове одједном и почистите избрисане снимке, уз опозивање и архиву из које све враћате\n- Пустите филтрирано редом или копирајте линкове за NotebookLM\n- Поделите филтер као линк: свако ко има Needle отвориће исту листу са истим филтерима\n- Тастатура: / за претрагу, j и k за кретање, x за избор\n\nСТАТИСТИКА\n- Трајања и године у којима канал пролази најбоље\n- Упоредите два канала један поред другог\n- Листа праћења која налази снимке што надмашују уобичајене прегледе свог канала\n\nБез пријаве, без налога, ништа се нигде не шаље. Све ради у вашем прегледачу.\n\nИнтерфејс проширења је на енглеском.\n\nНије повезано са YouTube-ом ни Google-ом."},{"code":"lt","lang":"Lithuanian","d":"Nauja: nutildykite kanalą tiesiai iš paties YouTube ⋮ meniu ir jis dingsta iš paieškos, pagrindinio puslapio, prenumeratų ir Shorts. YouTube parinktis nerekomenduoti kanalo niekada nepaveikia paieškos. Ši paveikia.\n\nYouTube paieška nežino, ką 择你有多少分钟，只显示看得完的视频\n\n你的观看记录和稍后观看\n- 所有开始看了却没看完的视频\n- 按频道、时长、观看次数或观看时间筛选\n- 找到那个你确定看过的视频，不用一直往下翻\n\n任意播放列表和你的订阅\n- 任何播放列表的总时长，以及还剩多少\n- 搜索并筛选任意播放列表，不管是你的还是别人的，全部内容都能搜\n- 你的订阅内容，只看没看过且不到 20 分钟的视频\n- 在首页和订阅内容中，把已看过的视频变暗或隐藏\n\n整理、播放、分享\n- 整理稍后观看和你自己的播放列表，批量取消赞，清理已删除的视频，支持撤销，还有存档可以随时放回去\n- 按顺序播放筛选结果，或为 NotebookLM 复制链接\n- 把筛选以链接分享：装了 Needle 的人打开后，看到的是同一个列表和同样的筛选\n- 键盘：/ 搜索，j 和 k 移动，x 选择\n\n数据洞察\n- 一个频道表现最好的视频时长和年份\n- 并排比较两个频道\n- 一个关注列表，找出超过频道平时观看次数的视频\n\n无需登录，无需账号，不向任何地方发送任何数据。全部在你的浏览器中运行。\n\n扩展程序界面为英文。\n\n与 YouTube 或 Google 无关联。"}];
const KEY = "needle-paste-2.3.0";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const list = document.getElementById("list");
for (const it of items) {
  const row = document.createElement("div");
  row.className = "row" + (done[it.code] ? " done" : "");
  const tick = document.createElement("input");
  tick.type = "checkbox"; tick.checked = !!done[it.code];
  tick.onchange = () => { done[it.code] = tick.checked; row.classList.toggle("done", tick.checked); save(); };
  const label = document.createElement("div");
  label.innerHTML = '<span class="lang"></span><span class="code"></span>';
  label.firstChild.textContent = it.lang; label.lastChild.textContent = it.code;
  const btn = document.createElement("button");
  btn.textContent = "Copy";
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(it.d); }
    catch (e) { const t = document.createElement("textarea"); t.value = it.d; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    btn.textContent = "Copied"; btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1500);
  };
  const more = document.createElement("details");
  more.innerHTML = "<summary>Show text</summary><pre></pre>";
  more.querySelector("pre").textContent = it.d;
  row.append(tick, label, btn, more);
  list.appendChild(row);
}
