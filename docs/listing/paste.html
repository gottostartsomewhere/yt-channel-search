<script>
const items = [{"code":"pt_BR","lang":"Brazilian Portuguese","d":"Novo: silencie um canal no próprio menu ⋮ do YouTube, e ele some da busca, do início, das inscrições e dos Shorts. A opção do YouTube de não recomendar um canal nunca afeta a busca. Esta afeta.\n\nA busca do YouTube não sabe o que você já assistiu, não filtra por duração nem por visualizações, e a busca dentro de um canal só olha os títulos. O Needle resolve isso, direto na barra de busca do YouTube.\n\nSILENCIE UM CANAL, EM TODO LUGAR\n- \"Mute channel everywhere\" no menu ⋮ de cada vídeo\n- Some da busca, do início, das inscrições e dos vídeos ao lado do que você está assistindo\n- Os Shorts dele também somem, no início e na busca\n- Silencie palavras: qualquer vídeo com uma delas no título desaparece\n- Desfaça na hora, tire o silêncio quando quiser e traga sua lista de outro bloqueador\n\nNA BARRA DE BUSCA\n- Seus vídeos de Assistir mais tarde, curtidos e do histórico aparecem enquanto você digita\n- Digite filtros: <20m, >100k, unwatched, date:week, @canal\n- in:playlists busca em todas as playlists que você salvou\n- is:fresh esconde o que já apareceu para você antes\n- Siga uma busca e veja o que você já assistiu em cada miniatura\n\nBUSCAR EM UM CANAL\nClique no botão da agulha na aba Vídeos de qualquer canal. Ele lê todos os vídeos do canal, não só os que já carregaram.\n- Filtre por duração, visualizações, data e palavra-chave\n- Esconda o que terminou, ou ache o que largou pela metade\n- Diga quantos minutos você tem e veja só o que cabe\n\nSEU HISTÓRICO E ASSISTIR MAIS TARDE\n- Tudo que você começou e nunca terminou\n- Filtre por canal, duração, visualizações ou por quando você assistiu\n- Ache aquele vídeo que você sabe que assistiu, sem ficar rolando a página\n\nQUALQUER PLAYLIST E SUAS INSCRIÇÕES\n- Quanto dura qualquer playlist, e quanto falta para você\n- Pesquise e filtre qualquer playlist, sua ou de outra pessoa, inteira\n- Suas inscrições, só o que você ainda não viu e com menos de 20 minutos\n- Esmaeça ou esconda os vídeos que você já assistiu no Início e em Inscrições\n\nLIMPAR, REPRODUZIR, COMPARTILHAR\n- Limpe o Assistir mais tarde e suas próprias playlists, remova curtidas em massa e tire os vídeos excluídos, com desfazer e um arquivo para devolver o que quiser\n- Reproduza o que você filtrou, em ordem, ou copie os links para o NotebookLM\n- Compartilhe um filtro como link: ele abre a mesma lista com os mesmos filtros para qualquer pessoa com o Needle\n- Teclado: / para buscar, j e k para navegar, x para selecionar\n\nANÁLISE\n- As durações e os anos em que um canal vai melhor\n- Compare dois canais lado a lado\n- Uma lista de acompanhamento que mostra vídeos superando as visualizações de sempre do canal\n\nSem login, sem conta, nada é enviado para lugar nenhum. Tudo roda no seu navegador.\n\nA interface da extensão está em inglês.\n\nNão é afiliada ao YouTube nem ao Google."},{"code":"es_419","lang":"Latin American Spanish","d":"Novedad: silencia un canal desde el propio menú ⋮ de YouTube y desaparece de la búsqueda, la página principal, las suscripciones y los Shorts. La opción de YouTube de no recomendar un canal nunca afecta la búsqueda. Esta sí.\n\nLa búsqueda de YouTube no sabe lo que ya viste, no filtra por duración ni por vistas, y la búsqueda dentro de un canal solo revisa los títulos. Needle lo soluciona, directamente en la barra de búsqueda de YouTube.\n\nSILENCIA UN CANAL, EN TODAS PARTES\n- \"Mute channel everywhere\" en el menú ⋮ de cada video\n- Desaparece de la búsqueda, la página principal, las suscripciones y los videos junto al que estás viendo\n- Sus Shorts también se van, en la página principal y en la búsqueda\n- Silencia palabras: cualquier video con una de ellas en el título desaparece\n- Deshaz al instante, deja de silenciar cuando quieras y trae tu lista desde otro bloqueador\n\nEN LA BARRA DE BÚSQUEDA\n- Tus videos de Ver más tarde, los que te gustaron y tu historial aparecen mientras escribes\n- Escribe filtros: <20m, >100k, unwatched, date:week, @canal\n- in:playlists busca en todas las playlists que guardaste\n- is:fresh oculta lo que ya se te mostró\n- Sigue una búsqueda y mira lo que ya viste en cada miniatura\n\nBUSCAR EN UN CANAL\nHaz clic en el botón de la aguja en la pestaña Videos de cualquier canal. Lee todos los videos del canal, no solo los que ya cargaron.\n- Filtra por duración, vistas, fecha y palabra clave\n- Oculta lo que terminaste o encuentra lo que dejaste a medias\n- Elige los minutos que tienes y ve solo lo que cabe\n\nTU HISTORIAL Y VER MÁS TARDE\n- Todo lo que empezaste y nunca terminaste\n- Filtra por canal, duración, vistas o por cuándo lo viste\n- Encuentra ese video que sabes que viste, sin tener que desplazarte\n\nCUALQUIER PLAYLIST Y TUS SUSCRIPCIONES\n- Cuánto dura cualquier lista de reproducción y cuánto te queda\n- Busca y filtra cualquier playlist, tuya o de otra persona, completa\n- Tus suscripciones, solo lo que no viste y de menos de 20 minutos\n- Atenúa u oculta los videos que ya viste en Principal y en Suscripciones\n\nLIMPIAR, REPRODUCIR, COMPARTIR\n- Limpia Ver más tarde y tus propias playlists, quita Me gusta en masa y elimina los videos borrados, con deshacer y un archivo para recuperar lo que quieras\n- Reproduce lo que filtraste, en orden, o copia los enlaces para NotebookLM\n- Comparte un filtro como enlace: abre la misma lista con los mismos filtros para cualquiera que tenga Needle\n- Teclado: / para buscar, j y k para moverte, x para seleccionar\n\nESTADÍSTICAS\n- Las duraciones y los años en los que mejor le va a un canal\n- Compara dos canales lado a lado\n- Una lista de seguimiento que detecta videos que superan las vistas habituales de su canal\n\nSin iniciar sesión, sin cuenta, sin enviar nada a ningún lado. Funciona en tu navegador.\n\nLa interfaz de la extensión está en inglés.\n\nNo está afiliada a YouTube ni a Google."},{"code":"es","lang":"Spanish","d":"Novedad: silencia un canal desde el propio menú ⋮ de YouTube y desaparece de la búsqueda, el inicio, las suscripciones y los Shorts. La opción de YouTube de no recomendar un canal nunca afecta a la búsqueda. Esta sí.\n\nLa búsqueda de YouTube no sabe lo que ya has visto, no filtra por duración ni por visualizaciones, y la búsqueda dentro de un canal solo mira los títulos. Needle lo arregla, directamente en la barra de búsqueda de YouTube.\n\nSILENCIA UN CANAL, EN TODAS PARTES\n- «Mute channel everywhere» en el menú ⋮ de cada vídeo\n- Desaparece de la búsqueda, el inicio, las suscripciones y los vídeos junto al que estás viendo\n- Sus Shorts también se van, en el inicio y en la búsqueda\n- Silencia palabras: cualquier vídeo con una de ellas en el título desaparece\n- Deshaz al instante, deja de silenciar cuando quieras y trae tu lista desde otro bloqueador\n\nEN LA BARRA DE BÚSQUEDA\n- Tus vídeos de Ver más tarde, los que te gustan y tu historial aparecen mientras escribes\n- Escribe filtros: <20m, >100k, unwatched, date:week, @canal\n- in:playlists busca en todas las listas de reproducción que has guardado\n- is:fresh oculta lo que ya se te ha mostrado\n- Sigue una búsqueda y mira lo que ya has visto en cada miniatura\n\nBUSCAR EN UN CANAL\nPulsa el botón de la aguja en la pestaña Vídeos de cualquier canal. Lee todos los vídeos del canal, no solo los que ya se han cargado.\n- Filtra por duración, visualizaciones, fecha y palabra clave\n- Oculta lo que terminaste o encuentra lo que dejaste a medias\n- Elige los minutos que tienes y ve solo lo que cabe\n\nTU HISTORIAL Y VER MÁS TARDE\n- Todo lo que empezaste y nunca terminaste\n- Filtra por canal, duración, visualizaciones o por cuándo lo viste\n- Encuentra ese vídeo que sabes que viste, sin desplazarte sin fin\n\nCUALQUIER LISTA Y TUS SUSCRIPCIONES\n- Cuánto dura cualquier lista de reproducción y cuánto te queda\n- Busca y filtra cualquier lista de reproducción, tuya o de otra persona, entera\n- Tus suscripciones, solo lo que no has visto y de menos de 20 minutos\n- Atenúa u oculta los vídeos que ya has visto en Inicio y en Suscripciones\n\nLIMPIAR, REPRODUCIR, COMPARTIR\n- Limpia Ver más tarde y tus propias listas, quita Me gusta en bloque y elimina los vídeos borrados, con deshacer y un archivo para recuperar lo que quieras\n- Reproduce lo que has filtrado, en orden, o copia los enlaces para NotebookLM\n- Comparte un filtro como enlace: abre la misma lista con los mismos filtros a cualquiera que tenga Needle\n- Teclado: / para buscar, j y k para moverte, x para seleccionar\n\nESTADÍSTICAS\n- Las duraciones y los años en los que mejor le va a un canal\n- Compara dos canales lado a lado\n- Una lista de seguimiento que detecta vídeos que superan las visualizaciones habituales de su canal\n\nSin iniciar sesión, sin cuenta, sin enviar nada a ningún sitio. Funciona en tu navegador.\n\nLa interfaz de la extensión está en inglés.\n\nNo está afiliada a YouTube ni a Google."},{"code":"id","lang":"Indonesian","d":"Baru: bisukan channel langsung dari menu ⋮ milik YouTube, dan channel itu hilang dari pencarian, Beranda, Langganan, dan Shorts. Opsi YouTube untuk tidak merekomendasikan channel tidak pernah menyentuh pencarian. Yang ini menyentuh.\n\nPencarian YouTube tidak tahu apa yang sudah kamu tonton, tidak bisa memfilter menurut durasi atau jumlah tayangan, dan pencarian di dalam channel hanya mencocokkan judul. Needle memperbaikinya, langsung di bilah pencarian YouTube.\n\nBISUKAN CHANNEL, DI MANA SAJA\n- \"Mute channel everywhere\" di menu ⋮ setiap video\n- Hilang dari pencarian, Beranda, Langganan, dan video di samping yang sedang kamu tonton\n- Shorts-nya juga hilang, di Beranda dan di pencarian\n- Bisukan kata: video apa pun yang judulnya memuat salah satunya akan hilang\n- Urungkan seketika, batalkan bisu kapan saja, dan bawa daftarmu dari pemblokir lain\n\nDI BILAH PENCARIAN\n- Video Tonton Nanti, video yang kamu sukai, dan riwayatmu muncul saat kamu mengetik\n- Ketik filter: <20m, >100k, unwatched, date:week, @channel\n- in:playlists mencari di semua playlist yang kamu simpan\n- is:fresh menyembunyikan apa yang sudah pernah ditampilkan kepadamu\n- Ikuti pencarian, dan lihat apa yang sudah kamu tonton di setiap thumbnail\n\nCARI DI DALAM CHANNEL\nTekan tombol jarum di tab Video channel mana pun. Needle membaca semua video channel itu, bukan hanya yang sudah dimuat.\n- Filter menurut durasi, tayangan, tanggal, dan kata kunci\n- Sembunyikan yang sudah selesai, atau temukan yang kamu tinggalkan di tengah jalan\n- Pilih berapa menit waktumu dan lihat hanya video yang muat\n\nRIWAYAT DAN TONTON NANTI\n- Semua yang kamu mulai tapi tidak pernah selesai\n- Filter menurut channel, durasi, tayangan, atau kapan kamu menontonnya\n- Temukan video yang kamu yakin pernah ditonton, tanpa menggulir tanpa akhir\n\nPLAYLIST APA PUN DAN SUBSCRIPTION KAMU\n- Berapa lama playlist apa pun, dan berapa yang tersisa untukmu\n- Cari dan filter playlist apa pun, milikmu atau milik orang lain, seluruhnya\n- Subscription kamu, hanya yang belum ditonton dan di bawah 20 menit\n- Redupkan atau sembunyikan video yang sudah kamu tonton di Beranda dan Subscription\n\nBERESKAN, PUTAR, BAGIKAN\n- Bereskan Tonton Nanti dan playlist milikmu, batalkan suka sekaligus, dan buang video yang sudah dihapus, dengan urungkan dan arsip untuk mengembalikannya\n- Putar hasil filtermu secara berurutan, atau salin tautannya untuk NotebookLM\n- Bagikan filter sebagai tautan: tautan itu membuka daftar yang sama dengan filter yang sama untuk siapa pun yang punya Needle\n- Keyboard: / untuk mencari, j dan k untuk berpindah, x untuk memilih\n\nWAWASAN\n- Durasi video dan tahun dengan performa terbaik sebuah channel\n- Bandingkan dua channel berdampingan\n- Daftar pantauan yang menemukan video yang melampaui tayangan biasa channel-nya\n\nTanpa login, tanpa akun, tidak ada yang dikirim ke mana pun. Semuanya berjalan di browsermu.\n\nAntarmuka ekstensi ini berbahasa Inggris.\n\nTidak berafiliasi dengan YouTube atau Google."},{"code":"hi","lang":"Hindi","d":"नया: YouTube के अपने ⋮ मेन्यू से किसी चैनल को म्यूट करें, और वह खोज, होम, सदस्यताओं और Shorts से गायब हो जाएगा। YouTube का चैनल का सुझाव न देने वाला विकल्प खोज पर कभी असर नहीं डालता। यह डालता है।\n\nYouTube की खोज नहीं जानती कि आप क्या देख चुके हैं, लंबाई या व्यू के हिसाब से फ़िल्टर नहीं कर सकती, और चैनल के अंदर की खोज सिर्फ़ टाइटल देखती है। Needle यह सब ठीक करता है, सीधे YouTube के सर्च बार में।\n\nचैनल म्यूट करें, हर जगह\n- हर वीडियो के ⋮ मेन्यू में \"Mute channel everywhere\"\n- खोज, होम, सदस्यताओं और आप जो वीडियो देख रहे हैं उसके पास के वीडियो से गायब\n- उसके Shorts भी चले जाते हैं, होम पर और खोज में\n- शब्द म्यूट करें: जिस वीडियो के शीर्षक में उनमें से कोई शब्द हो, वह गायब\n- तुरंत पहले जैसा करें, कभी भी अनम्यूट करें, और किसी दूसरे ब्लॉकर से अपनी सूची ले आएं\n\nसर्च बार में\n- टाइप करते ही आपके बाद में देखें, पसंद किए गए वीडियो और इतिहास दिखने लगते हैं\n- फ़िल्टर टाइप करें: <20m, >100k, unwatched, date:week, @चैनल\n- in:playlists आपकी सेव की हुई हर प्लेलिस्ट में खोजता है\n- is:fresh वह छिपा देता है जो आपको पहले दिखाया जा चुका है\n- किसी खोज को फ़ॉलो करें, और हर थंबनेल पर देखें कि आपने क्या देखा है\n\nकिसी चैनल में खोजें\nकिसी भी चैनल के वीडियो टैब पर सुई वाला बटन दबाएँ। Needle चैनल का हर वीडियो पढ़ता है, सिर्फ़ लोड हुए वीडियो नहीं।\n- लंबाई, व्यू, तारीख़ और कीवर्ड से फ़िल्टर करें\n- जो पूरा देख लिया उसे छिपाएँ, या जो बीच में छोड़ा उसे ढूँढें\n- बताइए आपके पास कितने मिनट हैं, और सिर्फ़ उतने में आने वाले वीडियो देखें\n\nआपका इतिहास और बाद में देखें\n- वह सब जो आपने शुरू किया पर कभी पूरा नहीं किया\n- चैनल, लंबाई, व्यू या देखने के समय से फ़िल्टर करें\n- वह वीडियो ढूँढें जो आपने पक्का देखा था, बिना लगातार स्क्रॉल किए\n\nकोई भी प्लेलिस्ट और आपकी सदस्यताएँ\n- किसी भी प्लेलिस्ट की कुल लंबाई, और उसमें से कितना बाकी है\n- कोई भी प्लेलिस्ट खोजें और फ़िल्टर करें, आपकी हो या किसी और की, पूरी की पूरी\n- आपकी सदस्यताएँ, सिर्फ़ बिना देखे और 20 मिनट से छोटे वीडियो\n- होम और सदस्यताओं में पहले से देखे गए वीडियो धुंधले करें या छिपाएँ\n\nसफ़ाई, प्ले, शेयर\n- बाद में देखें और अपनी प्लेलिस्ट साफ़ करें, एक साथ कई लाइक हटाएँ और डिलीट हो चुके वीडियो निकालें, अनडू और एक आर्काइव के साथ जिससे सब वापस लाया जा सके\n- जो फ़िल्टर किया उसे क्रम से चलाएँ, या NotebookLM के लिए लिंक कॉपी करें\n- किसी फ़िल्टर को लिंक की तरह शेयर करें: जिसके पास भी Needle है, उसके लिए वही सूची उन्हीं फ़िल्टर के साथ खुलती है\n- कीबोर्ड: खोजने के लिए /, आगे-पीछे जाने के लिए j और k, चुनने के लिए x\n\nइनसाइट्स\n- किसी चैनल के सबसे अच्छा प्रदर्शन करने वाले वीडियो की लंबाई और साल\n- दो चैनलों की आमने-सामने तुलना\n- एक वॉचलिस्ट जो चैनल के सामान्य व्यू से आगे निकलने वाले वीडियो पकड़ती है\n\nन साइन-इन, न अकाउंट, कुछ भी कहीं नहीं भेजा जाता। सब कुछ आपके ब्राउज़र में चलता है।\n\nएक्सटेंशन का इंटरफ़ेस अंग्रेज़ी में है।\n\nYouTube या Google से संबद्ध नहीं।"},{"code":"ja","lang":"Japanese","d":"新機能：YouTube自身の⋮メニューからチャンネルをミュートすると、検索、ホーム、登録チャンネル、Shortsから消えます。YouTubeの「チャンネルをおすすめに表示しない」は検索には一切効きません。これは効きます。\n\nYouTubeの検索は、あなたがすでに見た動画を知りません。長さや再生回数で絞り込めず、チャンネル内検索はタイトルしか見ません。Needleは、それをYouTubeの検索バーの中でそのまま解決します。\n\nチャンネルを、どこでもミュート\n- すべての動画の⋮メニューに「Mute channel everywhere」\n- 検索、ホーム、登録チャンネル、視聴中の動画の横の動画から消えます\n- そのチャンネルのShortsも、ホームと検索から消えます\n- ワードのミュート：タイトルにその言葉を含む動画が消えます\n- すぐに元に戻せて、いつでもミュート解除でき、他のブロッカーからリストを移せます\n\n検索バーで\n- 入力中に「後で見る」、高く評価した動画、再生履歴が表示されます\n- フィルターを入力：<20m、>100k、unwatched、date:week、@チャンネル\n- in:playlists で、保存したすべての再生リストを検索\n- is:fresh で、すでに表示された動画を隠します\n- 検索をフォローし、すべてのサムネイルで視聴済みかどうかを確認\n\nチャンネル内を検索\nどのチャンネルでも「動画」タブの針ボタンを押すだけ。読み込み済みの分だけでなく、チャンネルのすべての動画を読み取ります。\n- 長さ、再生回数、日付、キーワードで絞り込み\n- 見終わった動画を隠す、途中でやめた動画を見つける\n- 空いている時間を選ぶと、その時間に収まる動画だけを表示\n\n再生履歴と「後で見る」\n- 見始めて最後まで見ていない動画をすべて表示\n- チャンネル、長さ、再生回数、視聴した時期で絞り込み\n- 確かに見たはずのあの動画を、延々とスクロールせずに見つける\n\nあらゆる再生リストと登録チャンネル\n- どの再生リストも合計の長さと、残りの時間がわかります\n- 自分のものでも他人のものでも、どの再生リストも丸ごと検索して絞り込み\n- 登録チャンネルの、未視聴で20分未満の動画だけを表示\n- ホームと登録チャンネルで、視聴済みの動画を薄く表示または非表示に\n\n整理・再生・共有\n- 「後で見る」と自分の再生リストを整理、高評価をまとめて取り消し、削除された動画も一掃。元に戻す機能と、いつでも戻せるアーカイブ付き\n- 絞り込んだ動画を順番に再生、または NotebookLM 用にリンクをコピー\n- フィルターをリンクで共有：Needle を入れている人なら、同じリストが同じフィルターで開きます\n- キーボード：/ で検索、j と k で移動、x で選択\n\nインサイト\n- そのチャンネルで最も伸びる動画の長さと年\n- 2つのチャンネルを並べて比較\n- チャンネルの普段の再生回数を上回る動画を見つけるウォッチリスト\n\nログイン不要、アカウント不要、どこにも何も送信しません。すべてブラウザの中で動きます。\n\n拡張機能の画面は英語です。\n\nYouTube および Google とは提携していません。"},{"code":"ru","lang":"Russian","d":"Новое: скройте канал прямо из меню ⋮ самого YouTube, и он исчезнет из поиска, главной, подписок и Shorts. Опция YouTube «не рекомендовать канал» никогда не влияет на поиск. Эта влияет.\n\nПоиск YouTube не знает, что вы уже смотрели, не фильтрует по длительности и просмотрам, а поиск по каналу смотрит только на названия. Needle исправляет это прямо в строке поиска YouTube.\n\nСКРОЙТЕ КАНАЛ, ВЕЗДЕ\n- «Mute channel everywhere» в меню ⋮ каждого видео\n- Исчезает из поиска, с главной, из подписок и из видео рядом с тем, что вы смотрите\n- Его Shorts тоже исчезают, на главной и в поиске\n- Скрытие по словам: исчезает любое видео, в названии которого есть одно из них\n- Отмените сразу, верните в любой момент и перенесите список из другого блокировщика\n\nВ СТРОКЕ ПОИСКА\n- «Смотреть позже», понравившиеся видео и история появляются, пока вы печатаете\n- Вводите фильтры: <20m, >100k, unwatched, date:week, @канал\n- in:playlists ищет по всем сохранённым плейлистам\n- is:fresh скрывает то, что вам уже показывали\n- Следите за поиском и видите на каждой миниатюре, что вы уже смотрели\n\nПОИСК ПО КАНАЛУ\nНажмите кнопку с иглой на вкладке «Видео» любого канала. Needle читает все видео канала, а не только уже загруженные.\n- Фильтруйте по длительности, просмотрам, дате и ключевому слову\n- Скрывайте досмотренное или находите брошенное на середине\n- Укажите, сколько у вас минут, и смотрите только то, что успеете\n\nИСТОРИЯ И «СМОТРЕТЬ ПОЗЖЕ»\n- Всё, что вы начали и так и не досмотрели\n- Фильтруйте по каналу, длительности, просмотрам или времени просмотра\n- Найдите то самое видео, которое точно смотрели, без бесконечной прокрутки\n\nЛЮБОЙ ПЛЕЙЛИСТ И ВАШИ ПОДПИСКИ\n- Сколько длится любой плейлист и сколько вам осталось\n- Ищите и фильтруйте любой плейлист, свой или чужой, целиком\n- Ваши подписки: только непросмотренное и короче 20 минут\n- Приглушайте или скрывайте уже просмотренные видео на главной и в подписках\n\nНАВЕСТИ ПОРЯДОК, ВОСПРОИЗВЕСТИ, ПОДЕЛИТЬСЯ\n- Наводите порядок в «Смотреть позже» и своих плейлистах, снимайте лайки пачкой и убирайте удалённые видео, с отменой и архивом, чтобы всё вернуть\n- Воспроизводите отфильтрованное по порядку или копируйте ссылки для NotebookLM\n- Делитесь фильтром как ссылкой: у любого, у кого есть Needle, откроется тот же список с теми же фильтрами\n- Клавиатура: / для поиска, j и k для перемещения, x для выбора\n\nАНАЛИТИКА\n- Длительность и годы, в которые у канала лучшие результаты\n- Сравнение двух каналов бок о бок\n- Список наблюдения, который находит видео, обгоняющие обычные просмотры своего канала\n\nБез входа, без аккаунта, ничего никуда не отправляется. Всё работает в вашем браузере.\n\nИнтерфейс расширения на английском языке.\n\nНе связано с YouTube или Google."},{"code":"de","lang":"German","d":"Neu: Schalte einen Kanal direkt im ⋮-Menü von YouTube stumm, und er verschwindet aus der Suche, der Startseite, den Abos und Shorts. YouTubes Option, einen Kanal nicht mehr zu empfehlen, wirkt nie auf die Suche. Das hier schon.\n\nDie YouTube-Suche weiß nicht, was du schon gesehen hast, filtert nicht nach Länge oder Aufrufen, und die Suche in einem Kanal durchsucht nur Titel. Needle behebt das, direkt in der Suchleiste von YouTube.\n\nEINEN KANAL STUMMSCHALTEN, ÜBERALL\n- „Mute channel everywhere“ im ⋮-Menü jedes Videos\n- Weg aus der Suche, der Startseite, den Abos und den Videos neben dem, das du gerade schaust\n- Seine Shorts verschwinden auch, auf der Startseite und in der Suche\n- Wörter stummschalten: Jedes Video mit einem davon im Titel verschwindet\n- Sofort rückgängig machen, jederzeit wieder einblenden und eine Liste aus einem anderen Blocker übernehmen\n\nIN DER SUCHLEISTE\n- Deine Videos aus Später ansehen, deine Likes und dein Verlauf erscheinen schon beim Tippen\n- Tippe Filter ein: <20m, >100k, unwatched, date:week, @kanal\n- in:playlists durchsucht jede Playlist, die du gespeichert hast\n- is:fresh blendet aus, was dir schon einmal angezeigt wurde\n- Folge einer Suche und sieh auf jedem Thumbnail, was du schon gesehen hast\n\nEINEN KANAL DURCHSUCHEN\nKlick auf den Nadel-Button im Tab Videos eines beliebigen Kanals. Needle liest jedes Video des Kanals, nicht nur die bereits geladenen.\n- Filtere nach Länge, Aufrufen, Datum und Stichwort\n- Blende aus, was du fertig geschaut hast, oder finde, was du abgebrochen hast\n- Gib an, wie viele Minuten du hast, und sieh nur, was hineinpasst\n\nDEIN VERLAUF UND SPÄTER ANSEHEN\n- Alles, was du angefangen und nie beendet hast\n- Filtere nach Kanal, Länge, Aufrufen oder danach, wann du es gesehen hast\n- Finde das Video, das du ganz sicher schon gesehen hast, ohne endlos zu scrollen\n\nJEDE PLAYLIST UND DEINE ABOS\n- Wie lang jede Playlist ist und wie viel du noch vor dir hast\n- Durchsuche und filtere jede Playlist, deine oder fremde, komplett\n- Deine Abos, nur Ungesehenes unter 20 Minuten\n- Dunkle bereits gesehene Videos auf der Startseite und unter Abos ab oder blende sie aus\n\nAUFRÄUMEN, ABSPIELEN, TEILEN\n- Räume Später ansehen und deine eigenen Playlists auf, entferne Likes in großen Mengen und wirf gelöschte Videos raus, mit Rückgängig und einem Archiv, um alles zurückzuholen\n- Spiele ab, was du gefiltert hast, der Reihe nach, oder kopiere die Links für NotebookLM\n- Teile einen Filter als Link: Er öffnet dieselbe Liste mit denselben Filtern für alle, die Needle haben\n- Tastatur: / zum Suchen, j und k zum Bewegen, x zum Auswählen\n\nSTATISTIKEN\n- Die Videolängen und Jahre, in denen ein Kanal am besten läuft\n- Vergleiche zwei Kanäle direkt nebeneinander\n- Eine Beobachtungsliste, die Videos findet, die die üblichen Aufrufe ihres Kanals übertreffen\n\nKeine Anmeldung, kein Konto, nichts wird irgendwohin gesendet. Alles läuft in deinem Browser.\n\nDie Oberfläche der Erweiterung ist auf Englisch.\n\nNicht mit YouTube oder Google verbunden."},{"code":"fr","lang":"French","d":"Nouveau : mettez une chaîne en sourdine depuis le menu ⋮ de YouTube lui-même, et elle disparaît de la recherche, de l'accueil, des abonnements et des Shorts. L'option de YouTube pour ne plus recommander une chaîne ne touche jamais la recherche. Celle-ci, si.\n\nLa recherche YouTube ne sait pas ce que vous avez déjà vu, ne filtre ni par durée ni par nombre de vues, et la recherche dans une chaîne ne regarde que les titres. Needle corrige tout ça, directement dans la barre de recherche de YouTube.\n\nMETTRE UNE CHAÎNE EN SOURDINE, PARTOUT\n- « Mute channel everywhere » dans le menu ⋮ de chaque vidéo\n- Disparaît de la recherche, de l'accueil, des abonnements et des vidéos à côté de celle que vous regardez\n- Ses Shorts disparaissent aussi, sur l'accueil et dans la recherche\n- Mots en sourdine : toute vidéo qui en contient un dans son titre disparaît\n- Annulez tout de suite, rétablissez quand vous voulez, et importez votre liste depuis un autre bloqueur\n\nDANS LA BARRE DE RECHERCHE\n- Vos vidéos À regarder plus tard, vos J'aime et votre historique s'affichent pendant que vous tapez\n- Tapez des filtres : <20m, >100k, unwatched, date:week, @chaîne\n- in:playlists cherche dans toutes les playlists que vous avez enregistrées\n- is:fresh masque ce qu'on vous a déjà montré\n- Suivez une recherche et voyez ce que vous avez déjà vu sur chaque miniature\n\nCHERCHER DANS UNE CHAÎNE\nCliquez sur le bouton aiguille dans l'onglet Vidéos de n'importe quelle chaîne. Needle lit toutes les vidéos de la chaîne, pas seulement celles déjà chargées.\n- Filtrez par durée, vues, date et mot-clé\n- Masquez ce que vous avez fini ou retrouvez ce que vous avez abandonné\n- Indiquez le temps dont vous disposez et ne voyez que ce qui tient dedans\n\nVOTRE HISTORIQUE ET À REGARDER PLUS TARD\n- Tout ce que vous avez commencé sans jamais finir\n- Filtrez par chaîne, durée, vues ou date de visionnage\n- Retrouvez cette vidéo que vous savez avoir vue, sans faire défiler pendant des heures\n\nN'IMPORTE QUELLE PLAYLIST ET VOS ABONNEMENTS\n- La durée de n'importe quelle playlist, et ce qu'il vous en reste\n- Cherchez et filtrez n'importe quelle playlist, la vôtre ou celle d'un autre, en entier\n- Vos abonnements, uniquement les vidéos non vues de moins de 20 minutes\n- Estompez ou masquez les vidéos déjà vues sur l'Accueil et dans Abonnements\n\nNETTOYER, LIRE, PARTAGER\n- Faites le tri dans À regarder plus tard et vos propres playlists, retirez vos J'aime en masse et supprimez les vidéos effacées, avec annulation et une archive pour tout remettre en place\n- Lisez ce que vous avez filtré, dans l'ordre, ou copiez les liens pour NotebookLM\n- Partagez un filtre sous forme de lien : il ouvre la même liste avec les mêmes filtres pour toute personne qui a Needle\n- Clavier : / pour chercher, j et k pour se déplacer, x pour sélectionner\n\nSTATISTIQUES\n- Les durées et les années où une chaîne marche le mieux\n- Comparez deux chaînes côte à côte\n- Une liste de suivi qui repère les vidéos qui dépassent les vues habituelles de leur chaîne\n\nSans connexion, sans compte, rien n'est envoyé nulle part. Tout se passe dans votre navigateur.\n\nL'interface de l'extension est en anglais.\n\nNon affiliée à YouTube ni à Google."},{"code":"tr","lang":"Turkish","d":"Yeni: Bir kanalı YouTube'un kendi ⋮ menüsünden sessize alın; arama, ana sayfa, abonelikler ve Shorts'tan kaybolsun. YouTube'un kanalı önermeme seçeneği aramayı hiç etkilemez. Bu etkiler.\n\nYouTube araması neleri zaten izlediğinizi bilmez, süreye veya görüntülenmeye göre filtreleyemez ve kanal içi arama yalnızca başlıklara bakar. Needle bunu doğrudan YouTube'un arama çubuğunda çözer.\n\nBİR KANALI SESSİZE ALIN, HER YERDE\n- Her videonun ⋮ menüsünde \"Mute channel everywhere\"\n- Aramadan, ana sayfadan, aboneliklerden ve izlediğiniz videonun yanındakilerden kaybolur\n- Shorts videoları da gider, ana sayfada ve aramada\n- Kelimeleri sessize alın: başlığında bunlardan biri geçen her video kaybolur\n- Hemen geri alın, istediğiniz zaman sessizden çıkarın ve listenizi başka bir engelleyiciden getirin\n\nARAMA ÇUBUĞUNDA\n- Daha sonra izle, beğendiğiniz videolar ve geçmişiniz siz yazarken görünür\n- Filtre yazın: <20m, >100k, unwatched, date:week, @kanal\n- in:playlists kaydettiğiniz tüm oynatma listelerinde arar\n- is:fresh size daha önce gösterilenleri gizler\n- Bir aramayı takip edin ve her küçük resimde neyi izlediğinizi görün\n\nBİR KANALDA ARAYIN\nHerhangi bir kanalın Videolar sekmesindeki iğne düğmesine basın. Needle yalnızca yüklenenleri değil, kanalın tüm videolarını okur.\n- Süre, görüntülenme, tarih ve anahtar kelimeye göre filtreleyin\n- Bitirdiklerinizi gizleyin ya da yarıda bıraktıklarınızı bulun\n- Kaç dakikanız olduğunu seçin ve yalnızca o süreye sığanları görün\n\nGEÇMİŞİNİZ VE DAHA SONRA İZLE\n- Başlayıp hiç bitirmediğiniz her şey\n- Kanala, süreye, görüntülenmeye veya ne zaman izlediğinize göre filtreleyin\n- İzlediğinizden emin olduğunuz o videoyu, durmadan kaydırmadan bulun\n\nHER OYNATMA LİSTESİ VE ABONELİKLERİNİZ\n- Herhangi bir oynatma listesinin uzunluğu ve ne kadarının kaldığı\n- Sizin ya da başkasının, her oynatma listesini baştan sona arayın ve filtreleyin\n- Abonelikleriniz, yalnızca izlenmemiş ve 20 dakikadan kısa olanlar\n- Ana Sayfa'da ve Abonelikler'de zaten izlediğiniz videoları soluklaştırın veya gizleyin\n\nTEMİZLE, OYNAT, PAYLAŞ\n- Daha sonra izle listenizi ve kendi oynatma listelerinizi temizleyin, beğenileri toplu kaldırın ve silinmiş videoları ayıklayın; geri alma ve her şeyi geri koyabileceğiniz bir arşiv de var\n- Filtrelediklerinizi sırayla oynatın ya da bağlantıları NotebookLM için kopyalayın\n- Bir filtreyi bağlantı olarak paylaşın: Needle'ı olan herkes için aynı listeyi aynı filtrelerle açar\n- Klavye: aramak için /, gezinmek için j ve k, seçmek için x\n\nİSTATİSTİKLER\n- Bir kanalın en iyi performans gösterdiği video süreleri ve yıllar\n- İki kanalı yan yana karşılaştırın\n- Kanalının olağan görüntülenmesini aşan videoları yakalayan bir izleme listesi\n\nGiriş yok, hesap yok, hiçbir şey hiçbir yere gönderilmez. Her şey tarayıcınızda çalışır.\n\nUzantının arayüzü İngilizcedir.\n\nYouTube veya Google ile bağlantılı değildir."},{"code":"vi","lang":"Vietnamese","d":"Mới: ẩn một kênh ngay từ menu ⋮ của chính YouTube, kênh đó sẽ biến mất khỏi tìm kiếm, Trang chủ, Kênh đăng ký và Shorts. Tùy chọn không đề xuất kênh của YouTube không bao giờ tác động đến tìm kiếm. Cái này thì có.\n\nTìm kiếm của YouTube không biết bạn đã xem gì, không lọc được theo thời lượng hay lượt xem, và tìm kiếm trong kênh chỉ khớp tiêu đề. Needle khắc phục điều đó ngay trong thanh tìm kiếm của YouTube.\n\nẨN MỘT KÊNH, Ở MỌI NƠI\n- \"Mute channel everywhere\" trong menu ⋮ của mọi video\n- Biến mất khỏi tìm kiếm, Trang chủ, Kênh đăng ký và các video bên cạnh video bạn đang xem\n- Shorts của kênh cũng biến mất, ở Trang chủ và trong tìm kiếm\n- Ẩn theo từ: mọi video có một trong các từ đó trong tiêu đề sẽ biến mất\n- Hoàn tác ngay, bỏ ẩn bất cứ lúc nào, và chuyển danh sách từ trình chặn khác sang\n\nTRONG THANH TÌM KIẾM\n- Video Xem sau, video đã thích và lịch sử xem hiện ra ngay khi bạn gõ\n- Gõ bộ lọc: <20m, >100k, unwatched, date:week, @kênh\n- in:playlists tìm trong mọi danh sách phát bạn đã lưu\n- is:fresh ẩn những gì đã từng hiển thị cho bạn\n- Theo dõi một tìm kiếm, và thấy trên mỗi hình thu nhỏ những gì bạn đã xem\n\nTÌM TRONG MỘT KÊNH\nNhấn nút cây kim ở thẻ Video của bất kỳ kênh nào. Needle đọc mọi video của kênh, không chỉ những video đã tải.\n- Lọc theo thời lượng, lượt xem, ngày và từ khóa\n- Ẩn video đã xem hết, hoặc tìm lại video bạn bỏ dở\n- Chọn số phút bạn có và chỉ xem những gì vừa đủ thời gian\n\nLỊCH SỬ XEM VÀ XEM SAU\n- Mọi video bạn đã bắt đầu nhưng chưa xem hết\n- Lọc theo kênh, thời lượng, lượt xem hoặc thời điểm bạn xem\n- Tìm video bạn chắc chắn đã xem mà không cần cuộn mãi\n\nMỌI DANH SÁCH PHÁT VÀ KÊNH ĐĂNG KÝ\n- Danh sách phát bất kỳ dài bao lâu, và bạn còn lại bao nhiêu\n- Tìm và lọc bất kỳ danh sách phát nào, của bạn hay của người khác, toàn bộ\n- Kênh đăng ký của bạn, chỉ video chưa xem và dưới 20 phút\n- Làm mờ hoặc ẩn video đã xem trên Trang chủ và Kênh đăng ký\n\nDỌN DẸP, PHÁT, CHIA SẺ\n- Dọn dẹp Xem sau và danh sách phát của riêng bạn, bỏ thích hàng loạt và xóa các video đã bị gỡ, có hoàn tác và kho lưu trữ để khôi phục\n- Phát những gì bạn đã lọc theo thứ tự, hoặc sao chép liên kết cho NotebookLM\n- Chia sẻ bộ lọc bằng liên kết: ai có Needle cũng mở được đúng danh sách đó với đúng bộ lọc đó\n- Bàn phím: / để tìm, j và k để di chuyển, x để chọn\n\nTHỐNG KÊ\n- Thời lượng video và những năm mà một kênh làm tốt nhất\n- So sánh hai kênh cạnh nhau\n- Danh sách theo dõi phát hiện video vượt lượt xem thường ngày của kênh\n\nKhông cần đăng nhập, không cần tài khoản, không gửi gì đi đâu cả. Mọi thứ chạy trong trình duyệt của bạn.\n\nGiao diện của tiện ích bằng tiếng Anh.\n\nKhông liên kết với YouTube hay Google."},{"code":"ko","lang":"Korean","d":"새 기능: YouTube 자체의 ⋮ 메뉴에서 채널을 음소거하면 검색, 홈, 구독, Shorts에서 사라집니다. YouTube의 '채널 추천 안함'은 검색에는 전혀 적용되지 않습니다. 이건 됩니다.\n\nYouTube 검색은 내가 이미 본 영상을 모르고, 길이나 조회수로 필터링할 수 없으며, 채널 내 검색은 제목만 찾습니다. Needle은 YouTube 검색창 안에서 바로 이 문제를 해결합니다.\n\n채널 음소거, 어디서나\n- 모든 동영상의 ⋮ 메뉴에 \"Mute channel everywhere\"\n- 검색, 홈, 구독, 그리고 보고 있는 동영상 옆의 동영상에서 사라집니다\n- 그 채널의 Shorts도 홈과 검색에서 사라집니다\n- 단어 음소거: 제목에 그 단어가 들어간 동영상은 모두 사라집니다\n- 바로 되돌리고, 언제든 음소거를 해제하고, 다른 차단 도구의 목록을 가져올 수 있습니다\n\n검색창에서\n- 입력하는 동안 나중에 볼 동영상, 좋아요 표시한 동영상, 시청 기록이 나타납니다\n- 필터 입력: <20m, >100k, unwatched, date:week, @채널\n- in:playlists 로 저장한 모든 재생목록 검색\n- is:fresh 는 이미 보여진 영상을 숨깁니다\n- 검색을 팔로우하고, 모든 썸네일에서 이미 본 영상을 확인하세요\n\n채널 내 검색\n아무 채널의 동영상 탭에서 바늘 버튼을 누르세요. 불러온 영상만이 아니라 채널의 모든 영상을 읽습니다.\n- 길이, 조회수, 날짜, 키워드로 필터링\n- 다 본 영상은 숨기고, 보다 만 영상은 찾기\n- 남는 시간을 고르면 그 시간에 맞는 영상만 표시\n\n시청 기록과 나중에 볼 동영상\n- 시작했지만 끝까지 보지 않은 모든 영상\n- 채널, 길이, 조회수, 시청한 시기로 필터링\n- 분명히 봤던 그 영상을 끝없이 스크롤하지 않고 찾기\n\n모든 재생목록과 구독\n- 어떤 재생목록이든 전체 길이와 남은 시간\n- 내 것이든 다른 사람 것이든, 어떤 재생목록이든 통째로 검색하고 필터링\n- 구독 채널 중 아직 안 본 20분 미만 영상만 보기\n- 홈과 구독에서 이미 본 영상을 흐리게 하거나 숨기기\n\n정리, 재생, 공유\n- 나중에 볼 동영상과 내 재생목록 정리, 좋아요 한꺼번에 취소, 삭제된 영상 정리까지. 실행 취소와 언제든 되돌릴 수 있는 보관함 제공\n- 필터링한 영상을 순서대로 재생하거나 NotebookLM용 링크 복사\n- 필터를 링크로 공유: Needle이 있는 사람이라면 같은 목록이 같은 필터로 열립니다\n- 키보드: / 검색, j와 k 이동, x 선택\n\n인사이트\n- 채널에서 가장 성과가 좋은 영상 길이와 연도\n- 두 채널을 나란히 비교\n- 채널의 평소 조회수를 넘어서는 영상을 찾아내는 관심 목록\n\n로그인도, 계정도 필요 없고, 어디에도 아무것도 보내지 않습니다. 모두 브라우저 안에서 실행됩니다.\n\n확장 프로그램의 화면은 영어로 되어 있습니다.\n\nYouTube 또는 Google과 제휴 관계가 없습니다."},{"code":"it","lang":"Italian","d":"Novità: silenzia un canale dal menu ⋮ di YouTube stesso, e sparisce da ricerca, Home, iscrizioni e Shorts. L'opzione di YouTube per non consigliare un canale non tocca mai la ricerca. Questa sì.\n\nLa ricerca di YouTube non sa cosa hai già visto, non filtra per durata o visualizzazioni, e la ricerca dentro un canale guarda solo i titoli. Needle risolve tutto questo, direttamente nella barra di ricerca di YouTube.\n\nSILENZIA UN CANALE, OVUNQUE\n- «Mute channel everywhere» nel menu ⋮ di ogni video\n- Sparisce da ricerca, Home, iscrizioni e dai video accanto a quello che stai guardando\n- Spariscono anche i suoi Shorts, nella Home e nella ricerca\n- Silenzia parole: ogni video con una di esse nel titolo sparisce\n- Annulla subito, togli il silenzio quando vuoi e porta la tua lista da un altro blocco\n\nNELLA BARRA DI RICERCA\n- I tuoi video di Guarda più tardi, i Mi piace e la cronologia compaiono mentre scrivi\n- Scrivi filtri: <20m, >100k, unwatched, date:week, @canale\n- in:playlists cerca in tutte le playlist che hai salvato\n- is:fresh nasconde ciò che ti è già stato mostrato\n- Segui una ricerca e vedi su ogni miniatura cosa hai già guardato\n\nCERCA IN UN CANALE\nPremi il pulsante dell'ago nella scheda Video di qualsiasi canale. Needle legge tutti i video del canale, non solo quelli già caricati.\n- Filtra per durata, visualizzazioni, data e parola chiave\n- Nascondi ciò che hai finito o ritrova ciò che hai lasciato a metà\n- Indica i minuti che hai e vedi solo ciò che ci sta\n\nLA TUA CRONOLOGIA E GUARDA PIÙ TARDI\n- Tutto ciò che hai iniziato e mai finito\n- Filtra per canale, durata, visualizzazioni o per quando l'hai guardato\n- Ritrova quel video che sai di aver visto, senza scorrere all'infinito\n\nQUALSIASI PLAYLIST E LE TUE ISCRIZIONI\n- Quanto dura qualsiasi playlist, e quanto ti resta\n- Cerca e filtra qualsiasi playlist, tua o di altri, per intero\n- Le tue iscrizioni, solo i video non visti e sotto i 20 minuti\n- Attenua o nascondi i video che hai già visto in Home e in Iscrizioni\n\nPULISCI, RIPRODUCI, CONDIVIDI\n- Fai pulizia in Guarda più tardi e nelle tue playlist, togli i Mi piace in blocco e rimuovi i video eliminati, con annulla e un archivio per rimettere tutto a posto\n- Riproduci ciò che hai filtrato, in ordine, o copia i link per NotebookLM\n- Condividi un filtro come link: apre la stessa lista con gli stessi filtri per chiunque abbia Needle\n- Tastiera: / per cercare, j e k per spostarti, x per selezionare\n\nSTATISTICHE\n- Le durate e gli anni in cui un canale rende di più\n- Confronta due canali fianco a fianco\n- Una lista di osservazione che individua i video che superano le visualizzazioni abituali del loro canale\n\nNessun accesso, nessun account, niente viene inviato da nessuna parte. Funziona nel tuo browser.\n\nL'interfaccia dell'estensione è in inglese.\n\nNon affiliata a YouTube o Google."},{"code":"pl","lang":"Polish","d":"Nowość: wycisz kanał prosto z menu ⋮ samego YouTube, a zniknie z wyszukiwania, strony głównej, subskrypcji i Shorts. Opcja YouTube, by nie polecać kanału, nigdy nie dotyczy wyszukiwania. Ta tak.\n\nWyszukiwarka YouTube nie wie, co już obejrzano, nie filtruje według długości ani wyświetleń, a wyszukiwanie na kanale sprawdza tylko tytuły. Needle to naprawia, bezpośrednio w pasku wyszukiwania YouTube.\n\nWYCISZ KANAŁ, WSZĘDZIE\n- „Mute channel everywhere” w menu ⋮ każdego filmu\n- Znika z wyszukiwania, strony głównej, subskrypcji i z filmów obok tego, który oglądasz\n- Znikają też jego Shorts, na stronie głównej i w wyszukiwaniu\n- Wyciszanie słów: znika każdy film, który ma jedno z nich w tytule\n- Cofnij od razu, wyłącz wyciszenie kiedy chcesz i przenieś listę z innego blokera\n\nW PASKU WYSZUKIWANIA\n- Filmy z Do obejrzenia, polubione i historia pojawiają się już podczas pisania\n- Wpisuj filtry: <20m, >100k, unwatched, date:week, @kanał\n- in:playlists przeszukuje wszystkie zapisane playlisty\n- is:fresh ukrywa to, co było już Ci pokazane\n- Obserwuj wyszukiwanie i zobacz na każdej miniaturze, co już obejrzałeś\n\nPRZESZUKIWANIE KANAŁU\nKliknij przycisk z igłą na karcie Filmy dowolnego kanału. Needle czyta wszystkie filmy kanału, a nie tylko te już załadowane.\n- Filtruj według długości, wyświetleń, daty i słowa kluczowego\n- Ukryj to, co skończone, albo znajdź to, co zostało przerwane w połowie\n- Podaj, ile masz minut, i zobacz tylko to, co się zmieści\n\nHISTORIA I DO OBEJRZENIA\n- Wszystko, co zostało zaczęte i nigdy nie skończone\n- Filtruj według kanału, długości, wyświetleń lub daty obejrzenia\n- Znajdź ten jeden obejrzany film bez przewijania bez końca\n\nDOWOLNA PLAYLISTA I TWOJE SUBSKRYPCJE\n- Ile trwa dowolna playlista i ile z niej jeszcze zostało\n- Przeszukuj i filtruj dowolną playlistę, swoją lub cudzą, w całości\n- Twoje subskrypcje, tylko nieobejrzane i krótsze niż 20 minut\n- Przyciemnij lub ukryj obejrzane filmy na stronie głównej i w Subskrypcjach\n\nPORZĄDKI, ODTWARZANIE, UDOSTĘPNIANIE\n- Porządkuj Do obejrzenia i własne playlisty, usuwaj polubienia hurtem i czyść usunięte filmy, z cofaniem i archiwum, z którego wszystko przywrócisz\n- Odtwarzaj po kolei to, co przefiltrowano, albo skopiuj linki do NotebookLM\n- Udostępnij filtr jako link: otwiera tę samą listę z tymi samymi filtrami każdemu, kto ma Needle\n- Klawiatura: / do wyszukiwania, j i k do przechodzenia, x do zaznaczania\n\nSTATYSTYKI\n- Długości filmów i lata, w których kanał radzi sobie najlepiej\n- Porównaj dwa kanały obok siebie\n- Lista obserwowanych, która wyłapuje filmy bijące zwykłe wyświetlenia swojego kanału\n\nBez logowania, bez konta, nic nie jest nigdzie wysyłane. Działa w Twojej przeglądarce.\n\nInterfejs rozszerzenia jest po angielsku.\n\nNie jest powiązane z YouTube ani Google."},{"code":"th","lang":"Thai","d":"ใหม่: ซ่อนช่องได้จากเมนู ⋮ ของ YouTube เอง แล้วช่องนั้นจะหายไปจากการค้นหา หน้าแรก การติดตาม และ Shorts ตัวเลือกไม่แนะนำช่องของ YouTube ไม่เคยมีผลกับการค้นหา แต่อันนี้มีผล\n\nการค้นหาของ YouTube ไม่รู้ว่าคุณดูอะไรไปแล้ว กรองตามความยาวหรือยอดวิวไม่ได้ และการค้นหาในช่องก็ดูแค่ชื่อวิดีโอ Needle แก้ปัญหานี้ได้ในแถบค้นหาของ YouTube โดยตรง\n\nซ่อนช่อง ทุกที่\n- \"Mute channel everywhere\" ในเมนู ⋮ ของทุกวิดีโอ\n- หายไปจากการค้นหา หน้าแรก การติดตาม และวิดีโอข้างๆ ที่คุณกำลังดู\n- Shorts ของช่องก็หายไปด้วย ทั้งในหน้าแรกและการค้นหา\n- ซ่อนด้วยคำ: วิดีโอใดที่มีคำนั้นในชื่อจะหายไป\n- เลิกทำได้ทันที ยกเลิกการซ่อนได้ทุกเมื่อ และย้ายรายการมาจากตัวบล็อกอื่น\n\nในแถบค้นหา\n- วิดีโอในดูภายหลัง วิดีโอที่ชอบ และประวัติการดู จะแสดงขึ้นขณะพิมพ์\n- พิมพ์ตัวกรอง: <20m, >100k, unwatched, date:week, @ช่อง\n- in:playlists ค้นหาในทุกเพลย์ลิสต์ที่คุณบันทึกไว้\n- is:fresh ซ่อนสิ่งที่เคยแสดงให้คุณเห็นแล้ว\n- ติดตามการค้นหา และดูบนทุกภาพขนาดย่อว่าคุณดูอะไรไปแล้ว\n\nค้นหาในช่อง\nกดปุ่มรูปเข็มในแท็บวิดีโอของช่องใดก็ได้ Needle อ่านวิดีโอทั้งหมดของช่อง ไม่ใช่แค่ที่โหลดมาแล้ว\n- กรองตามความยาว ยอดวิว วันที่ และคำสำคัญ\n- ซ่อนวิดีโอที่ดูจบแล้ว หรือหาวิดีโอที่ดูค้างไว้\n- เลือกจำนวนนาทีที่มี แล้วดูเฉพาะวิดีโอที่พอดีเวลา\n\nประวัติการดูและดูภายหลัง\n- ทุกวิดีโอที่เริ่มดูแต่ยังไม่จบ\n- กรองตามช่อง ความยาว ยอดวิว หรือช่วงเวลาที่ดู\n- หาวิดีโอที่มั่นใจว่าเคยดูได้ โดยไม่ต้องเลื่อนหาไม่รู้จบ\n\nเพลย์ลิสต์ใดก็ได้ และช่องที่ติดตาม\n- เพลย์ลิสต์ใดๆ ยาวเท่าไร และเหลืออีกเท่าไร\n- ค้นหาและกรองเพลย์ลิสต์ใดก็ได้ ทั้งของคุณและของคนอื่น ได้ครบทั้งรายการ\n- ช่องที่คุณติดตาม เฉพาะวิดีโอที่ยังไม่ดูและสั้นกว่า 20 นาที\n- ทำให้จางหรือซ่อนวิดีโอที่ดูแล้วในหน้าแรกและการติดตาม\n\nจัดระเบียบ เล่น แชร์\n- จัดระเบียบดูภายหลังและเพลย์ลิสต์ของคุณเอง เลิกชอบทีละหลายรายการ และล้างวิดีโอที่ถูกลบ พร้อมการเลิกทำและที่เก็บถาวรสำหรับนำกลับมา\n- เล่นวิดีโอที่กรองไว้ตามลำดับ หรือคัดลอกลิงก์ไปใช้กับ NotebookLM\n- แชร์ตัวกรองเป็นลิงก์: ใครที่มี Needle เปิดแล้วจะเห็นรายการเดียวกันด้วยตัวกรองเดียวกัน\n- แป้นพิมพ์: / เพื่อค้นหา j และ k เพื่อเลื่อน x เพื่อเลือก\n\nข้อมูลเชิงลึก\n- ความยาววิดีโอและปีที่ช่องทำผลงานได้ดีที่สุด\n- เปรียบเทียบสองช่องแบบเคียงข้างกัน\n- รายการเฝ้าดูที่จับวิดีโอซึ่งมียอดวิวสูงกว่าปกติของช่อง\n\nไม่ต้องลงชื่อเข้าใช้ ไม่ต้องมีบัญชี ไม่ส่งข้อมูลไปที่ไหนเลย ทุกอย่างทำงานในเบราว์เซอร์ของคุณ\n\nหน้าตาของส่วนขยายเป็นภาษาอังกฤษ\n\nไม่มีส่วนเกี่ยวข้องกับ YouTube หรือ Google"},{"code":"ar","lang":"Arabic","d":"جديد: اكتم أي قناة من قائمة ⋮ في YouTube نفسها، فتختفي من البحث والصفحة الرئيسية والاشتراكات وShorts. خيار YouTube لإيقاف اقتراح القناة لا يمسّ البحث أبدًا. أما هذا فيفعل.\n\nبحث YouTube لا يعرف ما شاهدته من قبل، ولا يصفّي حسب المدة أو عدد المشاهدات، والبحث داخل القناة لا يطابق إلا العناوين. Needle يصلح ذلك مباشرة داخل شريط البحث في YouTube.\n\nاكتم أي قناة، في كل مكان\n- \"Mute channel everywhere\" في قائمة ⋮ لكل فيديو\n- تختفي من البحث والصفحة الرئيسية والاشتراكات والفيديوهات المجاورة لما تشاهده\n- ومقاطع Shorts الخاصة بها تختفي أيضًا، في الصفحة الرئيسية وفي البحث\n- اكتم كلمات: أي فيديو في عنوانه إحداها يختفي\n- تراجع فورًا، وألغِ الكتم متى شئت، وانقل قائمتك من أداة حظر أخرى\n\nفي شريط البحث\n- تظهر قائمة المشاهدة لاحقًا والفيديوهات التي أعجبتك وسجل المشاهدة أثناء الكتابة\n- اكتب فلاتر المدة والمشاهدات والتاريخ والقناة مباشرة في شريط البحث\n- يبحث in:playlists في كل قوائم التشغيل التي حفظتها\n- يخفي is:fresh ما عُرض عليك من قبل\n- تابع بحثًا، وشاهد ما شاهدته على كل صورة مصغّرة\n\nالبحث داخل قناة\nاضغط زر الإبرة في تبويب الفيديوهات لأي قناة. يقرأ Needle كل فيديوهات القناة، وليس فقط ما تم تحميله.\n- صفِّ حسب المدة والمشاهدات والتاريخ والكلمة المفتاحية\n- أخفِ ما أنهيت مشاهدته، أو اعثر على ما تركته في المنتصف\n- اختر عدد الدقائق المتاحة لديك وشاهد فقط ما يناسبها\n\nسجل المشاهدة والمشاهدة لاحقًا\n- كل ما بدأته ولم تُكمله\n- صفِّ حسب القناة أو المدة أو المشاهدات أو وقت مشاهدتك\n- اعثر على ذلك الفيديو الذي تعرف أنك شاهدته، دون تمرير لا ينتهي\n\nأي قائمة تشغيل واشتراكاتك\n- مدة أي قائمة تشغيل، وكم تبقّى لك منها\n- ابحث وصفِّ أي قائمة تشغيل، لك أو لغيرك، كاملة\n- اشتراكاتك، ما لم تشاهده فقط ومدته أقل من 20 دقيقة\n- خفِّت أو أخفِ الفيديوهات التي شاهدتها في الصفحة الرئيسية والاشتراكات\n\nالتنظيف والتشغيل والمشاركة\n- نظّف قائمة المشاهدة لاحقًا وقوائم التشغيل الخاصة بك، وألغِ الإعجابات دفعة واحدة، وأزل الفيديوهات المحذوفة، مع إمكانية التراجع وأرشيف لإعادة ما تريد\n- شغّل ما صفّيته بالترتيب، أو انسخ الروابط لاستخدامها في NotebookLM\n- شارك فلترًا كرابط: يفتح القائمة نفسها بالفلاتر نفسها لأي شخص لديه Needle\n- لوحة المفاتيح: / للبحث، و j و k للتنقل، و x للتحديد\n\nإحصاءات\n- مدد الفيديو والسنوات التي تحقق فيها القناة أفضل أداء\n- قارن بين قناتين جنبًا إلى جنب\n- قائمة متابعة تلتقط الفيديوهات التي تتجاوز المشاهدات المعتادة لقناتها\n\nبلا تسجيل دخول، بلا حساب، ولا يُرسل أي شيء إلى أي مكان. كل شيء يعمل داخل متصفحك.\n\nواجهة الإضافة باللغة الإنجليزية.\n\nغير تابعة لـ YouTube أو Google."},{"code":"zh_TW","lang":"Chinese (Taiwan)","d":"新功能：直接在 YouTube 自己的 ⋮ 選單封鎖頻道，它就會從搜尋、首頁、訂閱內容和 Shorts 中消失。YouTube 的「不要推薦這個頻道」從來管不到搜尋，這個可以。\n\nYouTube 的搜尋不知道你已經看過什麼，無法依長度或觀看次數篩選，頻道內搜尋也只比對標題。Needle 直接在 YouTube 的搜尋列裡解決這些問題。\n\n封鎖頻道，處處生效\n- 每部影片的 ⋮ 選單裡都有「Mute channel everywhere」\n- 從搜尋、首頁、訂閱內容，以及你正在看的影片旁邊消失\n- 它的 Shorts 也會消失，首頁和搜尋都是\n- 封鎖關鍵字：標題含有這些字的影片都會消失\n- 可立即復原，隨時解除封鎖，還能從其他封鎖工具匯入清單\n\n在搜尋列中\n- 輸入時就會顯示你的「稍後觀看」、喜歡的影片和觀看記錄\n- 輸入篩選條件：<20m、>100k、unwatched、date:week、@頻道\n- in:playlists 搜尋你儲存的所有播放清單\n- is:fresh 會隱藏之前已經出現過的結果\n- 追蹤一個搜尋，並在每張縮圖上看到你看過什麼\n\n搜尋一個頻道\n在任何頻道的「影片」分頁按下針形按鈕。它會讀取頻道的所有影片，而不只是已載入的部分。\n- 依長度、觀看次數、日期和關鍵字篩選\n- 隱藏已看完的影片，或找回看到一半的影片\n- 選擇你有幾分鐘，只顯示看得完的影片\n\n你的觀看記錄和稍後觀看\n- 所有開始看了卻沒看完的影片\n- 依頻道、長度、觀看次數或觀看時間篩選\n- 找到那部你確定看過的影片，不用一直往下捲\n\n任何播放清單和你的訂閱內容\n- 任何播放清單的總長度，以及還剩多少\n- 搜尋並篩選任何播放清單，不論是你的還是別人的，整份都能搜\n- 你的訂閱內容，只看沒看過且不到 20 分鐘的影片\n- 在首頁和訂閱內容中，將已看過的影片變暗或隱藏\n\n整理、播放、分享\n- 整理「稍後觀看」和你自己的播放清單，大量取消喜歡，清除已刪除的影片，可以復原，還有封存區能隨時放回去\n- 依序播放篩選結果，或為 NotebookLM 複製連結\n- 把篩選以連結分享：有安裝 Needle 的人打開後，會看到同一份清單和同樣的篩選\n- 鍵盤：/ 搜尋，j 和 k 移動，x 選取\n\n數據洞察\n- 一個頻道表現最好的影片長度和年份\n- 並排比較兩個頻道\n- 一份追蹤清單，找出超越頻道平常觀看次數的影片\n\n不需登入，不需帳號，不會傳送任何資料到任何地方。全部在你的瀏覽器中執行。\n\n擴充功能介面為英文。\n\n與 YouTube 或 Google 無關。"},{"code":"fil","lang":"Filipino","d":"Bago: i-mute ang isang channel mula mismo sa ⋮ menu ng YouTube, at mawawala ito sa search, Home, Subscriptions at Shorts. Ang opsyon ng YouTube na huwag irekomenda ang channel ay hindi kailanman umaabot sa search. Ito, oo.\n\nHindi alam ng search ng YouTube kung ano na ang napanood mo, hindi ito makapag-filter ayon sa haba o views, at ang paghahanap sa loob ng channel ay tumitingin lang sa mga pamagat. Inaayos iyan ng Needle, mismo sa search bar ng YouTube.\n\nI-MUTE ANG CHANNEL, KAHIT SAAN\n- \"Mute channel everywhere\" sa ⋮ menu ng bawat video\n- Wala na sa search, Home, Subscriptions at sa mga video katabi ng pinapanood mo\n- Mawawala rin ang Shorts nito, sa Home at sa search\n- I-mute ang mga salita: mawawala ang anumang video na may isa sa mga ito sa pamagat\n- I-undo agad, i-unmute anumang oras, at ilipat ang listahan mo mula sa ibang blocker\n\nSA SEARCH BAR\n- Lumalabas ang Panoorin Mamaya, mga ni-like mo at ang iyong history habang nagta-type ka\n- Mag-type ng filter: <20m, >100k, unwatched, date:week, @channel\n- Hinahanap ng in:playlists ang bawat playlist na na-save mo\n- Itinatago ng is:fresh ang mga naipakita na sa iyo\n- I-follow ang isang search, at makita sa bawat thumbnail kung ano na ang napanood mo\n\nMAGHANAP SA ISANG CHANNEL\nPindutin ang needle button sa Videos tab ng kahit anong channel. Binabasa ng Needle ang bawat video ng channel, hindi lang ang mga na-load na.\n- Mag-filter ayon sa haba, views, petsa at keyword\n- Itago ang mga natapos mo na, o hanapin ang mga hindi mo tinapos\n- Piliin kung ilang minuto ang mayroon ka at makita lang ang kasya\n\nANG IYONG HISTORY AT PANOORIN MAMAYA\n- Lahat ng sinimulan mo pero hindi tinapos\n- Mag-filter ayon sa channel, haba, views o kung kailan mo ito pinanood\n- Hanapin ang video na sigurado kang napanood mo na, nang hindi nag-i-scroll nang walang katapusan\n\nKAHIT ANONG PLAYLIST AT ANG IYONG MGA SUBSCRIPTION\n- Gaano kahaba ang anumang playlist, at gaano pa ang natitira sa iyo\n- Maghanap at mag-filter sa kahit anong playlist, sa iyo man o sa iba, buo\n- Ang iyong mga subscription, ang hindi mo pa napapanood at wala pang 20 minuto lang\n- Palabuin o itago ang mga napanood mo na sa Home at sa Mga Subscription\n\nMAGLINIS, MAG-PLAY, MAG-SHARE\n- Linisin ang Panoorin Mamaya at ang sarili mong mga playlist, mag-unlike nang maramihan at alisin ang mga na-delete na video, may undo at archive para maibalik ang anuman\n- I-play ang na-filter mo nang sunud-sunod, o kopyahin ang mga link para sa NotebookLM\n- I-share ang isang filter bilang link: binubuksan nito ang parehong listahan na may parehong filter para sa sinumang may Needle\n- Keyboard: / para maghanap, j at k para gumalaw, x para pumili\n\nINSIGHTS\n- Ang haba ng video at mga taon kung kailan pinakamagaling ang isang channel\n- Ikumpara ang dalawang channel nang magkatabi\n- Isang watchlist na nakakakita ng mga video na lumalampas sa karaniwang views ng kanilang channel\n\nWalang sign-in, walang account, walang ipinapadala kahit saan. Tumatakbo ito sa iyong browser.\n\nNasa Ingles ang interface ng extension.\n\nHindi kaakibat ng YouTube o Google."},{"code":"uk","lang":"Ukrainian","d":"Нове: приховайте канал просто з меню ⋮ самого YouTube, і він зникне з пошуку, головної, підписок і Shorts. Опція YouTube не рекомендувати канал ніколи не впливає на пошук. Ця впливає.\n\nПошук YouTube не знає, що ви вже дивилися, не фільтрує за тривалістю чи переглядами, а пошук на каналі перевіряє лише назви. Needle виправляє це просто в рядку пошуку YouTube.\n\nПРИХОВАЙТЕ КАНАЛ, СКРІЗЬ\n- «Mute channel everywhere» у меню ⋮ кожного відео\n- Зникає з пошуку, головної, підписок і з відео поруч із тим, що ви дивитеся\n- Його Shorts теж зникають, на головній і в пошуку\n- Приховування за словами: зникає будь-яке відео, у назві якого є одне з них\n- Скасуйте одразу, поверніть будь-коли та перенесіть список з іншого блокувальника\n\nУ РЯДКУ ПОШУКУ\n- «Переглянути пізніше», вподобані відео та історія з'являються, поки ви друкуєте\n- Вводьте фільтри: <20m, >100k, unwatched, date:week, @канал\n- in:playlists шукає в усіх збережених плейлистах\n- is:fresh приховує те, що вам уже показували\n- Стежте за пошуком і бачте на кожній мініатюрі, що ви вже дивилися\n\nПОШУК НА КАНАЛІ\nНатисніть кнопку з голкою на вкладці «Відео» будь-якого каналу. Needle читає всі відео каналу, а не лише вже завантажені.\n- Фільтруйте за тривалістю, переглядами, датою та ключовим словом\n- Приховуйте досмотрене або знаходьте покинуте на півдорозі\n- Вкажіть, скільки у вас хвилин, і дивіться лише те, що встигнете\n\nІСТОРІЯ І «ПЕРЕГЛЯНУТИ ПІЗНІШЕ»\n- Усе, що ви почали й так і не додивилися\n- Фільтруйте за каналом, тривалістю, переглядами або часом перегляду\n- Знайдіть те саме відео, яке точно дивилися, без нескінченного прокручування\n\nБУДЬ-ЯКИЙ ПЛЕЙЛИСТ І ВАШІ ПІДПИСКИ\n- Скільки триває будь-який плейлист і скільки вам ще лишилося\n- Шукайте й фільтруйте будь-який плейлист, свій чи чужий, повністю\n- Ваші підписки: лише непереглянуте й коротше за 20 хвилин\n- Приглушуйте або приховуйте вже переглянуті відео на головній і в підписках\n\nНАВЕСТИ ЛАД, ВІДТВОРИТИ, ПОДІЛИТИСЯ\n- Наводьте лад у «Переглянути пізніше» та власних плейлистах, знімайте вподобання гуртом і прибирайте видалені відео, з відміною та архівом, щоб усе повернути\n- Відтворюйте відфільтроване по черзі або копіюйте посилання для NotebookLM\n- Діліться фільтром як посиланням: у будь-кого з Needle відкриється той самий список з тими самими фільтрами\n- Клавіатура: / для пошуку, j і k для переміщення, x для вибору\n\nАНАЛІТИКА\n- Тривалість і роки, у які канал має найкращі результати\n- Порівняння двох каналів пліч-о-пліч\n- Список спостереження, що знаходить відео, які випереджають звичні перегляди свого каналу\n\nБез входу, без облікового запису, нічого нікуди не надсилається. Усе працює у вашому браузері.\n\nІнтерфейс розширення англійською мовою.\n\nНе пов'язано з YouTube або Google."},{"code":"nl","lang":"Dutch","d":"Nieuw: demp een kanaal vanuit YouTubes eigen ⋮-menu, en het verdwijnt uit zoeken, de startpagina, abonnementen en Shorts. YouTubes optie om een kanaal niet meer aan te bevelen, raakt de zoekresultaten nooit. Deze wel.\n\nDe zoekfunctie van YouTube weet niet wat je al hebt gezien, filtert niet op lengte of weergaven, en zoeken in een kanaal kijkt alleen naar titels. Needle lost dat op, direct in de zoekbalk van YouTube.\n\nEEN KANAAL DEMPEN, OVERAL\n- 'Mute channel everywhere' in het ⋮-menu van elke video\n- Weg uit zoeken, de startpagina, abonnementen en de video's naast de video die je kijkt\n- Ook de Shorts gaan weg, op de startpagina en in zoeken\n- Woorden dempen: elke video met zo'n woord in de titel verdwijnt\n- Meteen ongedaan maken, wanneer je wilt weer tonen, en je lijst overzetten vanuit een andere blocker\n\nIN DE ZOEKBALK\n- Je video's uit Later bekijken, je likes en je geschiedenis verschijnen terwijl je typt\n- Typ filters: <20m, >100k, unwatched, date:week, @kanaal\n- in:playlists doorzoekt elke afspeellijst die je hebt opgeslagen\n- is:fresh verbergt wat je al eerder te zien kreeg\n- Volg een zoekopdracht en zie op elke thumbnail wat je al hebt gezien\n\nEEN KANAAL DOORZOEKEN\nKlik op de naaldknop op het tabblad Video's van elk kanaal. Needle leest alle video's van het kanaal, niet alleen wat al geladen is.\n- Filter op lengte, weergaven, datum en trefwoord\n- Verberg wat je hebt uitgekeken of vind terug wat je halverwege liet liggen\n- Geef aan hoeveel minuten je hebt en zie alleen wat erin past\n\nJE GESCHIEDENIS EN LATER BEKIJKEN\n- Alles wat je bent begonnen en nooit hebt afgemaakt\n- Filter op kanaal, lengte, weergaven of wanneer je het keek\n- Vind die video waarvan je zeker weet dat je hem hebt gezien, zonder eindeloos te scrollen\n\nELKE AFSPEELLIJST EN JE ABONNEMENTEN\n- Hoe lang een playlist is, en hoeveel je er nog van over hebt\n- Doorzoek en filter elke afspeellijst, van jezelf of van een ander, helemaal\n- Je abonnementen, alleen wat je nog niet zag en korter dan 20 minuten\n- Dim of verberg video's die je al hebt gezien op Home en bij Abonnementen\n\nOPRUIMEN, AFSPELEN, DELEN\n- Ruim Later bekijken en je eigen afspeellijsten op, haal likes in één keer weg en gooi verwijderde video's eruit, met ongedaan maken en een archief om alles terug te zetten\n- Speel af wat je hebt gefilterd, op volgorde, of kopieer de links voor NotebookLM\n- Deel een filter als link: die opent dezelfde lijst met dezelfde filters voor iedereen met Needle\n- Toetsenbord: / om te zoeken, j en k om te bewegen, x om te kiezen\n\nINZICHTEN\n- De videolengtes en jaren waarin een kanaal het best presteert\n- Vergelijk twee kanalen naast elkaar\n- Een volglijst die video's vindt die beter scoren dan de gebruikelijke weergaven van hun kanaal\n\nNiet inloggen, geen account, er wordt niets verstuurd. Alles draait in je browser.\n\nDe interface van de extensie is in het Engels.\n\nNiet verbonden aan YouTube of Google."},{"code":"ms","lang":"Malay","d":"Baharu: senyapkan saluran terus dari menu ⋮ YouTube sendiri, dan ia hilang daripada carian, Laman Utama, Langganan dan Shorts. Pilihan YouTube untuk tidak mengesyorkan saluran tidak pernah menyentuh carian. Yang ini menyentuh.\n\nCarian YouTube tidak tahu apa yang anda sudah tonton, tidak boleh menapis mengikut tempoh atau tontonan, dan carian dalam saluran hanya memadankan tajuk. Needle membetulkannya, terus di dalam bar carian YouTube.\n\nSENYAPKAN SALURAN, DI MANA-MANA\n- \"Mute channel everywhere\" dalam menu ⋮ setiap video\n- Hilang daripada carian, Laman Utama, Langganan dan video di sebelah video yang anda tonton\n- Shorts saluran itu juga hilang, di Laman Utama dan dalam carian\n- Senyapkan perkataan: mana-mana video yang tajuknya mengandungi salah satunya hilang\n- Buat asal serta-merta, nyahsenyap bila-bila masa, dan bawa senarai anda dari penyekat lain\n\nDALAM BAR CARIAN\n- Tonton Kemudian, video yang anda suka dan sejarah anda muncul semasa anda menaip\n- Taip penapis: <20m, >100k, unwatched, date:week, @saluran\n- in:playlists mencari dalam setiap senarai main yang anda simpan\n- is:fresh menyembunyikan apa yang sudah ditunjukkan kepada anda\n- Ikuti carian, dan lihat apa yang telah anda tonton pada setiap lakaran kecil\n\nCARI DALAM SALURAN\nTekan butang jarum pada tab Video mana-mana saluran. Needle membaca setiap video saluran itu, bukan hanya yang sudah dimuatkan.\n- Tapis mengikut tempoh, tontonan, tarikh dan kata kunci\n- Sembunyikan yang sudah habis ditonton, atau cari yang anda tinggalkan separuh jalan\n- Pilih berapa minit yang anda ada dan lihat hanya yang muat\n\nSEJARAH DAN TONTON KEMUDIAN\n- Semua yang anda mula tetapi tidak pernah habiskan\n- Tapis mengikut saluran, tempoh, tontonan atau bila anda menontonnya\n- Cari video yang anda pasti pernah tonton, tanpa menatal tanpa henti\n\nMANA-MANA SENARAI MAIN DAN LANGGANAN ANDA\n- Berapa panjang mana-mana senarai main, dan berapa yang tinggal\n- Cari dan tapis mana-mana senarai main, milik anda atau orang lain, sepenuhnya\n- Langganan anda, hanya yang belum ditonton dan bawah 20 minit\n- Malapkan atau sembunyikan video yang sudah anda tonton di Laman Utama dan Langganan\n\nKEMAS, MAIN, KONGSI\n- Kemas Tonton Kemudian dan senarai main anda sendiri, batalkan suka secara pukal dan buang video yang telah dipadam, dengan buat asal dan arkib untuk memulangkannya\n- Mainkan apa yang anda tapis, mengikut urutan, atau salin pautannya untuk NotebookLM\n- Kongsi penapis sebagai pautan: ia membuka senarai yang sama dengan penapis yang sama untuk sesiapa yang ada Needle\n- Papan kekunci: / untuk mencari, j dan k untuk bergerak, x untuk memilih\n\nSTATISTIK\n- Tempoh video dan tahun yang paling berjaya bagi sesebuah saluran\n- Bandingkan dua saluran bersebelahan\n- Senarai pantau yang mengesan video yang mengatasi tontonan biasa salurannya\n\nTiada log masuk, tiada akaun, tiada apa-apa dihantar ke mana-mana. Semuanya berjalan dalam pelayar anda.\n\nAntara muka sambungan ini dalam bahasa Inggeris.\n\nTidak bergabung dengan YouTube atau Google."},{"code":"bn","lang":"Bangla","d":"নতুন: YouTube-এর নিজের ⋮ মেনু থেকে কোনো চ্যানেল মিউট করুন, সেটি সার্চ, হোম, সাবস্ক্রিপশন আর Shorts থেকে উধাও হয়ে যাবে। YouTube-এর চ্যানেল সাজেস্ট না করার অপশন সার্চে কখনো কাজ করে না। এটা করে।\n\nYouTube-এর সার্চ জানে না আপনি আগে কী দেখেছেন, দৈর্ঘ্য বা ভিউ দিয়ে ফিল্টার করতে পারে না, আর চ্যানেলের ভেতরের সার্চ শুধু শিরোনাম মেলায়। Needle এই সমস্যার সমাধান করে, সরাসরি YouTube-এর সার্চ বারেই।\n\nচ্যানেল মিউট করুন, সব জায়গায়\n- প্রতিটি ভিডিওর ⋮ মেনুতে \"Mute channel everywhere\"\n- সার্চ, হোম, সাবস্ক্রিপশন আর আপনি যে ভিডিও দেখছেন তার পাশের ভিডিও থেকে উধাও\n- এর Shorts-ও চলে যায়, হোমে আর সার্চে\n- শব্দ মিউট করুন: শিরোনামে সেই শব্দ থাকলে যেকোনো ভিডিও উধাও\n- সঙ্গে সঙ্গে আনডু করুন, যখন খুশি আনমিউট করুন, আর অন্য ব্লকার থেকে তালিকা নিয়ে আসুন\n\nসার্চ বারে\n- টাইপ করার সময়ই আপনার পরে দেখুন, পছন্দ করা ভিডিও আর ইতিহাস দেখা যায়\n- ফিল্টার টাইপ করুন: <20m, >100k, unwatched, date:week, @চ্যানেল\n- in:playlists আপনার সেভ করা প্রতিটি প্লেলিস্টে খোঁজে\n- is:fresh আগে দেখানো জিনিস লুকিয়ে রাখে\n- কোনো সার্চ ফলো করুন, আর প্রতিটি থাম্বনেইলে দেখুন কী দেখেছেন\n\nচ্যানেলের ভেতরে খুঁজুন\nযেকোনো চ্যানেলের ভিডিও ট্যাবে সুইয়ের বোতাম চাপুন। Needle চ্যানেলের প্রতিটি ভিডিও পড়ে, শুধু লোড হওয়াগুলো নয়।\n- দৈর্ঘ্য, ভিউ, তারিখ আর কীওয়ার্ড দিয়ে ফিল্টার করুন\n- যা পুরো দেখেছেন তা লুকান, বা যা মাঝপথে ছেড়েছেন তা খুঁজে নিন\n- আপনার হাতে কত মিনিট আছে বেছে নিন, শুধু সেই সময়ে যা আঁটে তাই দেখুন\n\nআপনার ইতিহাস আর পরে দেখুন\n- যা শুরু করেছিলেন কিন্তু কখনো শেষ করেননি\n- চ্যানেল, দৈর্ঘ্য, ভিউ বা কখন দেখেছেন তা দিয়ে ফিল্টার করুন\n- যে ভিডিওটা নিশ্চিত দেখেছিলেন, সেটা ાછું લાવવા માટે એક આર્કાઇવ સાથે\n- જે ફિલ્ટર કર્યું તે ક્રમમાં પ્લે કરો, અથવા NotebookLM માટે લિંક કૉપિ કરો\n- કોઈ ફિલ્ટરને લિંક તરીકે શેર કરો: જેની પાસે Needle હોય તેના માટે એ જ યાદી એ જ ફિલ્ટર સાથે ખૂલે છે\n- કીબોર્ડ: શોધવા માટે /, આગળ-પાછળ જવા માટે j અને k, પસંદ કરવા માટે x\n\nઇનસાઇટ્સ\n- કોઈ ચેનલ માટે સૌથી સારી ચાલતી વીડિયો લંબાઈ અને વર્ષો\n- બે ચેનલની બાજુ-બાજુમાં તુલના કરો\n- ચેનલના સામાન્ય વ્યૂઝથી આગળ નીકળતા વીડિયો પકડતી વૉચલિસ્ટ\n\nસાઇન-ઇન નહીં, એકાઉન્ટ નહીં, ક્યાંય કંઈ મોકલાતું નથી. બધું તમારા બ્રાઉઝરમાં જ ચાલે છે.\n\nએક્સ્ટેન્શનનું ઇન્ટરફેસ અંગ્રેજીમાં છે.\n\nYouTube અથવા Google સાથે સંકળાયેલ નથી."},{"code":"kn","lang":"Kannada","d":"ಹೊಸದು: YouTube ನದೇ ⋮ ಮೆನುವಿನಿಂದ ಚಾನಲ್ ಅನ್ನು ಮ್ಯೂಟ್ ಮಾಡಿ, ಅದು ಹುಡುಕಾಟ, ಹೋಮ್, ಚಂದಾದಾರಿಕೆಗಳು ಮತ್ತು Shorts ನಿಂದ ಮಾಯವಾಗುತ್ತದೆ. ಚಾನಲ್ ಶಿಫಾರಸು ಮಾಡದಿರುವ YouTube ನ ಆಯ್ಕೆ ಹುಡುಕಾಟವನ್ನು ಎಂದಿಗೂ ಮುಟ್ಟುವುದಿಲ್ಲ. ಇದು ಮುಟ್ಟುತ್ತದೆ.\n\nನೀವು ಈಗಾಗಲೇ ಏನು ನೋಡಿದ್ದೀರಿ ಎಂಬುದು YouTube ಹುಡುಕಾಟಕ್ಕೆ ತಿಳಿದಿಲ್ಲ, ಉದ್ದ ಅಥವಾ ವೀಕ್ಷಣೆಗಳ ಆಧಾರದಲ್ಲಿ ಫಿಲ್ಟರ್ ಮಾಡಲಾಗುವುದಿಲ್ಲ, ಮತ್ತು ಚಾನಲ್ ಒಳಗಿನ ಹುಡುಕಾಟ ಶೀರ್ಷಿಕೆಗಳನ್ನು ಮಾತ್ರ ನೋಡುತ್ತದೆ. Needle ಇದನ್ನು ನೇರವಾಗಿ YouTube ಹುಡುಕಾಟ ಪಟ್ಟಿಯಲ್ಲೇ ಸರಿಪಡಿಸುತ್ತದೆ.\n\nಚಾನಲ್ ಮ್ಯೂಟ್ ಮಾಡಿ, ಎಲ್ಲೆಡೆ\n- ಪ್ರತಿ ವೀಡಿಯೊದ ⋮ ಮೆನುವಿನಲ್ಲಿ \"Mute channel everywhere\"\n- ಹುಡುಕಾಟ, ಹೋಮ್, ಚಂದಾದಾರಿಕೆಗಳು ಮತ್ತು ನೀವು ನೋಡುತ್ತಿರುವ ವೀಡಿಯೊದ ಪಕ್ಕದ ವೀಡಿಯೊಗಳಿಂದ ಮಾಯ\n- ಅದರ Shorts ಕೂಡ ಹೋಗುತ್ತವೆ, ಹೋಮ್‌ನಲ್ಲಿ ಮತ್ತು ಹುಡುಕಾಟದಲ್ಲಿ\n- ಪದಗಳನ್ನು ಮ್ಯೂಟ್ ಮಾಡಿ: ಶೀರ್ಷಿಕೆಯಲ್ಲಿ ಅವುಗಳಲ್ಲಿ ಒಂದು ಇರುವ ಯಾವುದೇ ವೀಡಿಯೊ ಮಾಯ\n- ತಕ್ಷಣ ರದ್ದುಗೊಳಿಸಿ, ಯಾವಾಗ ಬೇಕಾದರೂ ಅನ್‌ಮ್ಯೂಟ್ ಮಾಡಿ, ಮತ್ತು ಬೇರೆ ಬ್ಲಾಕರ್‌ನಿಂದ ಪಟ್ಟಿಯನ್ನು ತನ್ನಿ\n\nಹುಡುಕಾಟ ಪಟ್ಟಿಯಲ್ಲಿ\n- ಟೈಪ್ ಮಾಡುತ್ತಿದ್ದಂತೆಯೇ ನಿಮ್ಮ ನಂತರ ವೀಕ್ಷಿಸಿ, ಇಷ್ಟಪಟ್ಟ ವೀಡಿಯೊಗಳು ಮತ್ತು ಇತಿಹಾಸ ಕಾಣಿಸುತ್ತವೆ\n- ಫಿಲ್ಟರ್ ಟೈಪ್ ಮಾಡಿ: <20m, >100k, unwatched, date:week, @ಚಾನಲ್\n- in:playlists ನೀವು ಸೇವ್ ಮಾಡಿದ ಪ್ರತಿಯೊಂದು ಪ್ಲೇಪಟ್ಟಿಯಲ್ಲೂ ಹುಡುಕುತ್ತದೆ\n- is:fresh ಈಗಾಗಲೇ ತೋರಿಸಿದ್ದನ್ನು ಮರೆಮಾಡುತ್ತದೆ\n- ಹುಡುಕಾಟವನ್ನು ಫಾಲೋ ಮಾಡಿ, ಪ್ರತಿ ಥಂಬ್‌ನೇಲ್‌ನಲ್ಲಿ ನೀವು ಏನು ನೋಡಿದ್ದೀರಿ ಎಂದು ನೋಡಿ\n\nಒಂದು ಚಾನಲ್ ಒಳಗೆ ಹುಡುಕಿ\nಯಾವುದೇ ಚಾನಲ್ ನ ವೀಡಿಯೊಗಳು ಟ್ಯಾಬ್ ನಲ್ಲಿ ಸೂಜಿ ಬಟನ್ ಒತ್ತಿ. ಲೋಡ್ ಆದವು ಮಾತ್ರವಲ್ಲ, ಚಾನಲ್ ನ ಪ್ರತಿಯೊಂದು ವೀಡಿಯೊವನ್ನು Needle ಓದುತ್ತದೆ.\n- ಉದ್ದ, ವೀಕ್ಷಣೆಗಳು, ದಿನಾಂಕ ಮತ್ತು ಕೀವರ್ಡ್ ಮೂಲಕ ಫಿಲ್ಟರ್ ಮಾಡಿ\n- ಪೂರ್ತಿ ನೋಡಿದ್ದನ್ನು ಮರೆಮಾಡಿ, ಅಥವಾ ಅರ್ಧಕ್ಕೆ ಬಿಟ್ಟದ್ದನ್ನು ಹುಡುಕಿ\n- ನಿಮ್ಮ ಬಳಿ ಎಷ್ಟು ನಿಮಿಷಗಳಿವೆ ಎಂದು ಆರಿಸಿ, ಅಷ್ಟರಲ್ಲಿ ಮುಗಿಯುವುದನ್ನು ಮಾತ್ರ ನೋಡಿ\n\nನಿಮ್ಮ ಇತಿಹಾಸ ಮತ್ತು ನಂತರ ವೀಕ್ಷಿಸಿ\n- ನೀವು ಶುರು ಮಾಡಿ ಎಂದೂ ಮುಗಿಸದ ಎಲ್ಲವೂ\n- ಚಾನಲ್, ಉದ್ದ, ವೀಕ್ಷಣೆಗಳು ಅಥವಾ ನೀವು ನೋಡಿದ ಸಮಯದ ಮೂಲಕ ಫಿಲ್ಟರ್ ಮಾಡಿ\n- ಖಂಡಿತ ನೋಡಿದ್ದ ಆ ವೀಡಿಯೊವನ್ನು, ಕೊನೆಯಿಲ್ಲದೆ ಸ್ಕ್ರೋಲ್ ಮಾಡದೆ ಹುಡುಕಿ\n\nಯಾವುದೇ ಪ್ಲೇಪಟ್ಟಿ ಮತ್ತು ನಿಮ್ಮ ಸಬ್‌ಸ್ಕ್ರಿಪ್ಶನ್‌ಗಳು\n- ಯಾವುದೇ ಪ್ಲೇಲಿಸ್ಟ್ ಎಷ್ಟು ಉದ್ದ, ಮತ್ತು ಅದರಲ್ಲಿ ಎಷ್ಟು ಉಳಿದಿದೆ\n- ನಿಮ್ಮದಾಗಲಿ ಬೇರೆಯವರದಾಗಲಿ, ಯಾವುದೇ ಪ್ಲೇಪಟ್ಟಿಯನ್ನು ಪೂರ್ತಿಯಾಗಿ ಹುಡುಕಿ, ಫಿಲ್ಟರ್ ಮಾಡಿ\n- ನಿಮ್ಮ ಸಬ್‌ಸ್ಕ್ರಿಪ್ಶನ್‌ಗಳು, ನೋಡದ ಮತ್ತು 20 ನಿಮಿಷಕ್ಕಿಂತ ಕಡಿಮೆಯ ವೀಡಿಯೊಗಳು ಮಾತ್ರ\n- ಹೋಮ್ ಮತ್ತು ಸಬ್‌ಸ್ಕ್ರಿಪ್ಶನ್‌ಗಳಲ್ಲಿ ಈಗಾಗಲೇ ನೋಡಿದ ವೀಡಿಯೊಗಳನ್ನು ಮಂದಗೊಳಿಸಿ ಅಥವಾ ಮರೆಮಾಡಿ\n\nಸ್ವಚ್ಛಗೊಳಿಸಿ, ಪ್ಲೇ ಮಾಡಿ, ಹಂಚಿಕೊಳ್ಳಿ\n- ನಂತರ ವೀಕ್ಷಿಸಿ ಮತ್ತು ನಿಮ್ಮ ಸ್ವಂತ ಪ್ಲೇಪಟ್ಟಿಗಳನ್ನು ಸ್ವಚ್ಛಗೊಳಿಸಿ, ಒಮ್ಮೆಗೇ ಹಲವು ಲೈಕ್‌ಗಳನ್ನು ತೆಗೆಯಿರಿ, ಅಳಿಸಲಾದ ವೀಡಿಯೊಗಳನ್ನು ತೆಗೆದುಹಾಕಿ, ಅನ್‌ಡೂ ಮತ್ತು ಎಲ್ಲವನ್ನೂ ಮರಳಿ ತರಲು ಒಂದು ಆರ್ಕೈವ್ ಜೊತೆಗೆ\n- ಫಿಲ್ಟರ್ ಮಾಡಿದ್ದನ್ನು ಕ್ರಮವಾಗಿ ಪ್ಲೇ ಮಾಡಿ, ಅಥವಾ NotebookLM ಗಾಗಿ ಲಿಂಕ್‌ಗಳನ್ನು ಕಾಪಿ ಮಾಡಿ\n- ಒಂದು ಫಿಲ್ಟರ್ ಅನ್ನು ಲಿಂಕ್ ಆಗಿ ಹಂಚಿಕೊಳ್ಳಿ: Needle ಇರುವ ಯಾರಿಗಾದರೂ ಅದೇ ಪಟ್ಟಿ ಅದೇ ಫಿಲ್ಟರ್‌ಗಳೊಂದಿಗೆ ತೆರೆಯುತ್ತದೆ\n- ಕೀಬೋರ್ಡ್: ಹುಡುಕಲು /, ಸರಿಸಲು j ಮತ್ತು k, ಆಯ್ಕೆ ಮಾಡಲು x\n\nಒಳನೋಟಗಳು\n- ಒಂದು ಚಾನಲ್ ಗೆ ಅತ್ಯುತ್ತಮವಾಗಿ ಕೆಲಸ ಮಾಡುವ ವೀಡಿಯೊ ಉದ್ದಗಳು ಮತ್ತು ವರ್ಷಗಳು\n- ಎರಡು ಚಾನಲ್ ಗಳನ್ನು ಅಕ್ಕಪಕ್ಕ ಹೋಲಿಸಿ\n- ಚಾನಲ್ ನ ಸಾಮಾನ್ಯ ವೀಕ್ಷಣೆಗಳನ್ನು ಮೀರುವ ವೀಡಿಯೊಗಳನ್ನು ಗುರುತಿಸುವ ವಾಚ್ ಲಿಸ್ಟ್\n\nಸೈನ್ ಇನ್ ಇಲ್ಲ, ಖಾತೆ ಇಲ್ಲ, ಎಲ್ಲಿಗೂ ಏನನ್ನೂ ಕಳುಹಿಸುವುದಿಲ್ಲ. ಎಲ್ಲವೂ ನಿಮ್ಮ ಬ್ರೌಸರ್ ನಲ್ಲೇ ನಡೆಯುತ್ತದೆ.\n\nಎಕ್ಸ್ ಟೆನ್ಶನ್ ನ ಇಂಟರ್ ಫೇಸ್ ಇಂಗ್ಲಿಷ್ ನಲ್ಲಿದೆ.\n\nYouTube ಅಥವಾ Google ಜೊತೆ ಸಂಬಂಧ ಹೊಂದಿಲ್ಲ."},{"code":"ml","lang":"Malayalam","d":"പുതിയത്: YouTube-ന്റെ സ്വന്തം ⋮ മെനുവിൽ നിന്ന് ഒരു ചാനൽ മ്യൂട്ട് ചെയ്യൂ, അത് തിരയൽ, ഹോം, സബ്‌സ്‌ക്രിപ്‌ഷനുകൾ, Shorts എന്നിവയിൽ നിന്ന് അപ്രത്യക്ഷമാകും. ചാനൽ ശുപാർശ ചെയ്യരുത് എന്ന YouTube ഓപ്ഷൻ തിരയലിനെ ഒരിക്കലും ബാധിക്കില്ല. ഇത് ബാധിക്കും.\n\nനിങ്ങൾ ഇതിനകം എന്ത് കണ്ടു എന്ന് YouTube തിരയലിന് അറിയില פי אורך או מספר צפיות, והחיפוש בתוך ערוץ בודק רק כותרות. Needle מתקן את זה, ישירות בשורת החיפוש של YouTube.\n\nהשתקת ערוץ, בכל מקום\n- \"Mute channel everywhere\" בתפריט ⋮ של כל סרטון\n- נעלם מהחיפוש, מדף הבית, מהמינויים ומהסרטונים שליד הסרטון שאתם צופים בו\n- גם ה-Shorts שלו נעלמים, בדף הבית ובחיפוש\n- השתקת מילים: כל סרטון שיש בכותרת שלו אחת מהן נעלם\n- ביטול מיידי, ביטול השתקה בכל עת, והעברת רשימה מחוסם אחר\n\nבשורת החיפוש\n- הסרטונים מ'לצפייה בהמשך', הסרטונים שאהבתם וההיסטוריה שלכם מופיעים כבר בזמן ההקלדה\n- הקלידו מסננים לאורך, לצפיות, לתאריך ולערוץ ישירות בשורת החיפוש\n- in:playlists מחפש בכל הפלייליסטים ששמרתם\n- is:fresh מסתיר את מה שכבר הוצג לכם\n- עקבו אחרי חיפוש, וראו על כל תמונה ממוזערת מה כבר ראיתם\n\nחיפוש בתוך ערוץ\nלחצו על כפתור המחט בכרטיסייה סרטונים של כל ערוץ. Needle קורא את כל הסרטונים של הערוץ, לא רק את אלה שכבר נטענו.\n- סננו לפי אורך, צפיות, תאריך ומילת מפתח\n- הסתירו את מה שסיימתם, או מצאו את מה שעזבתם באמצע\n- בחרו כמה דקות יש לכם וראו רק את מה שנכנס בהן\n\nההיסטוריה שלכם ולצפייה בהמשך\n- כל מה שהתחלתם ולא סיימתם\n- סננו לפי ערוץ, אורך, צפיות או מתי צפיתם\n- מצאו את הסרטון הזה שאתם בטוחים שראיתם, בלי לגלול בלי סוף\n\nכל פלייליסט והמינויים שלכם\n- כמה ארוך כל פלייליסט, וכמה נשאר לכם ממנו\n- חפשו וסננו כל פלייליסט, שלכם או של מישהו אחר, את כולו\n- המינויים שלכם, רק מה שלא ראיתם ומה שקצר מ-20 דקות\n- עמעמו או הסתירו סרטונים שכבר ראיתם בדף הבית ובמינויים\n\nניקוי, הפעלה, שיתוף\n- נקו את 'לצפייה בהמשך' ואת הפלייליסטים שלכם, הסירו לייקים בבת אחת ופנו סרטונים שנמחקו, עם ביטול פעולה וארכיון להחזרת כל דבר\n- הפעילו את מה שסיננתם לפי הסדר, או העתיקו את הקישורים ל-NotebookLM\n- שתפו מסנן כקישור: הוא פותח את אותה רשימה עם אותם מסננים לכל מי שיש לו Needle\n- מקלדת: / לחיפוש, j ו-k לתנועה, x לבחירה\n\nתובנות\n- אורכי הסרטונים והשנים שבהם לערוץ הולך הכי טוב\n- השוו בין שני ערוצים זה לצד זה\n- רשימת מעקב שמזהה סרטונים שעוקפים את הצפיות הרגילות של הערוץ שלהם\n\nבלי התחברות, בלי חשבון, שום דבר לא נשלח לשום מקום. הכול רץ בדפדפן שלכם.\n\nהממשק של התוסף באנגלית.\n\nלא קשור ל-YouTube או ל-Google."},{"code":"cs","lang":"Czech","d":"Novinka: ztlumte kanál přímo z nabídky ⋮ na YouTube a zmizí z vyhledávání, domovské stránky, odběrů i Shorts. Volba YouTube nedoporučovat kanál vyhledávání nikdy neovlivní. Tohle ano.\n\nVyhledávání na YouTube neví, co jste už viděli, neumí filtrovat podle délky ani zhlédnutí a hledání v kanálu prochází jen názvy. Needle to opravuje přímo ve vyhledávacím řádku YouTube.\n\nZTLUMTE KANÁL, VŠUDE\n- „Mute channel everywhere“ v nabídce ⋮ u každého videa\n- Zmizí z vyhledávání, domovské stránky, odběrů i z videí vedle toho, které sledujete\n- Zmizí i jeho Shorts, na domovské stránce i ve vyhledávání\n- Ztlumení slov: každé video, které má takové slovo v názvu, zmizí\n- Okamžitě vraťte zpět, kdykoli zrušte ztlumení a přeneste seznam z jiného blokovače\n\nVE VYHLEDÁVACÍM ŘÁDKU\n- Videa z Na později, videa, která se vám líbí, a historie se zobrazují už při psaní\n- Pište filtry: <20m, >100k, unwatched, date:week, @kanál\n- in:playlists prohledá všechny playlisty, které jste si uložili\n- is:fresh skryje to, co vám už bylo ukázáno\n- Sledujte vyhledávání a na každé miniatuře uvidíte, co jste už viděli\n\nHLEDÁNÍ V KANÁLU\nKlikněte na tlačítko s jehlou na kartě Videa libovolného kanálu. Needle načte všechna videa kanálu, nejen ta už načtená.\n- Filtrujte podle délky, zhlédnutí, data a klíčového slova\n- Skryjte, co jste dokoukali, nebo najděte, co jste nechali v půlce\n- Zvolte, kolik máte minut, a uvidíte jen to, co se do nich vejde\n\nHISTORIE A NA POZDĚJI\n- Všechno, co jste začali a nikdy nedokončili\n- Filtrujte podle kanálu, délky, zhlédnutí nebo podle toho, kdy jste to viděli\n- Najděte to video, které jste určitě viděli, bez nekonečného posouvání\n\nLIBOVOLNÝ PLAYLIST A VAŠE ODBĚRY\n- Jak dlouhý je jakýkoli playlist a kolik vám z něj zbývá\n- Prohledávejte a filtrujte libovolný playlist, svůj i cizí, celý\n- Vaše odběry, jen nezhlédnutá videa kratší než 20 minut\n- Ztlumte nebo skryjte už zhlédnutá videa na domovské stránce a v Odběrech\n\nÚKLID, PŘEHRÁVÁNÍ, SDÍLENÍ\n- Ukliďte Na později a vlastní playlisty, hromadně odeberte označení Líbí se a vyhoďte smazaná videa, s možností vrátit zpět a archivem, ze kterého vše obnovíte\n- Přehrajte popořadě, co jste vyfiltrovali, nebo zkopírujte odkazy pro NotebookLM\n- Sdílejte filtr jako odkaz: každému, kdo má Needle, otevře stejný seznam se stejnými filtry\n- Klávesnice: / pro hledání, j a k pro pohyb, x pro výběr\n\nSTATISTIKY\n- Délky videí a roky, kdy se kanálu daří nejlépe\n- Porovnejte dva kanály vedle sebe\n- Seznam sledovaných, který najde videa překonávající obvyklá zhlédnutí svého kanálu\n\nBez přihlášení, bez účtu, nic se nikam neodesílá. Vše běží ve vašem prohlížeči.\n\nRozhraní rozšíření je v angličtině.\n\nNení přidruženo k YouTube ani ke Googlu."},{"code":"ro","lang":"Romanian","d":"Nou: ascunde un canal direct din meniul ⋮ al YouTube, iar acesta dispare din căutare, pagina principală, abonamente și Shorts. Opțiunea YouTube de a nu recomanda un canal nu atinge niciodată căutarea. Aceasta da.\n\nCăutarea YouTube nu știe ce ai văzut deja, nu filtrează după durată sau vizionări, iar căutarea într-un canal se uită doar la titluri. Needle rezolvă asta direct în bara de căutare YouTube.\n\nASCUNDE UN CANAL, PESTE TOT\n- „Mute channel everywhere” în meniul ⋮ al fiecărui videoclip\n- Dispare din căutare, pagina principală, abonamente și videoclipurile de lângă cel pe care îl urmărești\n- Dispar și Shorts-urile lui, pe pagina principală și în căutare\n- Ascunde cuvinte: orice videoclip cu unul dintre ele în titlu dispare\n- Anulează imediat, readu-l oricând și adu-ți lista dintr-un alt blocant\n\nÎN BARA DE CĂUTARE\n- Vizionează mai târziu, videoclipurile apreciate și istoricul apar chiar în timp ce tastezi\n- Tastează filtre: <20m, >100k, unwatched, date:week, @canal\n- in:playlists caută în toate playlisturile pe care le-ai salvat\n- is:fresh ascunde ce ți s-a arătat deja\n- Urmărește o căutare și vezi pe fiecare miniatură ce ai văzut deja\n\nCAUTĂ ÎNTR-UN CANAL\nApasă butonul cu ac din fila Videoclipuri a oricărui canal. Needle citește toate videoclipurile canalului, nu doar pe cele deja încărcate.\n- Filtrează după durată, vizionări, dată și cuvânt cheie\n- Ascunde ce ai terminat sau găsește ce ai lăsat la jumătate\n- Alege câte minute ai și vezi doar ce încape\n\nISTORICUL ȘI VIZIONEAZĂ MAI TÂRZIU\n- Tot ce ai început și n-ai terminat niciodată\n- Filtrează după canal, durată, vizionări sau când l-ai văzut\n- Găsește acel videoclip pe care știi sigur că l-ai văzut, fără derulare la nesfârșit\n\nORICE PLAYLIST ȘI ABONAMENTELE TALE\n- Cât durează orice playlist și cât ți-a mai rămas din el\n- Caută și filtrează orice playlist, al tău sau al altcuiva, în întregime\n- Abonamentele tale, doar ce n-ai văzut și sub 20 de minute\n- Estompează sau ascunde videoclipurile deja văzute pe Pagina principală și în Abonamente\n\nCURĂȚĂ, REDĂ, DISTRIBUIE\n- Curăță Vizionează mai târziu și propriile playlisturi, retrage aprecierile în bloc și scapă de videoclipurile șterse, cu anulare și o arhivă din care pui totul la loc\n- Redă ce ai filtrat, în ordine, sau copiază linkurile pentru NotebookLM\n- Distribuie un filtru ca link: deschide aceeași listă cu aceleași filtre pentru oricine are Needle\n- Tastatură: / pentru căutare, j și k pentru deplasare, x pentru selectare\n\nSTATISTICI\n- Duratele și anii în care unui canal îi merge cel mai bine\n- Compară două canale unul lângă altul\n- O listă de urmărire care găsește videoclipurile ce depășesc vizionările obișnuite ale canalului lor\n\nFără autentificare, fără cont, nimic nu e trimis nicăieri. Totul rulează în browserul tău.\n\nInterfața extensiei este în engleză.\n\nNu este afiliată cu YouTube sau Google."},{"code":"hu","lang":"Hungarian","d":"Újdonság: némíts el egy csatornát a YouTube saját ⋮ menüjéből, és eltűnik a keresésből, a kezdőlapról, a feliratkozásokból és a Shorts-ból. A YouTube lehetősége, hogy ne ajánljon egy csatornát, a k  in:playlists ψάχνει σε όλες τις λίστες αναπαραγωγής που έχετε αποθηκεύσει\n- Το is:fresh κρύβει ό,τι σας έχει ήδη εμφανιστεί\n- Ακολουθήστε μια αναζήτηση και δείτε τι έχετε δει σε κάθε μικρογραφία\n\nΑΝΑΖΗΤΗΣΗ ΣΕ ΚΑΝΑΛΙ\nΠατήστε το κουμπί με τη βελόνα στην καρτέλα Βίντεο οποιουδήποτε καναλιού. Το Needle διαβάζει όλα τα βίντεο του καναλιού, όχι μόνο όσα έχουν ήδη φορτωθεί.\n- Φιλτράρετε κατά διάρκεια, προβολές, ημερομηνία και λέξη-κλειδί\n- Κρύψτε ό,τι τελειώσατε ή βρείτε ό,τι αφήσατε στη μέση\n- Επιλέξτε πόσα λεπτά έχετε και δείτε μόνο ό,τι χωράει\n\nΙΣΤΟΡΙΚΟ ΚΑΙ ΠΑΡΑΚΟΛΟΥΘΗΣΗ ΑΡΓΟΤΕΡΑ\n- Ό,τι ξεκινήσατε και δεν τελειώσατε ποτέ\n- Φιλτράρετε κατά κανάλι, διάρκεια, προβολές ή πότε το είδατε\n- Βρείτε εκείνο το βίντεο που σίγουρα έχετε δει, χωρίς ατελείωτη κύλιση\n\nΟΠΟΙΑΔΗΠΟΤΕ ΛΙΣΤΑ ΚΑΙ ΟΙ ΕΓΓΡΑΦΕΣ ΣΑΣ\n- Πόσο διαρκεί κάθε playlist και πόσο σας απομένει\n- Αναζητήστε και φιλτράρετε οποιαδήποτε λίστα αναπαραγωγής, δική σας ή κάποιου άλλου, ολόκληρη\n- Οι εγγραφές σας, μόνο όσα δεν έχετε δει και κάτω από 20 λεπτά\n- Θαμπώστε ή κρύψτε τα βίντεο που έχετε ήδη δει στην Αρχική και στις Εγγραφές\n\nΤΑΚΤΟΠΟΙΗΣΗ, ΑΝΑΠΑΡΑΓΩΓΗ, ΚΟΙΝΟΠΟΙΗΣΗ\n- Τακτοποιήστε το «Παρακολούθηση αργότερα» και τις δικές σας λίστες, αφαιρέστε «μου αρέσει» μαζικά και καθαρίστε τα διαγραμμένα βίντεο, με αναίρεση και ένα αρχείο για να επαναφέρετε ό,τι θέλετε\n- Αναπαράγετε ό,τι φιλτράρατε με τη σειρά, ή αντιγράψτε τους συνδέσμους για το NotebookLM\n- Κοινοποιήστε ένα φίλτρο ως σύνδεσμο: ανοίγει την ίδια λίστα με τα ίδια φίλτρα για όποιον έχει το Needle\n- Πληκτρολόγιο: / για αναζήτηση, j και k για μετακίνηση, x για επιλογή\n\nΣΤΑΤΙΣΤΙΚΑ\n- Οι διάρκειες και τα έτη στα οποία ένα κανάλι αποδίδει καλύτερα\n- Συγκρίνετε δύο κανάλια δίπλα δίπλα\n- Μια λίστα παρακολούθησης που εντοπίζει βίντεο που ξεπερνούν τις συνηθισμένες προβολές του καναλιού τους\n\nΧωρίς σύνδεση, χωρίς λογαριασμό, τίποτα δεν στέλνεται πουθενά. Όλα τρέχουν στο πρόγραμμα περιήγησής σας.\n\nΗ διεπαφή της επέκτασης είναι στα αγγλικά.\n\nΔεν συνδέεται με το YouTube ή την Google."},{"code":"sv","lang":"Swedish","d":"Nytt: tysta en kanal direkt från YouTubes egen ⋮-meny, så försvinner den från sökningen, startsidan, prenumerationer och Shorts. YouTubes val att inte rekommendera en kanal påverkar aldrig sökningen. Det här gör det.\n\nYouTubes sökning vet inte vad du redan har sett, kan inte filtrera på längd eller visningar, och sökning i en kanal tittar bara på titlar. Needle fixar det, direkt i YouTubes sökfält.\n\nTYSTA EN KANAL, ÖVERALLT\n- ”Mute channel everywhere” i ⋮-menyn på varje video\n- Borta från sökningen, startsidan, prenumerationer och videorna bredvid den du tittar på\n- Dess Shorts försvinner också, på startsidan och i sökningen\n- Tysta ord: alla videor med ett av dem i titeln försvinner\n- Ångra direkt, slå av tystningen när du vill och ta med din lista från en annan blockerare\n\nI SÖKFÄLTET\n- Titta senare, videor du gillat och din historik dyker upp medan du skriver\n- Skriv filter: <20m, >100k, unwatched, date:week, @kanal\n- in:playlists söker i alla spellistor du har sparat\n- is:fresh döljer det du redan har visats\n- Följ en sökning och se på varje miniatyr vad du redan har sett\n\nSÖK I EN KANAL\nTryck på nålknappen på fliken Videor i vilken kanal som helst. Needle läser alla kanalens videor, inte bara de som redan laddats.\n- Filtrera på längd, visningar, datum och nyckelord\n- Dölj det du har sett klart eller hitta det du lämnade halvvägs\n- Välj hur många minuter du har och se bara det som får plats\n\nDIN HISTORIK OCH TITTA SENARE\n- Allt du har börjat på och aldrig sett klart\n- Filtrera på kanal, längd, visningar eller när du såg det\n- Hitta den där videon du vet att du har sett, utan att scrolla i evighet\n\nVILKEN SPELLISTA SOM HELST OCH DINA PRENUMERATIONER\n- Hur lång en spellista är och hur mycket du har kvar\n- Sök och filtrera i vilken spellista som helst, din egen eller någon annans, hela\n- Dina prenumerationer, bara det du inte sett och under 20 minuter\n- Tona ned eller dölj videor du redan har sett på startsidan och under Prenumerationer\n\nSTÄDA, SPELA, DELA\n- Städa Titta senare och dina egna spellistor, ta bort gillamarkeringar i klump och rensa bort borttagna videor, med ångra och ett arkiv för att lägga tillbaka allt\n- Spela upp det du filtrerat, i ordning, eller kopiera länkarna till NotebookLM\n- Dela ett filter som en länk: den öppnar samma lista med samma filter för alla som har Needle\n- Tangentbord: / för att söka, j och k för att flytta, x för att välja\n\nSTATISTIK\n- De videolängder och år då en kanal går bäst\n- Jämför två kanaler sida vid sida\n- En bevakningslista som hittar videor som slår kanalens vanliga visningar\n\nIngen inloggning, inget konto, inget skickas någonstans. Allt körs i din webbläsare.\n\nTilläggets gränssnitt är på engelska.\n\nInte kopplat till YouTube eller Google."},{"code":"da","lang":"Danish","d":"Nyt: gør en kanal tavs fra YouTubes egen ⋮-menu, og den forsvinder fra søgning, forsiden, abonnementer og Shorts. YouTubes valg om ikke at anbefale en kanal rører aldrig søgningen. Det gør det her.\n\nYouTubes søgning ved ikke, hvad du allerede har set, kan ikke filtrere efter længde eller visninger, og søgning i en kanal kigger kun på titler. Needle løser det, direkte i YouTubes søgefelt.\n\nGØR EN KANAL TAVS, OVERALT\n- \"Mute channel everywhere\" i ⋮-menuen på hver video\n- Væk fra søgning, forsiden, abonnementer og videoerne ved siden af den, du ser\n- Dens Shorts forsvinder også, på forsiden og i søgningen\n- Gør ord tavse: enhver video med et af dem i titlen forsvinder\n- Fortryd med det samme, slå tavsheden fra når som helst, og hent en liste fra en anden blocker\n\nI SØGEFELTET\n- Se senere, videoer du har synes godt om, og din historik dukker op, mens du skriver\n- Skriv filtre: <20m, >100k, unwatched, date:week, @kanal\n- in:playlists søger i alle playlister, du har gemt\n- is:fresh skjuler det, du allerede har fået vist\n- Følg en søgning, og se hvad du har set, på hvert miniaturebillede\n\nSØG I EN KANAL\nTryk på nåleknappen på fanen Videoer i en hvilken som helst kanal. Needle læser alle kanalens videoer, ikke kun dem, der allerede er indlæst.\n- Filtrer efter længde, visninger, dato og søgeord\n- Skjul det, du har set færdigt, eller find det, du lod ligge halvvejs\n- Vælg, hvor mange minutter du har, og se kun det, der passer\n\nDIN HISTORIK OG SE SENERE\n- Alt, hvad du har startet på og aldrig set færdigt\n- Filtrer efter kanal, længde, visninger eller hvornår du så det\n- Find den video, du ved, du har set, uden at scrolle i det uendelige\n\nENHVER PLAYLISTE OG DINE ABONNEMENTER\n- Hvor lang en playliste er, og hvor meget du mangler\n- Søg og filtrer i enhver playliste, din egen eller andres, hele vejen igennem\n- Dine abonnementer, kun det, du ikke har set, og under 20 minutter\n- Dæmp eller skjul videoer, du allerede har set, på forsiden og under Abonnementer\n\nRYD OP, AFSPIL, DEL\n- Ryd op i Se senere og dine egne playlister, fjern synes godt om i bunker og ryd slettede videoer væk, med fortryd og et arkiv til at lægge alt tilbage\n- Afspil det, du har filtreret, i rækkefølge, eller kopiér linkene til NotebookLM\n- Del et filter som et link: det åbner den samme liste med de samme filtre for alle, der har Needle\n- Tastatur: / for at søge, j og k for at flytte, x for at vælge\n\nSTATISTIK\n- De videolængder og år, hvor en kanal klarer sig bedst\n- Sammenlign to kanaler side om side\n- En overvågningsliste, der finder videoer, som slår kanalens sædvanlige visninger\n\nIntet login, ingen konto, intet sendes nogen steder hen. Alt kører i din browser.\n\nUdvidelsens brugerflade er på engelsk.\n\nIkke tilknyttet YouTube eller Google."},{"code":"no","lang":"Norwegian","d":"Nytt: demp en kanal rett fra YouTubes egen ⋮-meny, så forsvinner den fra søk, startsiden, abonnementer og Shorts. YouTubes valg om å ikke anbefale en kanal rører aldri søket. Dette gjør det.\n\nYouTube-søket vet ikke hva du allerede har sett, kan ikke filtrere på leng
