<script>
const items = [{"code":"pt_BR","lang":"Brazilian Portuguese","d":"A busca do YouTube não sabe o que você já assistiu, não filtra por duração nem por visualizações, e a busca dentro de um canal só olha os títulos. O Needle resolve isso, direto na barra de busca do YouTube.\n\nNA BARRA DE BUSCA\n- Seus vídeos de Assistir mais tarde, curtidos e do histórico aparecem enquanto você digita\n- Digite filtros: \u003c20m, >100k, unwatched, date:week, @canal\n- is:fresh esconde o que já apareceu para você antes\n- Siga uma busca, silencie um canal e veja o que você já assistiu em cada miniatura\n\nBUSCAR EM UM CANAL\nClique no botão da agulha na aba Vídeos de qualquer canal. Ele lê todos os vídeos do canal, não só os que já carregaram.\n- Filtre por duração, visualizações, data e palavra-chave\n- Esconda o que terminou, ou ache o que largou pela metade\n- Diga quantos minutos você tem e veja só o que cabe\n\nSEU HISTÓRICO E ASSISTIR MAIS TARDE\n- Tudo que você começou e nunca terminou\n- Filtre por canal, duração, visualizações ou por quando você assistiu\n- Ache aquele vídeo que você sabe que assistiu, sem ficar rolando a página\n\nANÁLISE\n- As durações e os anos em que um canal vai melhor\n- Compare dois canais lado a lado\n- Uma lista de acompanhamento que mostra vídeos superando as visualizações de sempre do canal\n\nSem login, sem conta, nada é enviado para lugar nenhum. Tudo roda no seu navegador.\n\nA interface da extensão está em inglês.\n\nNão é afiliada ao YouTube nem ao Google."},{"code":"es_419","lang":"Latin American Spanish","d":"La búsqueda de YouTube no sabe lo que ya viste, no filtra por duración ni por vistas, y la búsqueda dentro de un canal solo revisa los títulos. Needle lo soluciona, directamente en la barra de búsqueda de YouTube.\n\nEN LA BARRA DE BÚSQUEDA\n- Tus videos de Ver más tarde, los que te gustaron y tu historial aparecen mientras escribes\n- Escribe filtros: \u003c20m, >100k, unwatched, date:week, @canal\n- is:fresh oculta lo que ya se te mostró\n- Sigue una búsqueda, silencia un canal y ve lo que ya viste en cada miniatura\n\nBUSCAR EN UN CANAL\nHaz clic en el botón de la aguja en la pestaña Videos de cualquier canal. Lee todos los videos del canal, no solo los que ya cargaron.\n- Filtra por duración, vistas, fecha y palabra clave\n- Oculta lo que terminaste o encuentra lo que dejaste a medias\n- Elige los minutos que tienes y ve solo lo que cabe\n\nTU HISTORIAL Y VER MÁS TARDE\n- Todo lo que empezaste y nunca terminaste\n- Filtra por canal, duración, vistas o por cuándo lo viste\n- Encuentra ese video que sabes que viste, sin tener que desplazarte\n\nESTADÍSTICAS\n- Las duraciones y los años en los que mejor le va a un canal\n- Compara dos canales lado a lado\n- Una lista de seguimiento que detecta videos que superan las vistas habituales de su canal\n\nSin iniciar sesión, sin cuenta, sin enviar nada a ningún lado. Funciona en tu navegador.\n\nLa interfaz de la extensión está en inglés.\n\nNo está afiliada a YouTube ni a Google."},{"code":"es","lang":"Spanish","d":"La búsqueda de YouTube no sabe lo que ya has visto, no filtra por duración ni por visualizaciones, y la búsqueda dentro de un canal solo mira los títulos. Needle lo arregla, directamente en la barra de búsqueda de YouTube.\n\nEN LA BARRA DE BÚSQUEDA\n- Tus vídeos de Ver más tarde, los que te gustan y tu historial aparecen mientras escribes\n- Escribe filtros: \u003c20m, >100k, unwatched, date:week, @canal\n- is:fresh oculta lo que ya se te ha mostrado\n- Sigue una búsqueda, silencia un canal y mira lo que ya has visto en cada miniatura\n\nBUSCAR EN UN CANAL\nPulsa el botón de la aguja en la pestaña Vídeos de cualquier canal. Lee todos los vídeos del canal, no solo los que ya se han cargado.\n- Filtra por duración, visualizaciones, fecha y palabra clave\n- Oculta lo que terminaste o encuentra lo que dejaste a medias\n- Elige los minutos que tienes y ve solo lo que cabe\n\nTU HISTORIAL Y VER MÁS TARDE\n- Todo lo que empezaste y nunca terminaste\n- Filtra por canal, duración, visualizaciones o por cuándo lo viste\n- Encuentra ese vídeo que sabes que viste, sin desplazarte sin fin\n\nESTADÍSTICAS\n- Las duraciones y los años en los que mejor le va a un canal\n- Compara dos canales lado a lado\n- Una lista de seguimiento que detecta vídeos que superan las visualizaciones habituales de su canal\n\nSin iniciar sesión, sin cuenta, sin enviar nada a ningún sitio. Funciona en tu navegador.\n\nLa interfaz de la extensión está en inglés.\n\nNo está afiliada a YouTube ni a Google."},{"code":"id","lang":"Indonesian","d":"Pencarian YouTube tidak tahu apa yang sudah kamu tonton, tidak bisa memfilter menurut durasi atau jumlah tayangan, dan pencarian di dalam channel hanya mencocokkan judul. Needle memperbaikinya, langsung di bilah pencarian YouTube.\n\nDI BILAH PENCARIAN\n- Video Tonton Nanti, video yang kamu sukai, dan riwayatmu muncul saat kamu mengetik\n- Ketik filter: \u003c20m, >100k, unwatched, date:week, @channel\n- is:fresh menyembunyikan apa yang sudah pernah ditampilkan kepadamu\n- Ikuti sebuah pencarian, bisukan channel, dan lihat video yang sudah kamu tonton di setiap thumbnail\n\nCARI DI DALAM CHANNEL\nTekan tombol jarum di tab Video channel mana pun. Needle membaca semua video channel itu, bukan hanya yang sudah dimuat.\n- Filter menurut durasi, tayangan, tanggal, dan kata kunci\n- Sembunyikan yang sudah selesai, atau temukan yang kamu tinggalkan di tengah jalan\n- Pilih berapa menit waktumu dan lihat hanya video yang muat\n\nRIWAYAT DAN TONTON NANTI\n- Semua yang kamu mulai tapi tidak pernah selesai\n- Filter menurut channel, durasi, tayangan, atau kapan kamu menontonnya\n- Temukan video yang kamu yakin pernah ditonton, tanpa menggulir tanpa akhir\n\nWAWASAN\n- Durasi video dan tahun dengan performa terbaik sebuah channel\n- Bandingkan dua channel berdampingan\n- Daftar pantauan yang menemukan video yang melampaui tayangan biasa channel-nya\n\nTanpa login, tanpa akun, tidak ada yang dikirim ke mana pun. Semuanya berjalan di browsermu.\n\nAntarmuka ekstensi ini berbahasa Inggris.\n\nTidak berafiliasi dengan YouTube atau Google."},{"code":"hi","lang":"Hindi","d":"YouTube की खोज नहीं जानती कि आप क्या देख चुके हैं, लंबाई या व्यू के हिसाब से फ़िल्टर नहीं कर सकती, और चैनल के अंदर की खोज सिर्फ़ टाइटल देखती है। Needle यह सब ठीक करता है, सीधे YouTube के सर्च बार में।\n\nसर्च बार में\n- टाइप करते ही आपके बाद में देखें, पसंद किए गए वीडियो और इतिहास दिखने लगते हैं\n- फ़िल्टर टाइप करें: \u003c20m, >100k, unwatched, date:week, @चैनल\n- is:fresh वह छिपा देता है जो आपको पहले दिखाया जा चुका है\n- किसी खोज को फ़ॉलो करें, किसी चैनल को म्यूट करें, और हर थंबनेल पर देखें कि आप क्या देख चुके हैं\n\nकिसी चैनल में खोजें\nकिसी भी चैनल के वीडियो टैब पर सुई वाला बटन दबाएँ। Needle चैनल का हर वीडियो पढ़ता है, सिर्फ़ लोड हुए वीडियो नहीं।\n- लंबाई, व्यू, तारीख़ और कीवर्ड से फ़िल्टर करें\n- जो पूरा देख लिया उसे छिपाएँ, या जो बीच में छोड़ा उसे ढूँढें\n- बताइए आपके पास कितने मिनट हैं, और सिर्फ़ उतने में आने वाले वीडियो देखें\n\nआपका इतिहास और बाद में देखें\n- वह सब जो आपने शुरू किया पर कभी पूरा नहीं किया\n- चैनल, लंबाई, व्यू या देखने के समय से फ़िल्टर करें\n- वह वीडियो ढूँढें जो आपने पक्का देखा था, बिना लगातार स्क्रॉल किए\n\nइनसाइट्स\n- किसी चैनल के सबसे अच्छा प्रदर्शन करने वाले वीडियो की लंबाई और साल\n- दो चैनलों की आमने-सामने तुलना\n- एक वॉचलिस्ट जो चैनल के सामान्य व्यू से आगे निकलने वाले वीडियो पकड़ती है\n\nन साइन-इन, न अकाउंट, कुछ भी कहीं नहीं भेजा जाता। सब कुछ आपके ब्राउज़र में चलता है।\n\nएक्सटेंशन का इंटरफ़ेस अंग्रेज़ी में है।\n\nYouTube या Google से संबद्ध नहीं।"},{"code":"ja","lang":"Japanese","d":"YouTubeの検索は、あなたがすでに見た動画を知りません。長さや再生回数で絞り込めず、チャンネル内検索はタイトルしか見ません。Needleは、それをYouTubeの検索バーの中でそのまま解決します。\n\n検索バーで\n- 入力中に「後で見る」、高く評価した動画、再生履歴が表示されます\n- フィルターを入力：\u003c20m、>100k、unwatched、date:week、@チャンネル\n- is:fresh で、すでに表示された動画を隠します\n- 検索をフォロー、チャンネルをミュート、すべてのサムネイルに視聴済みを表示\n\nチャンネル内を検索\nどのチャンネルでも「動画」タブの針ボタンを押すだけ。読み込み済みの分だけでなく、チャンネルのすべての動画を読み取ります。\n- 長さ、再生回数、日付、キーワードで絞り込み\n- 見終わった動画を隠す、途中でやめた動画を見つける\n- 空いている時間を選ぶと、その時間に収まる動画だけを表示\n\n再生履歴と「後で見る」\n- 見始めて最後まで見ていない動画をすべて表示\n- チャンネル、長さ、再生回数、視聴した時期で絞り込み\n- 確かに見たはずのあの動画を、延々とスクロールせずに見つける\n\nインサイト\n- そのチャンネルで最も伸びる動画の長さと年\n- 2つのチャンネルを並べて比較\n- チャンネルの普段の再生回数を上回る動画を見つけるウォッチリスト\n\nログイン不要、アカウント不要、どこにも何も送信しません。すべてブラウザの中で動きます。\n\n拡張機能の画面は英語です。\n\nYouTube および Google とは提携していません。"},{"code":"ru","lang":"Russian","d":"Поиск YouTube не знает, что вы уже смотрели, не фильтрует по длительности и просмотрам, а поиск по каналу смотрит только на названия. Needle исправляет это прямо в строке поиска YouTube.\n\nВ СТРОКЕ ПОИСКА\n- «Смотреть позже», понравившиеся видео и история появляются, пока вы печатаете\n- Вводите фильтры: \u003c20m, >100k, unwatched, date:week, @канал\n- is:fresh скрывает то, что вам уже показывали\n- Подписывайтесь на поиск, скрывайте каналы и смотрите на каждой миниатюре, что уже просмотрено\n\nПОИСК ПО КАНАЛУ\nНажмите кнопку с иглой на вкладке «Видео» любого канала. Needle читает все видео канала, а не только уже загруженные.\n- Фильтруйте по длительности, просмотрам, дате и ключевому слову\n- Скрывайте досмотренное или находите брошенное на середине\n- Укажите, сколько у вас минут, и смотрите только то, что успеете\n\nИСТОРИЯ И «СМОТРЕТЬ ПОЗЖЕ»\n- Всё, что вы начали и так и не досмотрели\n- Фильтруйте по каналу, длительности, просмотрам или времени просмотра\n- Найдите то самое видео, которое точно смотрели, без бесконечной прокрутки\n\nАНАЛИТИКА\n- Длительность и годы, в которые у канала лучшие результаты\n- Сравнение двух каналов бок о бок\n- Список наблюдения, который находит видео, обгоняющие обычные просмотры своего канала\n\nБез входа, без аккаунта, ничего никуда не отправляется. Всё работает в вашем браузере.\n\nИнтерфейс расширения на английском языке.\n\nНе связано с YouTube или Google."},{"code":"de","lang":"German","d":"Die YouTube-Suche weiß nicht, was du schon gesehen hast, filtert nicht nach Länge oder Aufrufen, und die Suche in einem Kanal durchsucht nur Titel. Needle behebt das, direkt in der Suchleiste von YouTube.\n\nIN DER SUCHLEISTE\n- Deine Videos aus Später ansehen, deine Likes und dein Verlauf erscheinen schon beim Tippen\n- Tippe Filter ein: \u003c20m, >100k, unwatched, date:week, @kanal\n- is:fresh blendet aus, was dir schon einmal angezeigt wurde\n- Folge einer Suche, schalte einen Kanal stumm und sieh auf jedem Thumbnail, was du schon gesehen hast\n\nEINEN KANAL DURCHSUCHEN\nKlick auf den Nadel-Button im Tab Videos eines beliebigen Kanals. Needle liest jedes Video des Kanals, nicht nur die bereits geladenen.\n- Filtere nach Länge, Aufrufen, Datum und Stichwort\n- Blende aus, was du fertig geschaut hast, oder finde, was du abgebrochen hast\n- Gib an, wie viele Minuten du hast, und sieh nur, was hineinpasst\n\nDEIN VERLAUF UND SPÄTER ANSEHEN\n- Alles, was du angefangen und nie beendet hast\n- Filtere nach Kanal, Länge, Aufrufen oder danach, wann du es gesehen hast\n- Finde das Video, das du ganz sicher schon gesehen hast, ohne endlos zu scrollen\n\nSTATISTIKEN\n- Die Videolängen und Jahre, in denen ein Kanal am besten läuft\n- Vergleiche zwei Kanäle direkt nebeneinander\n- Eine Beobachtungsliste, die Videos findet, die die üblichen Aufrufe ihres Kanals übertreffen\n\nKeine Anmeldung, kein Konto, nichts wird irgendwohin gesendet. Alles läuft in deinem Browser.\n\nDie Oberfläche der Erweiterung ist auf Englisch.\n\nNicht mit YouTube oder Google verbunden."},{"code":"fr","lang":"French","d":"La recherche YouTube ne sait pas ce que vous avez déjà vu, ne filtre ni par durée ni par nombre de vues, et la recherche dans une chaîne ne regarde que les titres. Needle corrige tout ça, directement dans la barre de recherche de YouTube.\n\nDANS LA BARRE DE RECHERCHE\n- Vos vidéos À regarder plus tard, vos J'aime et votre historique s'affichent pendant que vous tapez\n- Tapez des filtres : \u003c20m, >100k, unwatched, date:week, @chaîne\n- is:fresh masque ce qu'on vous a déjà montré\n- Suivez une recherche, masquez une chaîne et voyez sur chaque miniature ce que vous avez déjà regardé\n\nCHERCHER DANS UNE CHAÎNE\nCliquez sur le bouton aiguille dans l'onglet Vidéos de n'importe quelle chaîne. Needle lit toutes les vidéos de la chaîne, pas seulement celles déjà chargées.\n- Filtrez par durée, vues, date et mot-clé\n- Masquez ce que vous avez fini ou retrouvez ce que vous avez abandonné\n- Indiquez le temps dont vous disposez et ne voyez que ce qui tient dedans\n\nVOTRE HISTORIQUE ET À REGARDER PLUS TARD\n- Tout ce que vous avez commencé sans jamais finir\n- Filtrez par chaîne, durée, vues ou date de visionnage\n- Retrouvez cette vidéo que vous savez avoir vue, sans faire défiler pendant des heures\n\nSTATISTIQUES\n- Les durées et les années où une chaîne marche le mieux\n- Comparez deux chaînes côte à côte\n- Une liste de suivi qui repère les vidéos qui dépassent les vues habituelles de leur chaîne\n\nSans connexion, sans compte, rien n'est envoyé nulle part. Tout se passe dans votre navigateur.\n\nL'interface de l'extension est en anglais.\n\nNon affiliée à YouTube ni à Google."},{"code":"tr","lang":"Turkish","d":"YouTube araması neleri zaten izlediğinizi bilmez, süreye veya görüntülenmeye göre filtreleyemez ve kanal içi arama yalnızca başlıklara bakar. Needle bunu doğrudan YouTube'un arama çubuğunda çözer.\n\nARAMA ÇUBUĞUNDA\n- Daha sonra izle, beğendiğiniz videolar ve geçmişiniz siz yazarken görünür\n- Filtre yazın: \u003c20m, >100k, unwatched, date:week, @kanal\n- is:fresh size daha önce gösterilenleri gizler\n- Bir aramayı takip edin, bir kanalı sessize alın ve her küçük resimde neyi izlediğinizi görün\n\nBİR KANALDA ARAYIN\nHerhangi bir kanalın Videolar sekmesindeki iğne düğmesine basın. Needle yalnızca yüklenenleri değil, kanalın tüm videolarını okur.\n- Süre, görüntülenme, tarih ve anahtar kelimeye göre filtreleyin\n- Bitirdiklerinizi gizleyin ya da yarıda bıraktıklarınızı bulun\n- Kaç dakikanız olduğunu seçin ve yalnızca o süreye sığanları görün\n\nGEÇMİŞİNİZ VE DAHA SONRA İZLE\n- Başlayıp hiç bitirmediğiniz her şey\n- Kanala, süreye, görüntülenmeye veya ne zaman izlediğinize göre filtreleyin\n- İzlediğinizden emin olduğunuz o videoyu, durmadan kaydırmadan bulun\n\nİSTATİSTİKLER\n- Bir kanalın en iyi performans gösterdiği video süreleri ve yıllar\n- İki kanalı yan yana karşılaştırın\n- Kanalının olağan görüntülenmesini aşan videoları yakalayan bir izleme listesi\n\nGiriş yok, hesap yok, hiçbir şey hiçbir yere gönderilmez. Her şey tarayıcınızda çalışır.\n\nUzantının arayüzü İngilizcedir.\n\nYouTube veya Google ile bağlantılı değildir."},{"code":"vi","lang":"Vietnamese","d":"Tìm kiếm của YouTube không biết bạn đã xem gì, không lọc được theo thời lượng hay lượt xem, và tìm kiếm trong kênh chỉ khớp tiêu đề. Needle khắc phục điều đó ngay trong thanh tìm kiếm của YouTube.\n\nTRONG THANH TÌM KIẾM\n- Video Xem sau, video đã thích và lịch sử xem hiện ra ngay khi bạn gõ\n- Gõ bộ lọc: \u003c20m, >100k, unwatched, date:week, @kênh\n- is:fresh ẩn những gì đã từng hiển thị cho bạn\n- Theo dõi một tìm kiếm, ẩn một kênh và thấy video đã xem trên mọi hình thu nhỏ\n\nTÌM TRONG MỘT KÊNH\nNhấn nút cây kim ở thẻ Video của bất kỳ kênh nào. Needle đọc mọi video của kênh, không chỉ những video đã tải.\n- Lọc theo thời lượng, lượt xem, ngày và từ khóa\n- Ẩn video đã xem hết, hoặc tìm lại video bạn bỏ dở\n- Chọn số phút bạn có và chỉ xem những gì vừa đủ thời gian\n\nLỊCH SỬ XEM VÀ XEM SAU\n- Mọi video bạn đã bắt đầu nhưng chưa xem hết\n- Lọc theo kênh, thời lượng, lượt xem hoặc thời điểm bạn xem\n- Tìm video bạn chắc chắn đã xem mà không cần cuộn mãi\n\nTHỐNG KÊ\n- Thời lượng video và những năm mà một kênh làm tốt nhất\n- So sánh hai kênh cạnh nhau\n- Danh sách theo dõi phát hiện video vượt lượt xem thường ngày của kênh\n\nKhông cần đăng nhập, không cần tài khoản, không gửi gì đi đâu cả. Mọi thứ chạy trong trình duyệt của bạn.\n\nGiao diện của tiện ích bằng tiếng Anh.\n\nKhông liên kết với YouTube hay Google."},{"code":"ko","lang":"Korean","d":"YouTube 검색은 내가 이미 본 영상을 모르고, 길이나 조회수로 필터링할 수 없으며, 채널 내 검색은 제목만 찾습니다. Needle은 YouTube 검색창 안에서 바로 이 문제를 해결합니다.\n\n검색창에서\n- 입력하는 동안 나중에 볼 동영상, 좋아요 표시한 동영상, 시청 기록이 나타납니다\n- 필터 입력: \u003c20m, >100k, unwatched, date:week, @채널\n- is:fresh 는 이미 보여진 영상을 숨깁니다\n- 검색 팔로우, 채널 음소거, 모든 썸네일에 시청 여부 표시\n\n채널 내 검색\n아무 채널의 동영상 탭에서 바늘 버튼을 누르세요. 불러온 영상만이 아니라 채널의 모든 영상을 읽습니다.\n- 길이, 조회수, 날짜, 키워드로 필터링\n- 다 본 영상은 숨기고, 보다 만 영상은 찾기\n- 남는 시간을 고르면 그 시간에 맞는 영상만 표시\n\n시청 기록과 나중에 볼 동영상\n- 시작했지만 끝까지 보지 않은 모든 영상\n- 채널, 길이, 조회수, 시청한 시기로 필터링\n- 분명히 봤던 그 영상을 끝없이 스크롤하지 않고 찾기\n\n인사이트\n- 채널에서 가장 성과가 좋은 영상 길이와 연도\n- 두 채널을 나란히 비교\n- 채널의 평소 조회수를 넘어서는 영상을 찾아내는 관심 목록\n\n로그인도, 계정도 필요 없고, 어디에도 아무것도 보내지 않습니다. 모두 브라우저 안에서 실행됩니다.\n\n확장 프로그램의 화면은 영어로 되어 있습니다.\n\nYouTube 또는 Google과 제휴 관계가 없습니다."},{"code":"it","lang":"Italian","d":"La ricerca di YouTube non sa cosa hai già visto, non filtra per durata o visualizzazioni, e la ricerca dentro un canale guarda solo i titoli. Needle risolve tutto questo, direttamente nella barra di ricerca di YouTube.\n\nNELLA BARRA DI RICERCA\n- I tuoi video di Guarda più tardi, i Mi piace e la cronologia compaiono mentre scrivi\n- Scrivi filtri: \u003c20m, >100k, unwatched, date:week, @canale\n- is:fresh nasconde ciò che ti è già stato mostrato\n- Segui una ricerca, silenzia un canale e vedi su ogni miniatura cosa hai già guardato\n\nCERCA IN UN CANALE\nPremi il pulsante dell'ago nella scheda Video di qualsiasi canale. Needle legge tutti i video del canale, non solo quelli già caricati.\n- Filtra per durata, visualizzazioni, data e parola chiave\n- Nascondi ciò che hai finito o ritrova ciò che hai lasciato a metà\n- Indica i minuti che hai e vedi solo ciò che ci sta\n\nLA TUA CRONOLOGIA E GUARDA PIÙ TARDI\n- Tutto ciò che hai iniziato e mai finito\n- Filtra per canale, durata, visualizzazioni o per quando l'hai guardato\n- Ritrova quel video che sai di aver visto, senza scorrere all'infinito\n\nSTATISTICHE\n- Le durate e gli anni in cui un canale rende di più\n- Confronta due canali fianco a fianco\n- Una lista di osservazione che individua i video che superano le visualizzazioni abituali del loro canale\n\nNessun accesso, nessun account, niente viene inviato da nessuna parte. Funziona nel tuo browser.\n\nL'interfaccia dell'estensione è in inglese.\n\nNon affiliata a YouTube o Google."},{"code":"pl","lang":"Polish","d":"Wyszukiwarka YouTube nie wie, co już obejrzano, nie filtruje według długości ani wyświetleń, a wyszukiwanie na kanale sprawdza tylko tytuły. Needle to naprawia, bezpośrednio w pasku wyszukiwania YouTube.\n\nW PASKU WYSZUKIWANIA\n- Filmy z Do obejrzenia, polubione i historia pojawiają się już podczas pisania\n- Wpisuj filtry: \u003c20m, >100k, unwatched, date:week, @kanał\n- is:fresh ukrywa to, co było już Ci pokazane\n- Obserwuj wyszukiwanie, wycisz kanał i zobacz na każdej miniaturze, co już obejrzano\n\nPRZESZUKIWANIE KANAŁU\nKliknij przycisk z igłą na karcie Filmy dowolnego kanału. Needle czyta wszystkie filmy kanału, a nie tylko te już załadowane.\n- Filtruj według długości, wyświetleń, daty i słowa kluczowego\n- Ukryj to, co skończone, albo znajdź to, co zostało przerwane w połowie\n- Podaj, ile masz minut, i zobacz tylko to, co się zmieści\n\nHISTORIA I DO OBEJRZENIA\n- Wszystko, co zostało zaczęte i nigdy nie skończone\n- Filtruj według kanału, długości, wyświetleń lub daty obejrzenia\n- Znajdź ten jeden obejrzany film bez przewijania bez końca\n\nSTATYSTYKI\n- Długości filmów i lata, w których kanał radzi sobie najlepiej\n- Porównaj dwa kanały obok siebie\n- Lista obserwowanych, która wyłapuje filmy bijące zwykłe wyświetlenia swojego kanału\n\nBez logowania, bez konta, nic nie jest nigdzie wysyłane. Działa w Twojej przeglądarce.\n\nInterfejs rozszerzenia jest po angielsku.\n\nNie jest powiązane z YouTube ani Google."},{"code":"th","lang":"Thai","d":"การค้นหาของ YouTube ไม่รู้ว่าคุณดูอะไรไปแล้ว กรองตามความยาวหรือยอดวิวไม่ได้ และการค้นหาในช่องก็ดูแค่ชื่อวิดีโอ Needle แก้ปัญหานี้ได้ในแถบค้นหาของ YouTube โดยตรง\n\nในแถบค้นหา\n- วิดีโอในดูภายหลัง วิดีโอที่ชอบ และประวัติการดู จะแสดงขึ้นขณะพิมพ์\n- พิมพ์ตัวกรอง: \u003c20m, >100k, unwatched, date:week, @ช่อง\n- is:fresh ซ่อนสิ่งที่เคยแสดงให้คุณเห็นแล้ว\n- ติดตามการค้นหา ซ่อนช่อง และดูว่าวิดีโอไหนดูไปแล้วบนทุกภาพขนาดย่อ\n\nค้นหาในช่อง\nกดปุ่มรูปเข็มในแท็บวิดีโอของช่องใดก็ได้ Needle อ่านวิดีโอทั้งหมดของช่อง ไม่ใช่แค่ที่โหลดมาแล้ว\n- กรองตามความยาว ยอดวิว วันที่ และคำสำคัญ\n- ซ่อนวิดีโอที่ดูจบแล้ว หรือหาวิดีโอที่ดูค้างไว้\n- เลือกจำนวนนาทีที่มี แล้วดูเฉพาะวิดีโอที่พอดีเวลา\n\nประวัติการดูและดูภายหลัง\n- ทุกวิดีโอที่เริ่มดูแต่ยังไม่จบ\n- กรองตามช่อง ความยาว ยอดวิว หรือช่วงเวลาที่ดู\n- หาวิดีโอที่มั่นใจว่าเคยดูได้ โดยไม่ต้องเลื่อนหาไม่รู้จบ\n\nข้อมูลเชิงลึก\n- ความยาววิดีโอและปีที่ช่องทำผลงานได้ดีที่สุด\n- เปรียบเทียบสองช่องแบบเคียงข้างกัน\n- รายการเฝ้าดูที่จับวิดีโอซึ่งมียอดวิวสูงกว่าปกติของช่อง\n\nไม่ต้องลงชื่อเข้าใช้ ไม่ต้องมีบัญชี ไม่ส่งข้อมูลไปที่ไหนเลย ทุกอย่างทำงานในเบราว์เซอร์ของคุณ\n\nหน้าตาของส่วนขยายเป็นภาษาอังกฤษ\n\nไม่มีส่วนเกี่ยวข้องกับ YouTube หรือ Google"},{"code":"ar","lang":"Arabic","d":"بحث YouTube لا يعرف ما شاهدته من قبل، ولا يصفّي حسب المدة أو عدد المشاهدات، والبحث داخل القناة لا يطابق إلا العناوين. Needle يصلح ذلك مباشرة داخل شريط البحث في YouTube.\n\nفي شريط البحث\n- تظهر قائمة المشاهدة لاحقًا والفيديوهات التي أعجبتك وسجل المشاهدة أثناء الكتابة\n- اكتب فلاتر المدة والمشاهدات والتاريخ والقناة مباشرة في شريط البحث\n- يخفي is:fresh ما عُرض عليك من قبل\n- تابع بحثًا، واكتم قناة، واعرف ما شاهدته على كل صورة مصغّرة\n\nالبحث داخل قناة\nاضغط زر الإبرة في تبويب الفيديوهات لأي قناة. يقرأ Needle كل فيديوهات القناة، وليس فقط ما تم تحميله.\n- صفِّ حسب المدة والمشاهدات والتاريخ والكلمة المفتاحية\n- أخفِ ما أنهيت مشاهدته، أو اعثر على ما تركته في المنتصف\n- اختر عدد الدقائق المتاحة لديك وشاهد فقط ما يناسبها\n\nسجل المشاهدة والمشاهدة لاحقًا\n- كل ما بدأته ولم تُكمله\n- صفِّ حسب القناة أو المدة أو المشاهدات أو وقت مشاهدتك\n- اعثر على ذلك الفيديو الذي تعرف أنك شاهدته، دون تمرير لا ينتهي\n\nإحصاءات\n- مدد الفيديو والسنوات التي تحقق فيها القناة أفضل أداء\n- قارن بين قناتين جنبًا إلى جنب\n- قائمة متابعة تلتقط الفيديوهات التي تتجاوز المشاهدات المعتادة لقناتها\n\nبلا تسجيل دخول، بلا حساب، ولا يُرسل أي شيء إلى أي مكان. كل شيء يعمل داخل متصفحك.\n\nواجهة الإضافة باللغة الإنجليزية.\n\nغير تابعة لـ YouTube أو Google."},{"code":"zh_TW","lang":"Chinese (Taiwan)","d":"YouTube 的搜尋不知道你已經看過什麼，無法依長度或觀看次數篩選，頻道內搜尋也只比對標題。Needle 直接在 YouTube 的搜尋列裡解決這些問題。\n\n在搜尋列中\n- 輸入時就會顯示你的「稍後觀看」、喜歡的影片和觀看記錄\n- 輸入篩選條件：\u003c20m、>100k、unwatched、date:week、@頻道\n- is:fresh 會隱藏之前已經出現過的結果\n- 追蹤一個搜尋、隱藏一個頻道，並在每個縮圖上看到是否看過\n\n搜尋一個頻道\n在任何頻道的「影片」分頁按下針形按鈕。它會讀取頻道的所有影片，而不只是已載入的部分。\n- 依長度、觀看次數、日期和關鍵字篩選\n- 隱藏已看完的影片，或找回看到一半的影片\n- 選擇你有幾分鐘，只顯示看得完的影片\n\n你的觀看記錄和稍後觀看\n- 所有開始看了卻沒看完的影片\n- 依頻道、長度、觀看次數或觀看時間篩選\n- 找到那部你確定看過的影片，不用一直往下捲\n\n數據洞察\n- 一個頻道表現最好的影片長度和年份\n- 並排比較兩個頻道\n- 一份追蹤清單，找出超越頻道平常觀看次數的影片\n\n不需登入，不需帳號，不會傳送任何資料到任何地方。全部在你的瀏覽器中執行。\n\n擴充功能介面為英文。\n\n與 YouTube 或 Google 無關。"},{"code":"fil","lang":"Filipino","d":"Hindi alam ng search ng YouTube kung ano na ang napanood mo, hindi ito makapag-filter ayon sa haba o views, at ang paghahanap sa loob ng channel ay tumitingin lang sa mga pamagat. Inaayos iyan ng Needle, mismo sa search bar ng YouTube.\n\nSA SEARCH BAR\n- Lumalabas ang Panoorin Mamaya, mga ni-like mo at ang iyong history habang nagta-type ka\n- Mag-type ng filter: \u003c20m, >100k, unwatched, date:week, @channel\n- Itinatago ng is:fresh ang mga naipakita na sa iyo\n- Sundan ang isang search, i-mute ang isang channel at makita sa bawat thumbnail kung ano na ang napanood mo\n\nMAGHANAP SA ISANG CHANNEL\nPindutin ang needle button sa Videos tab ng kahit anong channel. Binabasa ng Needle ang bawat video ng channel, hindi lang ang mga na-load na.\n- Mag-filter ayon sa haba, views, petsa at keyword\n- Itago ang mga natapos mo na, o hanapin ang mga hindi mo tinapos\n- Piliin kung ilang minuto ang mayroon ka at makita lang ang kasya\n\nANG IYONG HISTORY AT PANOORIN MAMAYA\n- Lahat ng sinimulan mo pero hindi tinapos\n- Mag-filter ayon sa channel, haba, views o kung kailan mo ito pinanood\n- Hanapin ang video na sigurado kang napanood mo na, nang hindi nag-i-scroll nang walang katapusan\n\nINSIGHTS\n- Ang haba ng video at mga taon kung kailan pinakamagaling ang isang channel\n- Ikumpara ang dalawang channel nang magkatabi\n- Isang watchlist na nakakakita ng mga video na lumalampas sa karaniwang views ng kanilang channel\n\nWalang sign-in, walang account, walang ipinapadala kahit saan. Tumatakbo ito sa iyong browser.\n\nNasa Ingles ang interface ng extension.\n\nHindi kaakibat ng YouTube o Google."},{"code":"uk","lang":"Ukrainian","d":"Пошук YouTube не знає, що ви вже дивилися, не фільтрує за тривалістю чи переглядами, а пошук на каналі перевіряє лише назви. Needle виправляє це просто в рядку пошуку YouTube.\n\nУ РЯДКУ ПОШУКУ\n- «Переглянути пізніше», вподобані відео та історія з'являються, поки ви друкуєте\n- Вводьте фільтри: \u003c20m, >100k, unwatched, date:week, @канал\n- is:fresh приховує те, що вам уже показували\n- Стежте за пошуком, приховуйте канали й бачте на кожній мініатюрі, що вже переглянуто\n\nПОШУК НА КАНАЛІ\nНатисніть кнопку з голкою на вкладці «Відео» будь-якого каналу. Needle читає всі відео каналу, а не лише вже завантажені.\n- Фільтруйте за тривалістю, переглядами, датою та ключовим словом\n- Приховуйте досмотрене або знаходьте покинуте на півдорозі\n- Вкажіть, скільки у вас хвилин, і дивіться лише те, що встигнете\n\nІСТОРІЯ І «ПЕРЕГЛЯНУТИ ПІЗНІШЕ»\n- Усе, що ви почали й так і не додивилися\n- Фільтруйте за каналом, тривалістю, переглядами або часом перегляду\n- Знайдіть те саме відео, яке точно дивилися, без нескінченного прокручування\n\nАНАЛІТИКА\n- Тривалість і роки, у які канал має найкращі результати\n- Порівняння двох каналів пліч-о-пліч\n- Список спостереження, що знаходить відео, які випереджають звичні перегляди свого каналу\n\nБез входу, без облікового запису, нічого нікуди не надсилається. Усе працює у вашому браузері.\n\nІнтерфейс розширення англійською мовою.\n\nНе пов'язано з YouTube або Google."},{"code":"nl","lang":"Dutch","d":"De zoekfunctie van YouTube weet niet wat je al hebt gezien, filtert niet op lengte of weergaven, en zoeken in een kanaal kijkt alleen naar titels. Needle lost dat op, direct in de zoekbalk van YouTube.\n\nIN DE ZOEKBALK\n- Je video's uit Later bekijken, je likes en je geschiedenis verschijnen terwijl je typt\n- Typ filters: \u003c20m, >100k, unwatched, date:week, @kanaal\n- is:fresh verbergt wat je al eerder te zien kreeg\n- Volg een zoekopdracht, demp een kanaal en zie op elke thumbnail wat je al hebt bekeken\n\nEEN KANAAL DOORZOEKEN\nKlik op de naaldknop op het tabblad Video's van elk kanaal. Needle leest alle video's van het kanaal, niet alleen wat al geladen is.\n- Filter op lengte, weergaven, datum en trefwoord\n- Verberg wat je hebt uitgekeken of vind terug wat je halverwege liet liggen\n- Geef aan hoeveel minuten je hebt en zie alleen wat erin past\n\nJE GESCHIEDENIS EN LATER BEKIJKEN\n- Alles wat je bent begonnen en nooit hebt afgemaakt\n- Filter op kanaal, lengte, weergaven of wanneer je het keek\n- Vind die video waarvan je zeker weet dat je hem hebt gezien, zonder eindeloos te scrollen\n\nINZICHTEN\n- De videolengtes en jaren waarin een kanaal het best presteert\n- Vergelijk twee kanalen naast elkaar\n- Een volglijst die video's vindt die beter scoren dan de gebruikelijke weergaven van hun kanaal\n\nNiet inloggen, geen account, er wordt niets verstuurd. Alles draait in je browser.\n\nDe interface van de extensie is in het Engels.\n\nNiet verbonden aan YouTube of Google."},{"code":"ms","lang":"Malay","d":"Carian YouTube tidak tahu apa yang anda sudah tonton, tidak boleh menapis mengikut tempoh atau tontonan, dan carian dalam saluran hanya memadankan tajuk. Needle membetulkannya, terus di dalam bar carian YouTube.\n\nDALAM BAR CARIAN\n- Tonton Kemudian, video yang anda suka dan sejarah anda muncul semasa anda menaip\n- Taip penapis: \u003c20m, >100k, unwatched, date:week, @saluran\n- is:fresh menyembunyikan apa yang sudah ditunjukkan kepada anda\n- Ikuti carian, senyapkan saluran dan lihat apa yang anda sudah tonton pada setiap lakaran kecil\n\nCARI DALAM SALURAN\nTekan butang jarum pada tab Video mana-mana saluran. Needle membaca setiap video saluran itu, bukan hanya yang sudah dimuatkan.\n- Tapis mengikut tempoh, tontonan, tarikh dan kata kunci\n- Sembunyikan yang sudah habis ditonton, atau cari yang anda tinggalkan separuh jalan\n- Pilih berapa minit yang anda ada dan lihat hanya yang muat\n\nSEJARAH DAN TONTON KEMUDIAN\n- Semua yang anda mula tetapi tidak pernah habiskan\n- Tapis mengikut saluran, tempoh, tontonan atau bila anda menontonnya\n- Cari video yang anda pasti pernah tonton, tanpa menatal tanpa henti\n\nSTATISTIK\n- Tempoh video dan tahun yang paling berjaya bagi sesebuah saluran\n- Bandingkan dua saluran bersebelahan\n- Senarai pantau yang mengesan video yang mengatasi tontonan biasa salurannya\n\nTiada log masuk, tiada akaun, tiada apa-apa dihantar ke mana-mana. Semuanya berjalan dalam pelayar anda.\n\nAntara muka sambungan ini dalam bahasa Inggeris.\n\nTidak bergabung dengan YouTube atau Google."},{"code":"bn","lang":"Bangla","d":"YouTube-এর সার্চ জানে না আপনি আগে কী দেখেছেন, দৈর্ঘ্য বা ভিউ দিয়ে ফিল্টার করতে পারে না, আর চ্যানেলের ভেতরের সার্চ শুধু শিরোনাম মেলায়। Needle এই সমস্যার সমাধান করে, সরাসরি YouTube-এর সার্চ বারেই।\n\nসার্চ বারে\n- টাইপ করার সময়ই আপনার পরে দেখুন, পছন্দ করা ভিডিও আর ইতিহাস দেখা যায়\n- ফিল্টার টাইপ করুন: \u003c20m, >100k, unwatched, date:week, @চ্যানেল\n- is:fresh আগে দেখানো জিনিস লুকিয়ে রাখে\n- একটি সার্চ ফলো করুন, একটি চ্যানেল মিউট করুন, আর প্রতিটি থাম্বনেইলে দেখুন কী দেখা হয়ে গেছে\n\nচ্যানেলের ভেতরে খুঁজুন\nযেকোনো চ্যানেলের ভিডিও ট্যাবে সুইয়ের বোতাম চাপুন। Needle চ্যানেলের প্রতিটি ভিডিও পড়ে, শুধু লোড হওয়াগুলো নয়।\n- দৈর্ঘ্য, ভিউ, তারিখ আর কীওয়ার্ড দিয়ে ফিল্টার করুন\n- যা পুরো দেখেছেন তা লুকান, বা যা মাঝপথে ছেড়েছেন তা খুঁজে নিন\n- আপনার হাতে কত মিনিট আছে বেছে নিন, শুধু সেই সময়ে যা আঁটে তাই দেখুন\n\nআপনার ইতিহাস আর পরে দেখুন\n- যা শুরু করেছিলেন কিন্তু কখনো শেষ করেননি\n- চ্যানেল, দৈর্ঘ্য ת של הערוץ שלהם\n\nבלי התחברות, בלי חשבון, שום דבר לא נשלח לשום מקום. הכול רץ בדפדפן שלכם.\n\nהממשק של התוסף באנגלית.\n\nלא קשור ל-YouTube או ל-Google."},{"code":"cs","lang":"Czech","d":"Vyhledávání na YouTube neví, co jste už viděli, neumí filtrovat podle délky ani zhlédnutí a hledání v kanálu prochází jen názvy. Needle to opravuje přímo ve vyhledávacím řádku YouTube.\n\nVE VYHLEDÁVACÍM ŘÁDKU\n- Videa z Na později, videa, která se vám líbí, a historie se zobrazují už při psaní\n- Pište filtry: \u003c20m, >100k, unwatched, date:week, @kanál\n- is:fresh skryje to, co vám už bylo ukázáno\n- Sledujte vyhledávání, ztlumte kanál a na každé miniatuře uvidíte, co už jste viděli\n\nHLEDÁNÍ V KANÁLU\nKlikněte na tlačítko s jehlou na kartě Videa libovolného kanálu. Needle načte všechna videa kanálu, nejen ta už načtená.\n- Filtrujte podle délky, zhlédnutí, data a klíčového slova\n- Skryjte, co jste dokoukali, nebo najděte, co jste nechali v půlce\n- Zvolte, kolik máte minut, a uvidíte jen to, co se do nich vejde\n\nHISTORIE A NA POZDĚJI\n- Všechno, co jste začali a nikdy nedokončili\n- Filtrujte podle kanálu, délky, zhlédnutí nebo podle toho, kdy jste to viděli\n- Najděte to video, které jste určitě viděli, bez nekonečného posouvání\n\nSTATISTIKY\n- Délky videí a roky, kdy se kanálu daří nejlépe\n- Porovnejte dva kanály vedle sebe\n- Seznam sledovaných, který najde videa překonávající obvyklá zhlédnutí svého kanálu\n\nBez přihlášení, bez účtu, nic se nikam neodesílá. Vše běží ve vašem prohlížeči.\n\nRozhraní rozšíření je v angličtině.\n\nNení přidruženo k YouTube ani ke Googlu."},{"code":"ro","lang":"Romanian","d":"Căutarea YouTube nu știe ce ai văzut deja, nu filtrează după durată sau vizionări, iar căutarea într-un canal se uită doar la titluri. Needle rezolvă asta direct în bara de căutare YouTube.\n\nÎN BARA DE CĂUTARE\n- Vizionează mai târziu, videoclipurile apreciate și istoricul apar chiar în timp ce tastezi\n- Tastează filtre: \u003c20m, >100k, unwatched, date:week, @canal\n- is:fresh ascunde ce ți s-a arătat deja\n- Urmărește o căutare, dezactivează sunetul unui canal și vezi pe fiecare miniatură ce ai văzut deja\n\nCAUTĂ ÎNTR-UN CANAL\nApasă butonul cu ac din fila Videoclipuri a oricărui canal. Needle citește toate videoclipurile canalului, nu doar pe cele deja încărcate.\n- Filtrează după durată, vizionări, dată și cuvânt cheie\n- Ascunde ce ai terminat sau găsește ce ai lăsat la jumătate\n- Alege câte minute ai și vezi doar ce încape\n\nISTORICUL ȘI VIZIONEAZĂ MAI TÂRZIU\n- Tot ce ai început și n-ai terminat niciodată\n- Filtrează după canal, durată, vizionări sau când l-ai văzut\n- Găsește acel videoclip pe care știi sigur că l-ai văzut, fără derulare la nesfârșit\n\nSTATISTICI\n- Duratele și anii în care unui canal îi merge cel mai bine\n- Compară două canale unul lângă altul\n- O listă de urmărire care găsește videoclipurile ce depășesc vizionările obișnuite ale canalului lor\n\nFără autentificare, fără cont, nimic nu e trimis nicăieri. Totul rulează în browserul tău.\n\nInterfața extensiei este în engleză.\n\nNu este afiliată cu YouTube sau Google."},{"code":"hu","lang":"Hungarian","d":"A YouTube keresője nem tudja, mit néztél már meg, nem tud szűrni hosszra vagy megtekintésekre, a csatornán belüli keresés pedig csak a címeket nézi. A Needle ezt közvetlenül a YouTube keresősávjában javítja.\n\nA KERESŐSÁVBAN\n- A Megnézendő, a kedvelt videók és az előzmények már gépelés közben megjelennek\n- Írj szűrőket: \u003c20m, >100k, unwatched, date:week, @csatorna\n- Az is:fresh elrejti, amit már mutattak neked\n- Kövess egy keresést, némíts el egy csatornát, és minden bélyegképen lásd, mit néztél már meg\n\nKERESÉS EGY CSATORNÁBAN\nNyomd meg a tű gombot bármely csatorna Videók lapján. A Needle a csatorna összes videóját beolvassa, nem csak a már betöltötteket.\n- Szűrj hossz, megtekintések, dátum és kulcsszó szerint\n- Rejtsd el, amit végignéztél, vagy találd meg, amit félbehagytál\n- Add meg, hány perced van, és csak azt lásd, ami belefér\n\nELŐZMÉNYEK ÉS MEGNÉZENDŐ\n- Minden, amit elkezdtél, de sosem fejeztél be\n- Szűrj csatorna, hossz, megtekintések vagy a megnézés ideje szerint\n- Találd meg azt a videót, amit biztosan láttál, végtelen görgetés nélkül\n\nSTATISZTIKA\n- A videóhosszak és évek, amikor egy csatorna a legjobban teljesít\n- Hasonlíts össze két csatornát egymás mellett\n- Egy figyelőlista, amely megtalálja a csatornájuk szokásos megtekintéseit felülmúló videókat\n\nNincs bejelentkezés, nincs fiók, semmit nem küld sehova. Minden a böngésződben fut.\n\nA bővítmény felülete angol nyelvű.\n\nNem áll kapcsolatban a YouTube-bal vagy a Google-lel."},{"code":"el","lang":"Greek","d":"Η αναζήτηση του YouTube δεν ξέρει τι έχετε ήδη δει, δεν φιλτράρει κατά διάρκεια ή προβολές, και η αναζήτηση μέσα σε κανάλι κοιτάζει μόνο τους τίτλους. Το Needle το διορθώνει αυτό, απευθείας στη γραμμή αναζήτησης του YouTube.\n\nΣΤΗ ΓΡΑΜΜΗ ΑΝΑΖΗΤΗΣΗΣ\n- Το «Παρακολούθηση αργότερα», τα βίντεο που σας αρέσουν και το ιστορικό σας εμφανίζονται ενώ πληκτρολογείτε\n- Πληκτρολογήστε φίλτρα: \u003c20m, >100k, unwatched, date:week, @κανάλι\n- Το is:fresh κρύβει ό,τι σας έχει ήδη εμφανιστεί\n- Ακολουθήστε μια αναζήτηση, κάντε σίγαση σε ένα κανάλι και δείτε σε κάθε μικρογραφία τι έχετε ήδη δει\n\nΑΝΑΖΗΤΗΣΗ ΣΕ ΚΑΝΑΛΙ\nΠατήστε το κουμπί με τη βελόνα στην καρτέλα Βίντεο οποιουδήποτε καναλιού. Το Needle διαβάζει όλα τα βίντεο του καναλιού, όχι μόνο όσα έχουν ήδη φορτωθεί.\n- Φιλτράρετε κατά διάρκεια, προβολές, ημερομηνία και λέξη-κλειδί\n- Κρύψτε ό,τι τελειώσατε ή βρείτε ό,τι αφήσατε στη μέση\n- Επιλέξτε πόσα λεπτά έχετε και δείτε μόνο ό,τι χωράει\n\nΙΣΤΟΡΙΚΟ ΚΑΙ ΠΑΡΑΚΟΛΟΥΘΗΣΗ ΑΡΓΟΤΕΡΑ\n- Ό,τι ξεκινήσατε και δεν τελειώσατε ποτέ\n- Φιλτράρετε κατά κανάλι, διάρκεια, προβολές ή πότε το είδατε\n- Βρείτε εκείνο το βίντεο που σίγουρα έχετε δει, χωρίς ατελείωτη κύλιση\n\nΣΤΑΤΙΣΤΙΚΑ\n- Οι διάρκειες και τα έτη στα οποία ένα κανάλι αποδίδει καλύτερα\n- Συγκρίνετε δύο κανάλια δίπλα δίπλα\n- Μια λίστα παρακολούθησης που εντοπίζει βίντεο που ξεπερνούν τις συνηθισμένες προβολές του καναλιού τους\n\nΧωρίς σύνδεση, χωρίς λογαριασμό, τίποτα δεν στέλνεται πουθενά. Όλα τρέχουν στο πρόγραμμα περιήγησής σας.\n\nΗ διεπαφή της επέκτασης είναι στα αγγλικά.\n\nΔεν συνδέεται με το YouTube ή την Google."},{"code":"sv","lang":"Swedish","d":"YouTubes sökning vet inte vad du redan har sett, kan inte filtrera på längd eller visningar, och sökning i en kanal tittar bara på titlar. Needle fixar det, direkt i YouTubes sökfält.\n\nI SÖKFÄLTET\n- Titta senare, videor du gillat och din historik dyker upp medan du skriver\n- Skriv filter: \u003c20m, >100k, unwatched, date:week, @kanal\n- is:fresh döljer det du redan har visats\n- Följ en sökning, tysta en kanal och se på varje miniatyr vad du redan har sett\n\nSÖK I EN KANAL\nTryck på nålknappen på fliken Videor i vilken kanal som helst. Needle läser alla kanalens videor, inte bara de som redan laddats.\n- Filtrera på längd, visningar, datum och nyckelord\n- Dölj det du har sett klart eller hitta det du lämnade halvvägs\n- Välj hur många minuter du har och se bara det som får plats\n\nDIN HISTORIK OCH TITTA SENARE\n- Allt du har börjat på och aldrig sett klart\n- Filtrera på kanal, längd, visningar eller när du såg det\n- Hitta den där videon du vet att du har sett, utan att scrolla i evighet\n\nSTATISTIK\n- De videolängder och år då en kanal går bäst\n- Jämför två kanaler sida vid sida\n- En bevakningslista som hittar videor som slår kanalens vanliga visningar\n\nIngen inloggning, inget konto, inget skickas någonstans. Allt körs i din webbläsare.\n\nTilläggets gränssnitt är på engelska.\n\nInte kopplat till YouTube eller Google."},{"code":"da","lang":"Danish","d":"YouTubes søgning ved ikke, hvad du allerede har set, kan ikke filtrere efter længde eller visninger, og søgning i en kanal kigger kun på titler. Needle løser det, direkte i YouTubes søgefelt.\n\nI SØGEFELTET\n- Se senere, videoer du har synes godt om, og din historik dukker op, mens du skriver\n- Skriv filtre: \u003c20m, >100k, unwatched, date:week, @kanal\n- is:fresh skjuler det, du allerede har fået vist\n- Følg en søgning, slå en kanal fra og se på hver miniature, hvad du allerede har set\n\nSØG I EN KANAL\nTryk på nåleknappen på fanen Videoer i en hvilken som helst kanal. Needle læser alle kanalens videoer, ikke kun dem, der allerede er indlæst.\n- Filtrer efter længde, visninger, dato og søgeord\n- Skjul det, du har set færdigt, eller find det, du lod ligge halvvejs\n- Vælg, hvor mange minutter du har, og se kun det, der passer\n\nDIN HISTORIK OG SE SENERE\n- Alt, hvad du har startet på og aldrig set færdigt\n- Filtrer efter kanal, længde, visninger eller hvornår du så det\n- Find den video, du ved, du har set, uden at scrolle i det uendelige\n\nSTATISTIK\n- De videolængder og år, hvor en kanal klarer sig bedst\n- Sammenlign to kanaler side om side\n- En overvågningsliste, der finder videoer, som slår kanalens sædvanlige visninger\n\nIntet login, ingen konto, intet sendes nogen steder hen. Alt kører i din browser.\n\nUdvidelsens brugerflade er på engelsk.\n\nIkke tilknyttet YouTube eller Google."},{"code":"no","lang":"Norwegian","d":"YouTube-søket vet ikke hva du allerede har sett, kan ikke filtrere på lengde eller visninger, og søk i en kanal ser bare på titler. Needle fikser det, rett i søkefeltet til YouTube.\n\nI SØKEFELTET\n- Se senere, videoer du har likt og historikken din dukker opp mens du skriver\n- Skriv filtre: \u003c20m, >100k, unwatched, date:week, @kanal\n- is:fresh skjuler det du allerede har fått vist\n- Følg et søk, demp en kanal og se på hvert miniatyrbilde hva du allerede har sett\n\nSØK I EN KANAL\nTrykk på nåleknappen i fanen Videoer i en hvilken som helst kanal. Needle leser alle kanalens videoer, ikke bare de som allerede er lastet inn.\n- Filtrer på lengde, visninger, dato og søkeord\n- Skjul det du har sett ferdig, eller finn det du ga opp halvveis\n- Velg hvor mange minutter du har, og se bare det som passer\n\nHISTORIKKEN DIN OG SE SEN een tai Googleen."},{"code":"pt_PT","lang":"European Portuguese","d":"A pesquisa do YouTube não sabe o que já viu, não filtra por duração nem por visualizações, e a pesquisa num canal só procura nos títulos. O Needle resolve isso, diretamente na barra de pesquisa do YouTube.\n\nNA BARRA DE PESQUISA\n- Os seus vídeos de Ver mais tarde, gostos e histórico aparecem enquanto escreve\n- Escreva filtros: \u003c20m, >100k, unwatched, date:week, @canal\n- is:fresh esconde o que já lhe foi mostrado\n- Siga uma pesquisa, silencie um canal e veja o que já viu em cada miniatura\n\nPESQUISAR NUM CANAL\nCarregue no botão da agulha no separador Vídeos de qualquer canal. Lê todos os vídeos do canal, não só os que já carregaram.\n- Filtre por duração, visualizações, data e palavra-chave\n- Esconda o que já acabou de ver ou encontre o que deixou a meio\n- Indique os minutos que tem e veja só o que cabe\n\nO SEU HISTÓRICO E VER MAIS TARDE\n- Tudo o que começou e nunca acabou\n- Filtre por canal, duração, visualizações ou pela altura em que viu\n- Encontre aquele vídeo que sabe que viu, sem andar a percorrer a página\n\nANÁLISE\n- As durações e os anos em que um canal tem melhores resultados\n- Compare dois canais lado a lado\n- Uma lista de acompanhamento que deteta vídeos acima das visualizações habituais do canal\n\nSem início de sessão, sem conta, nada é enviado para lado nenhum. Funciona no seu navegador.\n\nA interface da extensão está em inglês.\n\nNão é afiliada ao YouTube nem à Google."},{"code":"ca","lang":"Catalan","d":"La cerca de YouTube no sap què ja has vist, no filtra per durada ni per visualitzacions, i la cerca dins d'un canal només mira els títols. Needle ho arregla, directament a la barra de cerca de YouTube.\n\nA LA BARRA DE CERCA\n- Els teus vídeos de Mira més tard, els que t'agraden i l'historial apareixen mentre escrius\n- Escriu filtres: \u003c20m, >100k, unwatched, date:week, @canal\n- is:fresh amaga el que ja se t'ha mostrat\n- Segueix una cerca, silencia un dĺžky, zhliadnutí alebo podľa toho, kedy ste to videli\n- Nájdite to video, ktoré ste určite videli, bez nekonečného posúvania\n\nŠTATISTIKY\n- Dĺžky videí a roky, keď sa kanálu darí najlepšie\n- Porovnajte dva kanály vedľa seba\n- Zoznam sledovaných, ktorý nájde videá prekonávajúce bežné zhliadnutia svojho kanála\n\nBez prihlásenia, bez účtu, nič sa nikam neodosiela. Všetko beží vo vašom prehliadači.\n\nRozhranie rozšírenia je v angličtine.\n\nNie je pridružené k YouTube ani ku Googlu."},{"code":"hr","lang":"Croatian","d":"YouTube pretraživanje ne zna što ste već gledali, ne filtrira po trajanju ni pregledima, a pretraživanje unutar kanala gleda samo naslove. Needle to rješava izravno u traci za pretraživanje YouTubea.\n\nU TRACI ZA PRETRAŽIVANJE\n- Gledaj kasnije, videozapisi koji vam se sviđaju i povijest pojavljuju se dok tipkate\n- Upišite filtre: \u003c20m, >100k, unwatched, date:week, @kanal\n- is:fresh skriva ono što vam je već prikazano\n- Pratite pretraživanje, utišajte kanal i vidite na svakoj minijaturi što ste već gledali\n\nPRETRAŽIVANJE KANALA\nKliknite gumb s iglom na kartici Videozapisi bilo kojeg kanala. Needle čita sve videozapise kanala, ne samo već učitane.\n- Filtrirajte po trajanju, pregledima, datumu i ključnoj riječi\n- Sakrijte odgledano do kraja ili pronađite napušteno na pola\n- Odaberite koliko minuta imate i vidite samo ono što stane\n\nPOVIJEST I GLEDAJ KASNIJE\n- Sve što ste započeli i nikad niste završili\n- Filtrirajte po kanalu, trajanju, pregledima ili vremenu gledanja\n- Pronađite onaj videozapis koji ste sigurno gledali, bez beskonačnog pomicanja\n\nSTATISTIKA\n- Trajanja i godine u kojima kanal prolazi najbolje\n- Usporedite dva kanala jedan uz drugi\n- Popis praćenja koji pronalazi videozapise što nadmašuju uobičajene preglede svog kanala\n\nBez prijave, bez računa, ništa se nikamo ne šalje. Sve radi u vašem pregledniku.\n\nSučelje proširenja je na engleskom.\n\nNije povezano s YouTubeom ni Googleom."},{"code":"sl","lang":"Slovenian","d":"Iskanje v YouTubu ne ve, kaj ste si že ogledali, ne filtrira po dolžini ali ogledih, iskanje znotraj kanala pa pregleda le naslove. Needle to popravi neposredno v iskalni vrstici YouTuba.\n\nV ISKALNI VRSTICI\n- Ogled pozneje, videoposnetki, ki so vam všeč, in zgodovina se prikažejo že med tipkanjem\n- Vpišite filtre: \u003c20m, >100k, unwatched, date:week, @kanal\n- is:fresh skrije, kar vam je bilo že prikazano\n- Spremljajte iskanje, utišajte kanal in na vsaki sličici vidite, kaj ste si že ogledali\n\nISKANJE PO KANALU\nKliknite gumb z iglo na zavihku Videoposnetki katerega koli kanala. Needle prebere vse videoposnetke kanala, ne le že naloženih.\n- Filtrirajte po dolžini, ogledih, datumu in ključni besedi\n- Skrijte, kar ste si ogledali do konca, ali poiščite, kar ste pustili na pol\n- Izberite, koliko minut imate, in vidite le tisto, kar gre vanje\n\nZGODOVINA IN OGLED POZNEJE\n- Vse, kar ste začeli in nikoli dokončali\n- Filtrirajte po kanalu, dolžini, ogledih ali času ogleda\n- Poiščite tisti videoposnetek, ki ste si ga zagotovo ogledali, brez neskončnega drsenja\n\nSTATISTIKA\n- Dolžine videoposnetkov in leta, ko je kanalu šlo najbolje\n- Primerjajte dva kanala drug ob drugem\n- Seznam spremljanja, ki najde videoposnetke, ki presegajo običajne oglede svojega kanala\n\nBrez prijave, brez računa, nič se nikamor ne pošilja. Vse teče v vašem brskalniku.\n\nVmesnik razširitve je v angleščini.\n\nNi povezano z YouTubom ali Googlom."},{"code":"bg","lang":"Bulgarian","d":"Търсенето в YouTube не знае какво вече сте гледали, не филтрира по продължителност или гледания, а търсенето в канал проверява само заглавията. Needle поправя това директно в лентата за търсене на YouTube.\n\nВ ЛЕНТАТА ЗА ТЪРСЕНЕ\n- „Гледайте по-късно“, харесаните видеоклипове и историята се появяват, докато пишете\n- Въвеждайте филтри: \u003c20m, >100k, unwatched, date:week, @канал\n- is:fresh скрива това, което вече ви е било показано\n- Следете търсене, заглушете канал и вижте на вся каналу, трајању, прегледима или времену гледања\n- Пронађите онај снимак који сте сигурно гледали, без бесконачног скроловања\n\nСТАТИСТИКА\n- Трајања и године у којима канал пролази најбоље\n- Упоредите два канала један поред другог\n- Листа праћења која налази снимке што надмашују уобичајене прегледе свог канала\n\nБез пријаве, без налога, ништа се нигде не шаље. Све ради у вашем прегледачу.\n\nИнтерфејс проширења је на енглеском.\n\nНије повезано са YouTube-ом ни Google-ом."},{"code":"lt","lang":"Lithuanian","d":"YouTube paieška nežino, ką jau žiūrėjote, negali filtruoti pagal trukmę ar peržiūras, o paieška kanale tikrina tik pavadinimus. Needle tai ištaiso tiesiai YouTube paieškos juostoje.\n\nPAIEŠKOS JUOSTOJE\n- Žiūrėti vėliau, patikę vaizdo įrašai ir istorija pasirodo jau rašant\n- Rašykite filtrus: \u003c20m, >100k, unwatched, date:week, @kanalas\n- is:fresh paslepia tai, kas jums jau buvo parodyta\n- Sekite paiešką, nutildykite kanalą ir kiekvienoje miniatiūroje matykite, ką jau žiūrėjote\n\nPAIEŠKA KANALE\nPaspauskite adatos mygtuką bet kurio kanalo skirtuke Vaizdo įrašai. Needle perskaito visus kanalo vaizdo įrašus, ne tik jau įkeltus.\n- Filtruokite pagal trukmę, peržiūras, datą ir raktažodį\n- Paslėpkite peržiūrėtus iki galo arba raskite paliktus pusiaukelėje\n- Pasirinkite, kiek minučių turite, ir matykite tik tai, kas telpa\n\nISTORIJA IR ŽIŪRĖTI VĖLIAU\n- Viskas, ką pradėjote ir niekada nebaigėte\n- Filtruokite pagal kanalą, trukmę, peržiūras ar žiūrėjimo laiką\n- Raskite tą vaizdo įrašą, kurį tikrai žiūrėjote, be begalinio slinkimo\n\nSTATISTIKA\n- Vaizdo įrašų trukmės ir metai, kai kanalui sekasi geriausiai\n- Palyginkite du kanalus greta\n- Stebėjimo sąrašas, randantis vaizdo įrašus, kurie lenkia įprastas savo kanalo peržiūras\n\nBe prisijungimo, be paskyros, niekas niekur nesiunčiama. Viskas veikia jūsų naršyklėje.\n\nPlėtinio sąsaja yra anglų kalba.\n\nNesusijęs su YouTube ar Google."},{"code":"lv","lang":"Latvian","d":"YouTube meklēšana nezina, ko jūs jau esat skatījies, nevar filtrēt pēc garuma vai skatījumiem, un meklēšana kanālā skatās tikai nosaukumus. Needle to labo tieši YouTube meklēšanas joslā.\n\nMEKLĒŠANAS JOSLĀ\n- Skatīties vēlāk, jums patikušie video un vēsture parādās jau rakstīšanas laikā\n- Rakstiet filtrus: \u003c20m, >100k, unwatched, date:week, @kanāls\n- is:fresh paslēpj to, kas jums jau ir parādīts\n- Sekojiet meklējumam, izslēdziet kanāla skaņu un katrā sīktēlā redziet, ko jau esat skatījies\n\nMEKLĒŠANA KANĀLĀ\nNospiediet adatas pogu jebkura kanāla cilnē Video. Needle nolasa visus kanāla video, ne tikai jau ielādētos.\n- Filtrējiet pēc garuma, skatījumiem, datuma un atslēgvārda\n- Paslēpiet līdz galam noskatīto vai atrodiet pusceļā pamesto\n- Izvēlieties, cik minūšu jums ir, un redziet tikai to, kas ietilpst\n\nVĒSTURE UN SKATĪTIES VĒLĀK\n- Viss, ko sākāt un nekad nepabeidzāt\n- Filtrējiet pēc kanāla, garuma, skatījumiem vai skatīšanās laika\n- Atrodiet to video, ko noteikti esat redzējis, bez bezgalīgas ritināšanas\n\nSTATISTIKA\n- Video garumi un gadi, kuros kanālam veicas vislabāk\n- Salīdziniet divus kanālus blakus\n- Novērošanas saraksts, kas atrod video, kuri pārspēj sava kanāla ierastos skatījumus\n\nBez pieteikšanās, bez konta, nekas netiek nekur sūtīts. Viss darbojas jūsu pārlūkā.\n\nPaplašinājuma saskarne ir angļu valodā.\n\nNav saistīts ar YouTube vai Google."},{"code":"et","lang":"Estonian","d":"YouTube'i otsing ei tea, mida sa oled juba vaadanud, ei oska filtreerida pikkuse ega vaatamiste järgi ja kanalisisene otsing vaatab ainult pealkirju. Needle parandab selle otse YouTube'i otsinguribal.\n\nOTSINGURIBAL\n- Vaata hiljem, meeldinud videod ja ajalugu ilmuvad juba trükkimise ajal\n- Sisesta filtreid: \u003c20m, >100k, unwatched, date:week, @kanal\n- is:fresh peidab selle, mida sulle on juba näidatud\n- Jälgi otsingut, vaigista kanal ja näe igal pisipildil, mida oled juba vaadanud\n\nOTSI KANALIST\nVajuta mis tahes kanali vahekaardil Videod nõelanuppu. Needle loeb kõik ka let done = {};
try { done = JSON.parse(localStorage.getItem("needle-paste") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("needle-paste", JSON.stringify(done)); } catch (e) {} };
const list = document.getElementById("list");
for (const it of items) {
  const row = document.createElement("div");
  row.className = "row" + (done[it.code] ? " done" : "");
  const tick = document.createElement("input");
  tick.type = "checkbox"; tick.checked = !!done[it.code];
  tick.onchange = () => { done[it.code] = tick.checked; row.classList.toggle("done", tick.checked); save(); };
  const label = document.createElement("div");
  label.innerHTML = '<span class="lang"></span><span class="code"></span>';
  label.firstChild.textContent = it.lang; label.lastChild.textContent = it.code;
  const btn = document.createElement("button");
  btn.textContent = "Copy";
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(it.d); }
    catch (e) { const t = document.createElement("textarea"); t.value = it.d; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    btn.textContent = "Copied"; btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1500);
  };
  const more = document.createElement("details");
  more.innerHTML = "<summary>Show text</summary><pre></pre>";
  more.querySelector("pre").textContent = it.d;
  row.append(tick, label, btn, more);
  list.appendChild(row);
}
