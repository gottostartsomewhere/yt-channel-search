<!doctype html>
<!--
  Renders the real panel, built by the real buildUi() against the real
  styles.css, on generated data. Lets the design be checked without loading the
  extension and hunting for a channel with the right shape of history.

  Open it directly in a browser. Not shipped: build.js only copies the paths in
  its SHARED list, and docs is not one of them.
-->
<html>
<head>
<meta charset="utf-8">
<title>Channel Search+ design preview</title>
<!-- Cache-busted on every load. Without this the browser keeps serving the
     stylesheet and modules from the last edit, which silently shows you the
     previous design and wastes a lot of time working out why. -->
<script>document.write('<link rel="stylesheet" href="../styles.css?t=' + Date.now() + '">');</script>
<style>
  body { margin: 0; background: #0f0f0f; font-family: Roboto, system-ui, sans-serif; }
  /* .ytcs-wrap is width:100%, so the preview's own padding has to be inside the
     box or the page overflows. Not an extension concern: in the real panel the
     wrap sits in YouTube's container and adds no padding of its own. */
  /* 56px of it stands in for YouTube's masthead. The panel's chrome is sticky
     at top:56px, so without that clearance sticky pushes the bar down over the
     stats line at rest and the preview lies about the layout. */
  .page { box-sizing: border-box; max-width: 1320px; margin: 0 auto; padding: 80px 24px 80px; }
</style>
</head>
<body>
<div class="page" id="page"></div>

<!-- Enough of the extension APIs for the modules to load. Everything that would
     actually touch chrome.* sits behind bootstrap, which is blocked below. -->
<script>
  window.chrome = {
    runtime: { id: "preview", onMessage: { addListener: function () {} }, sendMessage: function () {} },
    storage: { sync: { get: function (d, cb) { cb({}); }, set: function () {} } },
  };
  // panel.js self-starts unless this is already set. The preview drives
  // buildUi() itself, so keep bootstrap out of it.
  window.__ytcsLoaded = true;
</script>
<script>
  var bust = "?t=" + Date.now();
  ["core", "grid", "store", "charts", "analysis", "niche", "panel"].forEach(function (m) {
    document.write('<script src="../src/' + m + '.js' + bust + '"><\/script>');
  });
</script>
<script>
/*
 * Modelled on a real channel that broke the analytics: mostly short uploads
 * averaging under seven minutes, a two-year silence, and a handful of long,
 * heavily produced videos that massively outperformed. That combination used
 * to yield "the sweet spot is 20-30m, at 29.5x the channel median" off two
 * videos, and "114.1x bigger than in '13" from dividing by the first year.
 * Keep this shape: it is the case the notes have to stay honest about.
 */
function makeCatalog() {
  // Years 3 and 4 back are empty on purpose, to check the axis draws the gap.
  const perYear = { 13: 8, 12: 14, 11: 20, 10: 22, 9: 26, 8: 30, 7: 28, 6: 24, 5: 22, 4: 0, 3: 0, 2: 18, 1: 14, 0: 10 };
  /*
   * Per-year multiplier. Near zero for the opening years, peaking five years
   * back, declining since. This is the shape that broke the trend note: a
   * lifetime comparison called it "rising" because the near-empty early years
   * outvoted a peak the channel has been below ever since.
   */
  const arcByYear = { 13: 0.01, 12: 0.02, 11: 0.03, 10: 0.05, 9: 0.08, 8: 0.15, 7: 0.4, 6: 0.8, 5: 1.0, 4: 0, 3: 0, 2: 0.55, 1: 0.3, 0: 0.6 };
  const bands = [
    [60, 240, 0.6], [240, 600, 1.0], [600, 900, 1.3],
    // Long uploads are rare and self-selected, so they look spectacular.
    [1200, 1800, 14.0],
  ];
  const words = ["build", "survive", "review", "why", "the", "truth", "about", "cheap",
                 "best", "worst", "tested", "hours", "days", "actually", "works", "broke"];
  const rows = [];
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  Object.keys(perYear).forEach((ago) => {
    for (let i = 0; i < perYear[ago]; i++) {
      // Long videos stay rare: roughly one upload in fifteen.
      const b = rnd() < 0.07 ? bands[3] : bands[Math.floor(rnd() * 3)];
      const n = 3 + Math.floor(rnd() * 4);
      const title = [];
      for (let w = 0; w < n; w++) title.push(words[Math.floor(rnd() * words.length)]);
      const days = Number(ago) * 365 + Math.floor(rnd() * 360);
      rows.push({
        id: "v" + rows.length,
        title: title.join(" ").replace(/^./, (c) => c.toUpperCase()),
        views: Math.max(400, Math.round(4000000 * b[2] * arcByYear[ago] * (0.25 + rnd() * 2.4))),
        seconds: Math.round(b[0] + rnd() * (b[1] - b[0])),
        days: days,
        when: Math.round(days / 30) + " months ago",
        progress: rnd() < 0.3 ? Math.round(rnd() * 100) : 0,
      });
    }
  });
  return rows;
}

buildUi();
document.getElementById("page").appendChild(ui.wrap);
state.catalog = makeCatalog();
state.cachedAt = Date.now() - 7 * 60000;
state.medianViews = median(state.catalog.map((v) => v.views));
state.medianVpd = median(state.catalog.filter((v) => v.days).map((v) => v.views / v.days));
ui.status.textContent = state.catalog.length + " cached · 7m ago";
applyView();

// A second copy further down, showing Insights with a filter set, so both
// states can be compared in one screenshot pass.
const marker = document.createElement("div");
marker.style.cssText = "height:1px;background:#2a2a2a;margin:60px 0";
document.getElementById("page").appendChild(marker);
</script>
</body>
</html>
