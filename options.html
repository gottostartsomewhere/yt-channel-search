<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Channel Search+ options</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <header>
    <img src="icons/icon48.png" alt="" width="34" height="34">
    <div>
      <h1>Channel Search+</h1>
      <p class="sub">Settings apply the next time you open the panel.</p>
    </div>
  </header>

  <section>
    <h2>Reading a channel</h2>

    <label class="row" for="maxVideos">
      <span>
        <strong>Video limit</strong>
        <em>How deep to read a channel's back catalogue. Higher takes longer on
        big channels.</em>
      </span>
      <input type="number" id="maxVideos" min="30" max="10000" step="30">
    </label>

    <label class="row" for="finishedAt">
      <span>
        <strong>Count as finished at</strong>
        <em>Percent watched before a video is treated as done rather than still
        in progress.</em>
      </span>
      <input type="number" id="finishedAt" min="50" max="100" step="5">
    </label>
  </section>

  <section>
    <h2>Defaults</h2>

    <label class="row" for="defaultSort">
      <span>
        <strong>Opening sort</strong>
        <em>What the grid is sorted by when the panel opens.</em>
      </span>
      <select id="defaultSort">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="starthere">Start here</option>
        <option value="views_desc">Most views</option>
        <option value="vpd_desc">Views per day</option>
        <option value="trend_desc">Trending</option>
      </select>
    </label>

    <label class="row" for="hideWatched">
      <span>
        <strong>Hide finished videos</strong>
        <em>Start with everything you have already watched filtered out.</em>
      </span>
      <input type="checkbox" id="hideWatched">
    </label>

    <label class="row" for="autoOpen">
      <span>
        <strong>Open automatically</strong>
        <em>Take over the grid as soon as you land on a channel, without
        clicking.</em>
      </span>
      <input type="checkbox" id="autoOpen">
    </label>

    <label class="row" for="outlierX">
      <span>
        <strong>Outlier threshold</strong>
        <em>How many times the channel's normal pace a video must beat to earn a
        badge.</em>
      </span>
      <input type="number" id="outlierX" min="1.2" max="10" step="0.1">
    </label>
  </section>

  <section>
    <h2>Keyboard</h2>
    <p class="note">
      Alt+Y opens and closes the panel. Change it at
      <a href="#" id="shortcuts">chrome://extensions/shortcuts</a>.
    </p>
  </section>

  <footer>
    <button id="save">Save</button>
    <button id="reset" class="ghost">Reset to defaults</button>
    <span id="saved" class="saved"></span>
  </footer>
</main>
<script src="options.js"></script>
</body>
</html>
